<style>
/* Worksheet on graph paper. Blue ink for text, red pencil for the marked points. */
:root{
  --paper:#f2f6fc; --card:#ffffff; --ink:#13203a; --muted:#54627f; --line:#cdd7e9;
  --grid:rgba(52,96,170,.08); --accent:#1f4fd8; --accent-ink:#ffffff; --mark:#d9342b; --tri:#eaf0fc;
  --good:#17754a; --good-bg:#e4f4ea; --warn:#9a5b00; --warn-bg:#fff0d4; --bad:#b3261e; --bad-bg:#fde8e6;
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1730; --card:#142245; --ink:#e8eefc; --muted:#9fb0d4; --line:#2b3c6b;
    --grid:rgba(140,170,255,.07); --accent:#8aa9ff; --accent-ink:#0d1730; --mark:#ff7f72; --tri:#1a2b57;
    --good:#58d19a; --good-bg:#12372d; --warn:#f3b955; --warn-bg:#3b2d10; --bad:#ff8a80; --bad-bg:#40191b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1730; --card:#142245; --ink:#e8eefc; --muted:#9fb0d4; --line:#2b3c6b;
  --grid:rgba(140,170,255,.07); --accent:#8aa9ff; --accent-ink:#0d1730; --mark:#ff7f72; --tri:#1a2b57;
  --good:#58d19a; --good-bg:#12372d; --warn:#f3b955; --warn-bg:#3b2d10; --bad:#ff8a80; --bad-bg:#40191b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font:16px/1.65 var(--body); -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 72px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
sup{font-size:.72em;line-height:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.top b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.top nav{display:flex;gap:16px;flex-wrap:wrap}
.top nav a{color:var(--muted);text-decoration:none;border-bottom:1.5px solid transparent;padding-bottom:1px}

h1{font-size:clamp(2.3rem,8vw,3.9rem);font-weight:700;letter-spacing:-.01em}
h1 em{color:var(--accent);font-weight:600}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
.lead{font-size:1.08rem;color:var(--muted);max-width:56ch;margin:14px 0 0}

.hero{padding:12px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 22px;border-radius:10px;cursor:pointer;min-height:46px}

.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.9rem}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
label.fl{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}

.dt{border-collapse:collapse;margin:10px 0 2px;font-size:.95rem}
.dt th,.dt td{border:1px solid var(--line);padding:6px 14px;text-align:left}
.dt th{background:var(--paper)}
.figbox{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;max-width:400px;margin:10px 0}
.figbox.ms{max-width:none}
.figbox p{margin:2px 0}
.ms{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.ms .r{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ms .r b{min-width:54px;font-family:var(--display)}
.ms i{font-style:normal;min-width:30px;text-align:center;padding:2px 4px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums}

.pack{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.pk{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.pk:hover{border-color:var(--accent)}

.recap p{margin:0;font-size:.93rem}

.bar-sticky{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:10px 16px}

.qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.qn{font-weight:700;font-family:var(--display);font-size:1.08rem}
.stem{margin:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .ol{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt:has(input:checked){border-color:var(--accent);background:var(--tri)}
.opt:has(input:checked) .ol{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){cursor:default}
.opt:has(input:disabled):hover{border-color:var(--line)}
.opt.is-right,.opt.is-right:hover{border-color:var(--good);background:var(--good-bg)}
.opt.is-right .ol{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.is-wrong,.opt.is-wrong:hover{border-color:var(--bad);background:var(--bad-bg)}

.tfr .tx b{font-family:var(--display);margin-right:6px}
.tfr .exp{flex-basis:100%;margin-top:0}
.tfb{display:flex;gap:8px}
.tfb .opt{padding:7px 16px;border-radius:99px;font-weight:600;font-size:.92rem}
.sa{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.sa input{max-width:180px}
.warnbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin-top:16px}
.feed{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.94rem}

.feed.bad{background:var(--bad-bg);color:var(--bad)}
.feed.info{background:var(--warn-bg);color:var(--warn)}
.exp{background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.94rem}

.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:clamp(3rem,14vw,4.6rem);line-height:1;letter-spacing:-.02em}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts .chip{font-size:.85rem;padding:5px 12px}
.topic{padding:14px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0;padding-top:0}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.track{height:12px;border-radius:99px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.st{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.st.good{background:var(--good-bg);color:var(--good)}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.fill-good{background:var(--good)} .fill-warn{background:var(--warn)} .fill-bad{background:var(--bad)}
.advice{border-left:4px solid var(--mark);padding:2px 0 2px 14px;margin:10px 0}
.advice p{margin:4px 0}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
details.rv{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
details.rv summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .body{padding:0 14px 14px;border-top:1px dashed var(--line)}
.mark-ok{color:var(--good);font-weight:700} .mark-no{color:var(--bad);font-weight:700}
.ans-line{margin:6px 0;font-size:.94rem}
.codebox{display:flex;flex-direction:column;gap:8px}

table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.cell{font-weight:600;text-align:center}
td.cell.good{color:var(--good)} td.cell.warn{color:var(--warn)} td.cell.bad{color:var(--bad)}
.tablewrap{overflow-x:auto}
[hidden]{display:none!important}
footer{margin-top:40px;color:var(--muted);font-size:.8rem}
.ax{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.ah{fill:var(--ink)}
.tl{fill:var(--ink);font-size:15px;font-family:var(--body);font-variant-numeric:tabular-nums}
.ol0{fill:var(--muted);font:italic 600 15px var(--display)}
.pt{fill:var(--mark)}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;margin:0 .14em;font-size:.94em;font-variant-numeric:tabular-nums}
.fr>span{padding:0 .24em}
.fr>span:first-child{border-bottom:1.5px solid currentColor}
</style>

<script>
"use strict";
if(!window.GM)window.GM={onPractice(){return null;},onFinish(){return null;},barHTML(){return '';},resultHTML(){return '';},fx(){},refresh(){},sync(){},rebar(){},gate(){return true;}}; // gamify.js không tải được thì trang vẫn chạy bình thường
let RNG=Math.random,SEEDED=false;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;}
const ri=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const sel=a=>a[ri(0,a.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const sgn=()=>RNG()<.5?-1:1;
const B5=(function(){

/* ============ Số thập phân: cách viết ============ */
const N=x=>x<0?'−'+(-x):''+x;
const nb=s=>s.replace(/ /g,' ');
const fr=(n,d)=>`<span class="fr"><span>${N(n)}</span><span>${N(d)}</span></span>`;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
const grp=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const tbl=(head,rows)=>`<div style="overflow-x:auto"><table class="dt"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* khai triển thập phân của n/d (d > 0) bằng phép chia: phần nguyên ip, phần không lặp pre, chu kì per (rỗng nếu hữu hạn) */
function expand(n,d){
  const neg=n<0;n=Math.abs(n);
  const ip=Math.floor(n/d);let r=n%d;const idx={},dg=[];let st=-1;
  while(r!==0){
    if(idx[r]!==undefined){st=idx[r];break;}
    idx[r]=dg.length;r*=10;dg.push(Math.floor(r/d));r%=d;
  }
  return st<0?{neg,ip,pre:dg.join(''),per:''}:{neg,ip,pre:dg.slice(0,st).join(''),per:dg.slice(st).join('')};
}
const EQ=q=>expand(q[0],q[1]);
const digs=(e,k)=>{let s=e.pre;if(e.per)while(s.length<k)s+=e.per;else while(s.length<k)s+='0';return s.slice(0,k);};
const SG=e=>e.neg?'−':'';
const short=e=>SG(e)+grp(e.ip)+((e.pre||e.per)?','+e.pre+(e.per?'('+e.per+')':''):'');   // 0,2(7) hoặc 0,8
const longF=(e,reps)=>{if(!e.per)return short(e);return SG(e)+grp(e.ip)+','+e.pre+e.per.repeat(reps||3)+'...';};  // 0,2777...
const mkE=(neg,ip,pre,per)=>({neg,ip,pre,per});
const sameE=(a,b)=>a.neg===b.neg&&a.ip===b.ip&&digs(a,70)===digs(b,70);
const allNine=s=>s.length>0&&/^9+$/.test(s);
const isFinQ=q=>{let d=q[1]/gcd(q[0],q[1]);while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;};   // mẫu của phân số tối giản chỉ có ước nguyên tố 2 và 5

/* phân số ngẫu nhiên */
const DP=[3,6,9,11,12,15,18,22,24,30,33,36,37,45,55,66,90,99];   // mẫu cho phân số tối giản vô hạn tuần hoàn
const DP7=[7,13];
const DF=[2,4,5,8,10,16,20,25,40,50];                           // mẫu cho phân số tối giản hữu hạn
function qPer(maxPre,maxPer,opt){
  opt=opt||{};
  for(let n=0;n<4000;n++){
    const d=sel(opt.long?DP.concat(DP7):DP),m=ri(1,opt.big?4:2),num=ri(1,m*d);
    if(gcd(num,d)!==1)continue;
    const e=expand(num,d);
    if(e.pre.length<=maxPre&&e.per.length<=maxPer)return [(opt.neg?sgn():1)*num,d];
  }
  return [5,18];
}
function qFin(opt){
  opt=opt||{};
  for(;;){const d=sel(DF),num=ri(1,3*d);if(gcd(num,d)!==1||num%d===0)continue;return [(opt.neg?sgn():1)*num,d];}
}

/* làm tròn |n/d| đến hàng 10^(-pos) (chữ số kề sau từ 5 trở lên thì tăng 1); số âm làm tròn phần số rồi giữ dấu */
function roundTo(n,d,pos){
  const a=Math.abs(n);let t,nx;
  if(pos>=0){const s=Math.pow(10,pos);t=Math.floor(a*s/d);nx=Math.floor(a*s*10/d)%10;}
  else{const s=Math.pow(10,-pos);t=Math.floor(a/(d*s));nx=Math.floor(a/(d*s/10))%10;}
  return {R:t+(nx>=5?1:0),T:t,nx,pos,neg:n<0};
}
function fmtR(o,Rv){
  const R=Rv===undefined?o.R:Rv,pos=o.pos;let s;
  if(pos<=0)s=grp(R*Math.pow(10,-pos));
  else{const p=Math.pow(10,pos);s=grp(Math.floor(R/p))+','+String(R%p).padStart(pos,'0');}
  return (o.neg&&R!==0?'−':'')+s;
}
const numR=(o,Rv)=>{const R=Rv===undefined?o.R:Rv;return (o.neg?-1:1)*R*Math.pow(10,-o.pos);};
const HANG={'-2':'hàng trăm','-1':'hàng chục',0:'hàng đơn vị',1:'hàng phần mười',2:'hàng phần trăm',3:'hàng phần nghìn'};
const ACC={'-2':'50','-1':'5',0:'0,5',1:'0,05',2:'0,005',3:'0,0005'};
const UNIT={'-2':'100','-1':'10',0:'1',1:'0,1',2:'0,01',3:'0,001'};

/* ============ Dựng câu nhiều lựa chọn ============ */
function pickOpts(goodT,cands){
  const seen=new Set([goodT]),out=[];
  for(const c of cands){if(c&&!seen.has(c.t)){seen.add(c.t);out.push({t:c.t,err:c.err});}if(out.length===3)break;}
  return out;
}
const C=(t,err)=>({t,err});
const mk=(stem,good,cands,exp,meta)=>({stem,opts:[{t:good}].concat(pickOpts(good,cands)),ans:0,exp,meta});

const rev=s=>s.split('').reverse().join('');

/* các cách viết sai thường gặp của số thập phân vô hạn tuần hoàn e (pre, per) */
function repAlt(e){
  const out=[],pre=e.pre,per=e.per;
  const add=(p,q,err)=>{if(!q||allNine(q))return;const x=mkE(e.neg,e.ip,p,q);if(!sameE(x,e))out.push({e:x,err});};
  if(pre)add('',pre+per,'Phần chữ số không lặp lại ở đầu phải nằm ngoài ngoặc; chỉ các chữ số lặp lại mới thuộc chu kì.');
  if(pre.length>=2)add(pre.slice(0,-1),pre.slice(-1)+per,'Chữ số '+pre.slice(-1)+' không nằm trong chu kì: chu kì chỉ gồm các chữ số lặp lại mãi.');
  if(per.length>=2){
    add(pre,per[0],'Cả nhóm chữ số lặp lại phải nằm trong ngoặc, không chỉ chữ số đầu tiên.');
    add(pre,per.slice(1)+per[0],'Các chữ số trong chu kì phải đúng thứ tự lặp lại.');
    add(pre,per+per[0],'Chu kì là nhóm chữ số lặp lại, không thêm chữ số vào cuối.');
    add(pre,per.slice(0,-1),'Chu kì thiếu chữ số cuối: cả nhóm '+per+' lặp lại.');
  }
  if(per.length===1&&pre)add(pre.slice(0,-1),pre.slice(-1),'Chu kì là chữ số '+per+' lặp lại mãi, không phải chữ số '+pre.slice(-1)+'.');
  for(let k=0;k<3;k++){const q=per.split('');const i=ri(0,q.length-1);q[i]=String((+q[i]+ri(1,8))%10);add(pre,q.join(''),'Các chữ số trong chu kì không khớp với số đã cho.');}
  return shuffle(out);
}
const finTrunc=e=>{const k=e.pre.length+e.per.length+(e.per.length?0:1);return SG(e)+grp(e.ip)+','+digs(e,Math.max(k,2));};

const oddP=d=>{while(d%2===0)d/=2;while(d%5===0)d/=5;for(let p=3;p<=d;p+=2)if(d%p===0)return p;return d;};
const isPeriodOf=(e,s)=>{if(!s)return true;for(let j=0;j<=e.pre.length+s.length+1;j++){if(sameE(mkE(e.neg,e.ip,digs(e,j),s),e))return true;}return false;};
const longN=(e,minDig)=>longF(e,Math.max(3,Math.ceil((minDig-e.pre.length)/Math.max(e.per.length,1))));
const ch=(e,j)=>j<1?'':digs(e,j)[j-1];
const errPer=(e,s)=>`${s} không phải là nhóm chữ số lặp lại mãi trong ${longF(e)}`;
const E_RULE='Số thập phân hữu hạn có hữu hạn chữ số sau dấu phẩy; số thập phân vô hạn tuần hoàn có một chữ số hay một nhóm chữ số lặp lại mãi.';
const E_RND='Chữ số kề sau hàng làm tròn từ 5 trở lên thì tăng chữ số hàng làm tròn thêm 1, nhỏ hơn 5 thì giữ nguyên.';

function roundCands(o,q){
  const cs=[];
  cs.push(C(fmtR(o,o.T),o.nx>=5?`Chữ số kề sau hàng làm tròn là ${o.nx}, không nhỏ hơn 5, nên phải tăng chữ số hàng làm tròn thêm 1.`:`Chữ số kề sau hàng làm tròn là ${o.nx}, nhỏ hơn 5, nên giữ nguyên chữ số hàng làm tròn.`));
  cs.push(C(fmtR(o,o.R+1),'Sai chữ số ở hàng làm tròn: hãy xét chữ số kề sau hàng làm tròn.'));
  if(o.T>0)cs.push(C(fmtR(o,o.R-1),'Sai chữ số ở hàng làm tròn: hãy xét chữ số kề sau hàng làm tròn.'));
  if(o.pos>-2){const c=roundTo(q[0],q[1],o.pos-1);cs.push(C(fmtR(c),`Bạn đã làm tròn đến ${HANG[o.pos-1]}, quá sớm so với yêu cầu.`));}
  if(o.pos<3){const c=roundTo(q[0],q[1],o.pos+1);cs.push(C(fmtR(c),`Bạn đã giữ thừa một chữ số: phải làm tròn đến ${HANG[o.pos]}.`));}
  const vv=t=>Number(String(t).replace(/\s/g,'').replace(',','.').replace('−','-'));
  const seenV=new Set([vv(fmtR(o))]),out=[];
  cs.forEach(c=>{const v=vv(c.t);if(!seenV.has(v)){seenV.add(v);out.push(c);}});
  return out;
}
function ltQ(){
  const pos=sel([0,1,1,2,2,3,-1]);
  for(;;){
    const q=pos===-1?(()=>{const p=qPer(1,3);return [ri(10,60)*p[1]+p[0],p[1]];})():qPer(1,3,{big:true});
    const e=EQ(q);if(e.per&&!allNine(e.per))return {q:RNG()<.2?[-q[0],q[1]]:q,pos};
  }
}
function genLtRound(){return tryGen(()=>{
  const {q,pos}=ltQ(),e=EQ(q),o=roundTo(q[0],q[1],pos);
  const r=mk(`Làm tròn số ${longN(e,Math.max(pos,0)+3)} đến ${HANG[pos]}.`,fmtR(o),roundCands(o,q),`${E_RND} Ở số ${longN(e,Math.max(pos,0)+3)}, chữ số kề sau ${HANG[pos]} là ${o.nx}${o.nx>=5?', không nhỏ hơn 5, nên tăng thêm 1':', nhỏ hơn 5, nên giữ nguyên'}. Kết quả: ${fmtR(o)}.`);
  r.meta={n:q[0],d:q[1],pos};return r;
});}
function genLtAccR(){return tryGen(()=>{
  const {q,pos}=ltQ();if(pos<0)return null;
  const e=EQ(q),o=roundTo(q[0],q[1],pos);
  const r=mk(`Làm tròn số ${longN(e,pos+3)} với độ chính xác ${ACC[pos]}.`,fmtR(o),roundCands(o,q),`Độ chính xác ${ACC[pos]} ứng với làm tròn đến ${HANG[pos]}. ${E_RND} Kết quả: ${fmtR(o)}.`);
  r.meta={n:q[0],d:q[1],pos,acc:true};return r;
});}
function genLtBig(){return tryGen(()=>{
  const pos=sel([-2,-1,0,1]),x=[ri(1000,99999)*100+ri(1,99),100];
  if(x[0]%10===0)return null;
  const o=roundTo(x[0],x[1],pos),e=EQ(x);
  const r=mk(`Làm tròn số ${short(e)} với độ chính xác ${ACC[pos]}.`,fmtR(o),roundCands(o,x),`Độ chính xác ${ACC[pos]} ứng với làm tròn đến ${HANG[pos]}. ${E_RND} Kết quả: ${fmtR(o)}.`);
  r.meta={n:x[0],d:x[1],pos,acc:true};return r;
});}
const dec1=x10=>N(Math.floor(x10/10))+(x10%10?','+(x10%10):'');
function estData(){
  const d=sel([3,9,11,33,99]),ip=ri(10,59),num=ri(1,d-1);
  if(gcd(num,d)!==1)return null;
  const A=[ip*d+num,d],B=[ri(21,99),10];
  if(B[0]%10===0)return null;
  const ra=roundTo(A[0],A[1],0).R,rb=roundTo(B[0],B[1],0).R,fa=Math.floor(A[0]/A[1]),fb=Math.floor(B[0]/B[1]);
  return {A,B,ra,rb,fa,fb};
}
function genLtEst(){return tryGen(()=>{
  const D=estData();if(!D)return null;
  const {A,B,ra,rb,fa,fb}=D,eA=EQ(A),eB=EQ(B);
  const cs=[
   C(dec1(ra*B[0]),'Bạn chỉ làm tròn thừa số thứ nhất; cần làm tròn cả hai thừa số đến hàng đơn vị rồi mới nhân.'),
   C(N(fa*rb),`Chữ số phần mười của ${short(eA)} không phải 0 nhưng bạn đã bỏ phần thập phân; phải làm tròn theo quy tắc (từ 5 trở lên thì tăng 1).`),
   C(N(ra*fb),`Chữ số phần mười của ${short(eB)} là ${B[0]%10}; phải làm tròn theo quy tắc (từ 5 trở lên thì tăng 1).`),
   C(N(fa*fb),'Làm tròn phải theo quy tắc chữ số kề sau từ 5 trở lên thì tăng 1, không phải bỏ phần thập phân.'),
   C(N(ra+rb),'Đây là tổng hai số đã làm tròn; đề bài yêu cầu tích.')];
  const r=mk(`Ước lượng kết quả phép tính ${short(eA)} · ${short(eB)} bằng cách làm tròn hai thừa số đến hàng đơn vị.`,N(ra*rb),cs,`${short(eA)} ≈ ${ra}; ${short(eB)} ≈ ${rb}. Tích ước lượng: ${ra} · ${rb} = ${ra*rb}.`);
  r.meta={A,B};return r;
});}

function ckItem(lv){
  const e=EQ(qPer(2,3,{neg:RNG()<.3})),t=ri(0,lv==='VD'?5:4),alt=repAlt(e)[0];
  if(t===0)return IT(`Số ${longF(e)} có chu kì là ${e.per}`,true,'ck','TH',`Nhóm chữ số ${e.per} lặp lại mãi nên chu kì là ${e.per}.`);
  if(t===1){const bad=repAlt(e).filter(a=>!isPeriodOf(e,a.e.per))[0];if(!bad)return null;return IT(`Số ${longF(e)} có chu kì là ${bad.e.per}`,false,'ck','TH',`Chu kì của ${longF(e)} là ${e.per}, không phải ${bad.e.per}.`);}
  if(t===2)return IT(`${longF(e)} = ${short(e)}`,true,'ck','TH',`Chu kì ${e.per} đặt trong ngoặc, phần ${e.pre||'(không có)'} không lặp lại nằm ngoài ngoặc.`);
  if(t===3){if(!alt)return null;return IT(`${longF(e)} = ${short(alt.e)}`,false,'ck','TH',`${longF(e)} = ${short(e)}. ${alt.err}`);}
  if(t===4){const k=ri(e.pre.length+e.per.length+1,13),g=ch(e,k),ok=RNG()<.5,bad=digOpts(e,k)[0],x=ok?g:bad.t;return IT(`Chữ số thập phân thứ ${k} của ${short(e)} là ${x}`,ok,'ck','TH',`${short(e)} = ${longN(e,k)}; chữ số thập phân thứ ${k} là ${g}.`);}
  const k=ri(30,99),g=ch(e,k),ok=RNG()<.5,x=ok?g:digOpts(e,k)[0].t;
  return IT(`Chữ số thập phân thứ ${k} của ${short(e)} là ${x}`,ok,'ck','VD',`Sau ${e.pre.length} chữ số không lặp lại, chu kì ${e.per} lặp lại; chữ số thập phân thứ ${k} là ${g}.`);
}
function pdItem(lv){

  if(t===2){const q=qPer(1,3),e=EQ(q);return IT(`${fr(q[0],q[1])} = ${short(e)}`,true,'pd','TH',`Chia ${q[0]} cho ${q[1]} được ${longF(e)} = ${short(e)}.`);}

  if(t===4){const q=qPer(1,3),e=EQ(q),ok=RNG()<.5,bad=repAlt(e).filter(a=>!isPeriodOf(e,a.e.per))[0];if(!bad)return null;const x=ok?e.per:bad.e.per;return IT(`Chu kì của số thập phân biểu diễn ${fr(q[0],q[1])} là ${x}`,ok,'pd','TH',`${fr(q[0],q[1])} = ${short(e)} nên chu kì là ${e.per}.`);}
  if(t===5){const q=qPer(1,3),nq=[-q[0],q[1]],e=EQ(nq),ok=RNG()<.5,x=ok?short(e):short(EQ(q));return IT(`${fr(nq[0],nq[1])} = ${x}`,ok,'pd','TH',`${fr(q[0],q[1])} = ${short(EQ(q))} nên ${fr(nq[0],nq[1])} = ${short(e)}.`);}

  const u=qPer(1,3),mm=sel([2,3,4,5]);return IT(`${fr(u[0]*mm,u[1]*mm)} viết được dưới dạng số thập phân hữu hạn`,false,'pd','VD',`Rút gọn ${fr(u[0]*mm,u[1]*mm)} = ${fr(u[0],u[1])}, mẫu ${u[1]} có ước nguyên tố ${oddP(u[1])} khác 2 và 5 nên là số thập phân vô hạn tuần hoàn.`);
}
function ltItem(lv){

  if(t===0){const {q,pos}=ltQ(),e=EQ(q),o=roundTo(q[0],q[1],pos);return IT(`Làm tròn số ${longN(e,Math.max(pos,0)+3)} đến ${HANG[pos]} được ${fmtR(o)}`,true,'lt','TH',`${E_RND} Chữ số kề sau ${HANG[pos]} là ${o.nx}, kết quả ${fmtR(o)}.`);}
  if(t===1){const {q,pos}=ltQ(),e=EQ(q),o=roundTo(q[0],q[1],pos),bad=roundCands(o,q).filter(c=>c.t!==fmtR(o))[0];return IT(`Làm tròn số ${longN(e,Math.max(pos,0)+3)} đến ${HANG[pos]} được ${bad.t}`,false,'lt','TH',`Kết quả đúng là ${fmtR(o)}. ${bad.err}`);}
  if(t===2){const pos=sel([-2,-1,0,1,2]);return IT(`Làm tròn đến ${HANG[pos]} thì kết quả có độ chính xác là ${ACC[pos]}`,true,'lt','NB',`Độ chính xác bằng một nửa của ${UNIT[pos]}, tức ${ACC[pos]}.`);}

  if(t===4){const pos=sel([0,1,2]),q=qPer(1,3,{big:true}),e=EQ(q),o=roundTo(q[0],q[1],pos),ok=RNG()<.5,x=ok?o.R:o.R+1;return IT(`${short(e)} ≈ ${fmtR(o,x)} với độ chính xác ${ACC[pos]}`,ok,'lt','TH',`Độ chính xác ${ACC[pos]} ứng với làm tròn đến ${HANG[pos]}: ${short(e)} ≈ ${fmtR(o)}.`);}
  const pos=sel([-2,-1,0,1]),x=[ri(1000,99999)*100+ri(1,99),100];if(x[0]%10===0)return null;
  const o=roundTo(x[0],x[1],pos),ok=RNG()<.5,bad=roundCands(o,x).filter(c=>c.t!==fmtR(o))[0];
  return IT(`Làm tròn số ${short(EQ(x))} với độ chính xác ${ACC[pos]} được ${ok?fmtR(o):bad.t}`,ok,'lt','VD',`Độ chính xác ${ACC[pos]} ứng với làm tròn đến ${HANG[pos]}; kết quả đúng là ${fmtR(o)}.`);
}

  for(const c of cands){if(c&&!seen.has(c.t)){seen.add(c.t);out.push({t:c.t,err:c.err});}if(out.length===3)break;}
  return out;
}

function irrOpt(){ // số vô tỉ dạng chuỗi + lí do
  const t=ri(0,3);
  if(t===0||t===1){let n;do{n=ri(2,60);}while(isSq(n));return C(SQ(n),`${SQ(n)} là căn bậc hai số học của số tự nhiên không chính phương nên là số vô tỉ.`);}
  if(t===2)return C('π','π = 3,14159265358... là số thập phân vô hạn không tuần hoàn nên là số vô tỉ.');
  const k=ri(1,9);return C(RNG()<.5?PAT(k):'−'+PAT(k),PAT_ERR);
}
function ratOpt(trap){ // số hữu tỉ dạng chuỗi + lí do
  const t=trap?0:ri(0,4);
  if(t===0){const s=ri(2,12);return C(SQ(s*s),`${SQ(s*s)} = ${s} là số tự nhiên nên là số hữu tỉ, không phải số vô tỉ.`);}
  if(t===1){const x=FINS();return C(x,`${x} có hữu hạn chữ số sau dấu phẩy nên là số hữu tỉ.`);}
  if(t===2){const x=sel(PERS);return C(x,`${x} là số thập phân vô hạn tuần hoàn nên là số hữu tỉ.`);}
  if(t===3){const b=sel([3,7,9,11,13]),a=ri(1,b-1);return C(fr(a,b),`${fr(a,b)} viết được dưới dạng phân số nên là số hữu tỉ.`);}
  return C('−'+ri(2,30),'Số nguyên là số hữu tỉ.');
}

function nonsq(lo,hi){let n;do{n=ri(lo,hi);}while(isSq(n));return n;}
function rootCands(n,p){ // các giá trị sai khi làm tròn √n đến p chữ số thập phân
  const R=rdSqrt(n,p),f=isq(n*Math.pow(10,2*p+2)),T=Math.floor(f/10),out=[];
  const add=(val,pp,err)=>{if(pp>0&&val%10===0)return;out.push(C(scStr(val,pp),err));};
  if(T!==R)add(T,p,`Chữ số kề sau là ${f%10}, từ 5 trở lên nên phải tăng chữ số hàng làm tròn thêm 1, không chỉ cắt bỏ.`);
  add(R+1,p,'Sai chữ số ở hàng làm tròn: hãy xét chữ số kề sau hàng làm tròn.');
  if(R>0)add(R-1,p,'Sai chữ số ở hàng làm tròn: hãy xét chữ số kề sau hàng làm tròn.');
  if(p>=1)add(rdSqrt(n,p-1),p-1,`Bạn đã làm tròn đến ${HANGP[p-1]}, quá sớm so với yêu cầu.`);
  if(p<=2)add(rdSqrt(n,p+1),p+1,`Bạn đã giữ thừa một chữ số: phải làm tròn đến ${HANGP[p]}.`);
  return out;
}

  const t=ri(0,lv==='VD'?8:5);
  if(t===0){const n=nonsq(2,80);return IT(`${SQ(n)} là số vô tỉ`,true,'vt','TH',`${n} không là bình phương của số tự nhiên nào nên ${SQ(n)} là số vô tỉ.`);}
  if(t===1){const s=ri(2,12);return IT(`${SQ(s*s)} là số vô tỉ`,false,'vt','TH',`${SQ(s*s)} = ${s} là số tự nhiên nên là số hữu tỉ.`);}
  if(t===2){const s=ri(2,12);return IT(`${SQ(s*s)} là số hữu tỉ`,true,'vt','TH',`${SQ(s*s)} = ${s} là số tự nhiên nên là số hữu tỉ.`);}
  if(t===3){const k=ri(1,9);return IT(`${PAT(k)} là số vô tỉ`,true,'vt','TH',PAT_ERR);}
  if(t===4){const x=sel(PERS);return IT(`${x} là số vô tỉ`,false,'vt','TH',`${x} là số thập phân vô hạn tuần hoàn nên là số hữu tỉ.`);}
  if(t===5){const n=nonsq(2,80);return IT(`${SQ(n)} là số hữu tỉ`,false,'vt','TH',`${SQ(n)} là số vô tỉ vì ${n} không là số chính phương.`);}
  if(t===6)return IT('Mọi số thập phân vô hạn đều là số vô tỉ',false,'vt','VD','Số thập phân vô hạn tuần hoàn (như 0,(3)) vô hạn nhưng là số hữu tỉ.');
  if(t===7)return IT('Số thập phân hữu hạn là số vô tỉ',false,'vt','VD','Số thập phân hữu hạn viết được dưới dạng phân số nên là số hữu tỉ.');
  return IT('Số vô tỉ viết được dưới dạng số thập phân vô hạn không tuần hoàn',true,'vt','VD','Đây chính là định nghĩa số vô tỉ.');
}
function cbItem(lv){
  const t=ri(0,lv==='VD'?9:6),s=ri(3,15),n=s*s;
  if(t===0)return IT(`${SQ(n)} = ${s}`,true,'cb','TH',`${s}² = ${grp(n)} và ${s} > 0 nên ${SQ(n)} = ${s}.`);
  if(t===1)return IT(`${SQ(n)} = −${s}`,false,'cb','TH',`Căn bậc hai số học là số không âm nên ${SQ(n)} = ${s}.`);
  if(t===2)return IT(`${SQ(n)} = ${dt(n/2)}`,false,'cb','TH',`${dt(n/2)}² khác ${grp(n)}; ${SQ(n)} = ${s}.`);
  if(t===3)return IT(`${SQ2(s)} = ${s}`,true,'cb','TH',`Với số dương a, √(a²) = a.`);
  if(t===4)return IT(`${SQ2(s)} = ${grp(n)}`,false,'cb','TH',`√(a²) = a nên ${SQ2(s)} = ${s}.`);
  if(t===5){const m=ri(2,99);return IT(`(${SQ(m)})² = ${grp(m)}`,true,'cb','TH',`Theo định nghĩa, (√a)² = a với a ≥ 0.`);}
  if(t===6){const m=ri(2,99);return IT(`(${SQ(m)})² = ${SQ(m)}`,false,'cb','TH',`(√${m})² = ${m}, khác ${SQ(m)}.`);}
  const s1=ri(2,9),s2=ri(2,9);if(s1===s2)return cbItem(lv);
  if(t===7)return IT(`${SQ(s1*s1)} + ${SQ(s2*s2)} = ${SQ(s1*s1+s2*s2)}`,false,'cb','VD',`${SQ(s1*s1)} + ${SQ(s2*s2)} = ${s1} + ${s2} = ${s1+s2}; không được cộng các số dưới dấu căn.`);
  if(t===8)return IT(`${SQ(s1*s1)} + ${SQ(s2*s2)} = ${s1+s2}`,true,'cb','VD',`${SQ(s1*s1)} = ${s1}, ${SQ(s2*s2)} = ${s2} nên tổng là ${s1+s2}.`);
  return IT(`Số ${grp(n)} có hai căn bậc hai số học là ${s} và −${s}`,false,'cb','VD','Mỗi số không âm chỉ có một căn bậc hai số học, và nó không âm.');
}
function mtItem(lv){
  const t=ri(0,lv==='VD'?5:4);
  if(t===0){const p=sel([1,2,3]),n=nonsq(2,300),R=rdSqrt(n,p);if(R%10===0)return null;const ok=RNG()<.5,c=rootCands(n,p)[0];if(!c)return null;
    return IT(`Làm tròn ${SQ(n)} đến ${HANGP[p]} được ${ok?scStr(R,p):c.t}`,ok,'mt','TH',`${SQ(n)} = ${scStr(rdSqrt(n,p+3),p+3)}... làm tròn đến ${HANGP[p]} được ${scStr(R,p)}.`);}
  if(t===1){const n=nonsq(10,300),k=isq(n),ok=RNG()<.5,a=ok?k:k+(RNG()<.5?1:-1);return IT(`${SQ(n)} nằm giữa ${a} và ${a+1}`,ok,'mt','TH',`${k}² = ${k*k} < ${n} < ${(k+1)*(k+1)} = ${k+1}² nên ${SQ(n)} nằm giữa ${k} và ${k+1}.`);}
  if(t===2){const n=nonsq(10,300),k=isq(n),b=RNG()<.5?k:k+1,r=sgnOf(n,b*b),ok=RNG()<.5,x=ok?r:(r==='>'?'<':'>');return IT(`${SQ(n)} ${x} ${b}`,ok,'mt','TH',`${b}² = ${b*b}, mà ${n} ${r==='>'?'>':'<'} ${b*b} nên ${SQ(n)} ${r} ${b}.`);}
  if(t===3){const sq=RNG()<.5,s=ri(3,20),n=sq?s*s:nonsq(2,200);return IT(`Kết quả ${SQ(n)} hiện trên máy tính cầm tay là giá trị đúng của ${SQ(n)}`,sq,'mt','TH',sq?`${SQ(n)} = ${s} là số tự nhiên, máy tính cho kết quả đúng.`:`${SQ(n)} là số vô tỉ nên kết quả trên máy tính chỉ là giá trị gần đúng.`);}
  if(t===4){const p=ri(0,3),ok=RNG()<.5,q=ok?p:(p===0?1:p-1);return IT(`Làm tròn với độ chính xác ${ACCP[p]} là làm tròn đến ${HANGP[q]}`,ok,'mt','TH',`Độ chính xác ${ACCP[p]} ứng với làm tròn đến ${HANGP[p]}.`);}
  const n=nonsq(10,300),k=isq(n),ok=RNG()<.5,a=ok?k:k+1;return IT(`${SQ(n)} − ${a} nằm giữa 0 và 1`,ok,'mt','VD',`${k} < ${SQ(n)} < ${k+1} nên ${SQ(n)} − ${k} nằm giữa 0 và 1${ok?'':`, còn ${SQ(n)} − ${k+1} là số âm`}.`);
}
function ttItem(lv){
  const t=ri(0,lv==='VD'?5:4);
  if(t===0){const s=ri(5,40),ok=RNG()<.5,v=ok?s:sel([s*s/4,s*s/2,2*s,s+3]);return IT(`Hình vuông diện tích ${grp(s*s)} m² có cạnh dài ${dt(v)} m`,ok,'tt','TH',`Cạnh dài ${SQ(s*s)} = ${s} m.`);}
  if(t===1){const s=ri(4,40),ok=RNG()<.5,v=ok?4*s:sel([s,2*s,8*s]);return IT(`Hình vuông diện tích ${grp(s*s)} m² có chu vi ${dt(v)} m`,ok,'tt','TH',`Cạnh dài ${s} m, chu vi là 4 · ${s} = ${4*s} m.`);}
  if(t===2){const k=ri(1,9),ok=RNG()<.5;return IT(`Hình chữ nhật có hai cạnh ${3*k} dm và ${4*k} dm có đường chéo dài ${ok?5*k:7*k} dm`,ok,'tt','TH',`d² = ${(3*k)*(3*k)} + ${(4*k)*(4*k)} = ${25*k*k} nên d = ${5*k} dm.`);}
  if(t===3){const ok=RNG()<.5;return IT(`1 ha = ${ok?'10 000':'100'} m²`,ok,'tt','TH','1 ha = 1 hm² = 100 m · 100 m = 10 000 m².');}
  if(t===4){const h=sel([1,4,9,16]),s=isq(h),ok=RNG()<.5;return IT(`Mảnh đất hình vuông diện tích ${h} ha có cạnh dài ${ok?100*s:10*s} m`,ok,'tt','TH',`${h} ha = ${grp(h*10000)} m², cạnh dài ${grp(100*s)} m.`);}
  const a=ri(4,20),b=ri(3,a-1);return IT(`Hình chữ nhật có hai cạnh ${a} dm và ${b} dm có đường chéo dài ${a+b} dm`,false,'tt','VD',`d² = ${a}² + ${b}² = ${a*a+b*b} < (${a}+${b})² = ${(a+b)*(a+b)}, nên đường chéo ngắn hơn ${a+b} dm.`);
}

function saVtCnt(){
  const z=ri(1,4),items=[],used=new Set();let c=0;
  const add=t=>{if(!used.has(t)){used.add(t);items.push(t);return true;}return false;};
  while(c<z){const o=irrOpt();if(add(o.t))c++;}
  while(items.length<6){const o=ratOpt(RNG()<.5);add(o.t);}
  const all=shuffle(items);
  return {stem:`Trong các số sau, có bao nhiêu số là số vô tỉ? ${all.join('; ')}.`,ans:[z],exp:`Số vô tỉ là số thập phân vô hạn không tuần hoàn: ${items.slice(0,z).join('; ')}. Các số còn lại là số hữu tỉ (số tự nhiên, số nguyên, phân số, số thập phân hữu hạn hoặc vô hạn tuần hoàn, hoặc căn của số chính phương). Có ${z} số vô tỉ.`,meta:{z}};
}
function saCbVal(){
  const t=ri(0,2);
  if(t===0){const s=ri(2,40),n=s*s;return {stem:`Tính ${SQ(n)}.`,ans:[s],exp:`Vì ${s}² = ${grp(n)} và ${s} > 0 nên ${SQ(n)} = ${s}.`,meta:{t}};}
  if(t===1){const a=sel([191,2021,365,1000,111,77,50]);return {stem:`Tính ${SQ2(a)}.`,ans:[a],exp:`Vì ${grp(a)} > 0 nên ${SQ2(a)} = ${grp(a)}.`,meta:{t}};}
  let s;do{s=ri(11,39);}while(s%10===0);
  return {stem:`Tính ${SQD(s*s/100)}.`,ans:[s/10],at:dt(s/10),exp:`Vì ${dt(s/10)}² = ${dt(s*s/100)} và ${dt(s/10)} > 0 nên ${SQD(s*s/100)} = ${dt(s/10)}.`,meta:{t}};
}
function saCbSum(){

}

  const A=`${m} − ${SQ(n)}`,Bq=`${SQ(n)} − ${m}`;
  const good=pos?Bq:A,bad=pos?A:Bq;
  const cs=[C(bad,pos?`${SQ(n)} > ${m} nên √${n} − ${m} > 0; biểu thức trong dấu giá trị tuyệt đối là số dương.`:`${SQ(n)} < ${m} nên √${n} − ${m} < 0, kết quả phải là số đối của nó.`),C(`${m} + ${SQ(n)}`,'Không được cộng hai số: giá trị tuyệt đối chỉ giữ hoặc đổi dấu biểu thức bên trong.'),C(`−${m} − ${SQ(n)}`,'Giá trị tuyệt đối không âm nên không thể bằng một số âm.')];
  return mk(`Với √${n} ${pos?'>':'<'} ${m}, giá trị của |${SQ(n)} − ${m}| bằng:`,good,cs,`${m}² = ${m*m} ${pos?'<':'>'} ${n} nên ${SQ(n)} ${pos?'>':'<'} ${m}, tức ${SQ(n)} − ${m} ${pos?'>':'<'} 0. Do đó |${SQ(n)} − ${m}| = ${good}.`,{n,m});
});}
function genGtSolve(){return tryGen(()=>{
  const t=ri(0,3);let k;if(t===0)k=sel(['2,5','4,2','0,75','6,4']);else if(t===1)k=String(ri(2,30));else if(t===2)k=SQ(nonsq(2,30));else{const b=sel([5,7,9]),a=ri(1,b-1);if(gcd(a,b)!==1)return null;k=fr(a,b);}
  const cs=[C(`x = ${k}`,'Thiếu giá trị âm: hai số đối nhau có cùng giá trị tuyệt đối.'),C(`x = −${k}`,'Thiếu giá trị dương: hai số đối nhau có cùng giá trị tuyệt đối.'),C('x = 0','|0| = 0, không bằng '+k.replace(/<[^>]+>/g,'')+'.')];
  return mk(`Tìm tất cả các số thực x thỏa mãn |x| = ${k}.`,`x = ${k} hoặc x = −${k}`,cs,`Hai số có giá trị tuyệt đối bằng ${k} là ${k} và −${k}.`,{k});
});}
function genGtCount(){return tryGen(()=>{
  const k=ri(2,9),le=RNG()<.5,good=le?2*k+1:2*k-1;

  return mk(`Có bao nhiêu số nguyên x thỏa mãn |x| ${le?'≤':'<'} ${k}?`,String(good),cs,le?`Các số nguyên là −${k}, ..., 0, ..., ${k}: có 2 · ${k} + 1 = ${good} số.`:`Các số nguyên là −${k-1}, ..., 0, ..., ${k-1}: có 2 · ${k-1} + 1 = ${good} số.`,{k,le});
});}

function srItem(lv){

  if(t===2){const b=ratOpt(RNG()<.4);return IT(`${b.t} ∈ ℚ`,true,'sr','TH',`${b.t} là số hữu tỉ nên ${b.t} ∈ ℚ.`);}

  return IT('Số vô tỉ nào cũng là số thực',true,'sr','VD','Số hữu tỉ và số vô tỉ được gọi chung là số thực.');

  if(t===1){const n=nonsq(2,150),ok=RNG()<.5;return IT(`Điểm biểu diễn số −${SQ(n)} nằm ${ok?'bên trái':'bên phải'} gốc O`,ok,'ts','TH',`−${SQ(n)} là số âm nên điểm biểu diễn nằm bên trái gốc O.`);}
  if(t===2){const ok=RNG()<.5;return IT(`Hai điểm biểu diễn các số x và −x ${ok?'cách đều':'không cách đều'} gốc O`,ok,'ts','TH','Hai số đối nhau có cùng giá trị tuyệt đối nên cách đều gốc O.');}

  if(t===4){const ok=RNG()<.5;return IT(`Mỗi điểm trên trục số đều biểu diễn một số ${ok?'thực':'hữu tỉ'}`,ok,'ts','TH','Mỗi điểm trên trục số biểu diễn một số thực (có thể là số vô tỉ).');}
  if(t===5){const a=ri(1,6),b=ri(1,6);const n=a*a+b*b;if(isSq(n))return tsItem(lv);return IT(`Hình vuông có diện tích bằng tổng diện tích hai hình vuông cạnh ${a} và cạnh ${b} thì có cạnh ${SQ(n)}`,true,'ts','VD',`Diện tích là ${a}² + ${b}² = ${n} nên cạnh = ${SQ(n)}.`);}
  const a=ri(1,6),b=ri(1,6),n=a*a+b*b;if(isSq(n)||a+b===n)return tsItem(lv);return IT(`Hình vuông có diện tích bằng tổng diện tích hai hình vuông cạnh ${a} và cạnh ${b} thì có cạnh ${SQ(a+b)}`,false,'ts','VD',`Diện tích là ${a}² + ${b}² = ${n}, nên cạnh = ${SQ(n)}, không phải ${SQ(a+b)}.`);
}
function ssItem(lv){

  if(t===5){const a=ri(2,99),b=ri(2,99);if(a===b)return null;const rel=a>b?'<':'>',ok=RNG()<.5,x=ok?rel:(rel==='<'?'>':'<');return IT(`−${SQ(a)} ${x} −${SQ(b)}`,ok,'ss','VD',`${SQ(a)} ${a>b?'>':'<'} ${SQ(b)}; với số âm chiều đổi ngược lại nên −${SQ(a)} ${rel} −${SQ(b)}.`);}

}
function gtItem(lv){

  if(t===4){const v=ri(2,40),ok=RNG()<.5;return IT(`|${v}| = |−${v}|${ok?'':' + 1'}`,ok,'gt','TH','Hai số đối nhau có giá trị tuyệt đối bằng nhau.');}
  if(t===5){const ok=RNG()<.5;return IT(`|0| = ${ok?0:1}`,ok,'gt','TH','|0| = 0.');}
  if(t===6){const k=ri(2,9),ok=RNG()<.5;return IT(`Có ${ok?2*k-1:2*k} số nguyên x thỏa mãn |x| < ${k}`,ok,'gt','VD',`Các số nguyên là −${k-1}, ..., ${k-1}: có ${2*k-1} số.`);}

}

function saSrCnt(){
  const items=[],used=new Set();let c=0;const z=ri(2,4);
  const add=t=>{if(!used.has(t)){used.add(t);items.push(t);return true;}return false;};
  while(c<z){const o=ratOpt(RNG()<.5);if(add(o.t))c++;}
  while(items.length<6){const o=irrOpt();add(o.t);}
  return {stem:`Trong các số sau, có bao nhiêu số hữu tỉ? ${shuffle(items).join('; ')}.`,ans:[z],exp:`Số hữu tỉ là số nguyên, phân số, số thập phân hữu hạn hoặc vô hạn tuần hoàn, và căn của số chính phương: ${items.slice(0,z).join('; ')}. Các số còn lại là số vô tỉ. Có ${z} số hữu tỉ.`,meta:{z}};
}

const state={view:'home',name:'',stu:null,ans:{},pr:{},perm:{},result:null,topicPct:{},weak:[],t0:0,elapsed:0,timedOut:false,code:'',cls:''};
const LIMIT={test:25*60,quick:5*60,hard:30*60};

function fmtTime(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
let tick=null;
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function updateTimer(){
  if(state.view!=='quiz'||!S)return;
  const el=document.getElementById('timer'),used=Math.floor((Date.now()-state.t0)/1000);
  if(S.mode!=='practice'){
    const lim=LIMIT[S.mode],left=lim-used;
    if(el){el.textContent='Còn '+fmtTime(left);el.classList.toggle('low',left<=Math.min(300,lim*0.2));}
    if(left<=0){state.timedOut=true;finish(true);}
  }else if(el)el.textContent='Đã dùng '+fmtTime(used);
}
function startTimer(){stopTimer();updateTimer();if(state.view==='quiz')tick=setInterval(updateTimer,1000);}
let S=null;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function status(p){return p>=80?['good','Thành thạo']:p>=50?['warn','Cần củng cố']:['bad','Cần học lại'];}
function inst(q){return q.gen?Object.assign({},q,q.gen()):q;}
let seen={};try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||'{}')||{};}catch(e){seen={};}
function markSeen(list){list.forEach(q=>{seen[q.id]=(seen[q.id]||0)+1;});try{localStorage.setItem(SEEN_KEY,JSON.stringify(seen));}catch(e){}}
function ordered(pool){if(SEEDED)return shuffle(pool);const w=q=>(seen[q.id]||0)*(q.gen?0.25:1);return shuffle(pool).sort((a,b)=>w(a)-w(b));}

/* ============ Dựng phiên làm bài ============ */
function pick(pool,used){
  const x=ordered(pool.filter(x=>!used.has(x.id)))[0];used.add(x.id);return x;
}
function makeSession(mode,spec,title,by){
  const list=[];
  // không để hai câu giống hệt nhau trong cùng một phiên: câu tự sinh bị trùng thì sinh lại
  // và cố tránh hai câu cùng một khuôn đề chỉ khác số (nếu bộ sinh có khuôn đề khác)
  {const sig=q=>JSON.stringify([q.stem,q.fig||'',(q.opts||[]).map(o=>JSON.stringify(o)).sort(),(q.items||[]).map(i=>i.t)]);
   const near=q=>q.type+'|'+String(q.stem).replace(/<[^>]+>/g,'').replace(/[0-9]+/g,'#');
   const sg=new Set(),ng=new Set();
   TYPES.forEach(t=>by[t]=by[t].map(q=>{
     let x=inst(q);
     if(q.gen){
       for(let k=0;k<12&&(sg.has(sig(x))||ng.has(near(x)));k++){const y=inst(q);if(!sg.has(sig(y))||sg.has(sig(x)))x=y;}
       for(let k=0;k<20&&sg.has(sig(x));k++)x=inst(q);
     }
     sg.add(sig(x));ng.add(near(x));return x;}));}
  TYPES.forEach(t=>by[t].forEach(q=>list.push(q)));
  const idx={};TYPES.forEach(t=>by[t].forEach((q,i)=>idx[q.id]=i));
  state.ans={};state.pr={};state.result=null;state.perm={};
  state.t0=Date.now();state.elapsed=0;state.timedOut=false;if(!SEEDED)markSeen(list);
  {const keep=RNG;RNG=Math.random;by.mc.forEach(q=>{state.perm[q.id]=shuffle(q.opts.map((_,i)=>i));});RNG=keep;}
  S={mode,spec,title,by,list,idx};
}
function buildTest(){
  const used=new Set();
  const mcSlots=[['tp',['NB','TH']],['vt',['NB','TH']],['vt',['TH','VD']],['sr',['NB','TH']],['ss',['TH','VD']],['ss',['NB','TH','VD']]];
  const mc=mcSlots.map(([t,l])=>pick(MC.filter(q=>q.topic===t&&l.includes(q.level)),used));
  const tf=[sel(['tp','vt']),'sr','ss'].map(t=>pick(TF.filter(q=>q.topic===t&&q.level!=='NB'),used));
  const sa=TKEYS.map(t=>pick(SA.filter(q=>q.topic===t&&q.level!=='NB'),used));
  makeSession('test',null,'Bài kiểm tra',{mc,tf,sa});
}
function buildQuick(){
  const used=new Set(),t1=sel(['tp','sr']),t2=sel(['vt','ss']);
  const mc=['tp','vt','sr','ss'].map(t=>pick(MC.filter(q=>q.topic===t&&q.level!=='VD'),used));
  const sa=[pick(SA.filter(q=>q.topic===t1&&q.level!=='VD'),used),pick(SA.filter(q=>q.topic===t2&&q.level!=='VD'),used)];
  makeSession('quick',null,'Kiểm tra nhanh',{mc,tf:[],sa});
}
function buildHard(){
  const vd=q=>q.level==='VD';
  const mc=ordered(MC.filter(vd)).slice(0,6);
  const tf=ordered(HARD.tf).slice(0,1).concat(ordered(TF.filter(vd)).slice(0,2));
  const sa=ordered(HARD.sa).slice(0,4);
  makeSession('hard',null,'Thử thách',{mc,tf,sa});
}
function buildPisa(){
  const units=shuffle(PISA).slice(0,3).map(f=>f());
  const by={mc:[],tf:[],sa:[]};
  units.forEach((u,ui)=>u.qs.forEach((q,k)=>{q.id='p'+ui+'_'+k;q.no=k;q.lb=`Tình huống ${ui+1}, câu ${k+1}`;by[q.type].push(q);}));
  makeSession('practice',{kind:'pisa'},'Gói Toán thực tế',by);
  S.units=units;
}
function buildPractice(spec){
  let f,title;
  if(spec.kind==='level'){f=q=>q.level===spec.val;title='Gói '+LEVELS[spec.val];}
  else if(spec.kind==='topic'){f=q=>q.topic===spec.val;title='Gói '+TOPICS[spec.val].short;}
  else{f=q=>spec.topics.includes(q.topic);title='Gói ôn điểm yếu';}
  const nSA=spec.kind==='topic'?4:3;
  // ưu tiên các dạng câu khác nhau trong một gói; thiếu thì mới lấy thêm câu cùng dạng
  const take=(arr,n)=>{const o=ordered(arr.filter(f)),out=[],g=new Set();o.forEach(q=>{if(out.length<n&&!(q.gen&&g.has(q.gen))){out.push(q);if(q.gen)g.add(q.gen);}});o.forEach(q=>{if(out.length<n&&!out.includes(q))out.push(q);});return out;};
  makeSession('practice',spec,title,{mc:take(MC,6),tf:take(TF,2),sa:take(SA,nSA)});
}

    if(o.ok){const n=o.n||state.stu.n,c=o.c||'';if(n!==state.stu.n||c!==(state.stu.c||'')){saveHS({u,n,c});if(state.view==='home'&&location.hash!=='#giao-vien')render();}return;}

}

/* ============ Chấm điểm ============ */
function parseNum(s){
  s=String(s).trim().replace(/[−–—]/g,'-');
  if(/^[1-9]\d{0,2}([.\s]\d{3})+$/.test(s))s=s.replace(/[.\s]/g,'');
  s=s.replace(/,/g,'.').replace(/[^0-9.\-\/]/g,'');
  if(!s)return NaN;
  if(s.includes('/')){const [a,b]=s.split('/');return parseFloat(a)/parseFloat(b);}
  return parseFloat(s);
}
function evalQ(q,a){
  if(q.type==='mc')return [a===q.ans];
  if(q.type==='tf'){a=a||[];return q.items.map((it,j)=>a[j]===it.v);}
  const v=parseNum(a==null?'':a);
  return [!isNaN(v)&&q.ans.some(x=>Math.abs(x-v)<1e-6)];
}
function grade(){
  const test=S.mode!=='practice',quick=S.mode==='quick';
  const items=[],sc={mc:0,tf:0,sa:0},errs=[],qres=[];
  const ansOf=q=>test?state.ans[q.id]:(state.pr[q.id]&&state.pr[q.id].firstAns);
  const oksOf=q=>{
    if(test)return evalQ(q,ansOf(q));
    const P=state.pr[q.id];return P&&P.first?P.first:Array(q.type==='tf'?q.items.length:1).fill(false);
  };
  S.by.mc.forEach((q,i)=>{
    const a=ansOf(q),ok=oksOf(q)[0];
    if(ok)sc.mc+=quick?1.25:0.5;else if(a!=null&&q.opts[a]&&q.opts[a].err)errs.push({where:lbl('mc',i),topic:q.topic,text:q.opts[a].err});
    items.push({topic:q.topic,level:q.level,ok,label:lbl('mc',i)});
    qres.push({kind:'mc',q,i,a,ok,pts:ok?(quick?1.25:0.5):0,max:quick?1.25:0.5});
  });
  S.by.tf.forEach((q,i)=>{
    const a=ansOf(q)||[],oks=oksOf(q);let k=0;
    q.items.forEach((it,j)=>{
      const ok=oks[j];if(ok)k++;
      items.push({topic:it.topic,level:it.level,ok,label:lbl('tf',i,q.items.length>1?j:null)});
      if(!ok&&typeof a[j]==='boolean')errs.push({where:lbl('tf',i,q.items.length>1?j:null),topic:it.topic,text:it.exp});
    });
    const pts=quick?(k?1.25:0):TF_SCORE[k];sc.tf+=pts;
    qres.push({kind:'tf',q,i,a,oks,k,pts,max:quick?1.25:1});
  });
  S.by.sa.forEach((q,i)=>{
    const raw=ansOf(q)||'',ok=oksOf(q)[0];
    if(ok)sc.sa+=quick?2.5:1;
    items.push({topic:q.topic,level:q.level,ok,label:lbl('sa',i)});
    qres.push({kind:'sa',q,i,raw,ok,pts:ok?(quick?2.5:1):0,max:quick?2.5:1});
  });
  const topics={};TKEYS.forEach(k=>topics[k]={c:0,n:0});
  const levels={NB:{c:0,n:0},TH:{c:0,n:0},VD:{c:0,n:0}};
  items.forEach(it=>{topics[it.topic].n++;levels[it.level].n++;if(it.ok){topics[it.topic].c++;levels[it.level].c++;}});
  const total=Math.round((sc.mc+sc.tf+sc.sa)*100)/100;
  return {items,sc,total,topics,levels,errs,qres};
}
function pct(o){return o.n?Math.round(100*o.c/o.n):0;}
function updateWeak(r){
  TKEYS.forEach(k=>{if(r.topics[k].n)state.topicPct[k]=pct(r.topics[k]);});
  state.weak=TKEYS.filter(k=>state.topicPct[k]!==undefined&&state.topicPct[k]<80).sort((a,b)=>state.topicPct[a]-state.topicPct[b]);
}

/* ============ Luyện tập: kiểm tra từng câu ============ */
function setFeed(id,msg,cls){
  const box=document.querySelector(`#q-${id} .feedbox`);
  if(box)box.innerHTML=`<div class="feed ${cls}" role="status">${msg}</div>`;
}
function practiceCheck(id){
  const q=S.list.find(x=>x.id===id);if(!q)return;
  const P=state.pr[id]||(state.pr[id]={attempts:0,done:false,tried:[]});
  if(P.done)return;
  const a=state.ans[id];
  if(q.type==='mc'&&a==null)return setFeed(id,'Hãy chọn một đáp án trước.','info');
  if(q.type==='tf'){const arr=a||[];if(q.items.some((_,j)=>typeof arr[j]!=='boolean'))return setFeed(id,'Hãy chọn Đúng hoặc Sai cho cả 4 ý trước.','info');}
  if(q.type==='sa'&&String(a||'').trim()==='')return setFeed(id,'Hãy nhập đáp án trước.','info');
  P.attempts++;
  const oks=evalQ(q,a),all=oks.every(Boolean);
  if(P.attempts===1){P.first=oks;P.firstAns=JSON.parse(JSON.stringify(a));}
  if(all){
    P.done=true;P.final=true;P.cls='ok';
    P.msg=P.attempts===1?'Đúng rồi!':'Đúng ở lần thử thứ hai.';
  }else if(P.attempts===1){
    P.cls='bad';
    if(q.type==='mc'){
      const e=q.opts[a].err;P.tried.push(a);delete state.ans[id];
      P.msg='Chưa đúng.'+(e?' '+e:'')+' Hãy chọn lại một đáp án khác.';
    }else if(q.type==='tf'){
      const k=oks.filter(Boolean).length;P.msg=`Mới đúng ${k}/${q.items.length} ý. Hãy xem lại các ý và thử một lần nữa.`;
    }else P.msg='Đáp án chưa đúng. Hãy kiểm tra lại cách tính và thử một lần nữa.';
  }else{
    P.done=true;P.final=false;P.cls='bad';P.msg='Chưa đúng. Đáp án và lời giải ở bên dưới.';
  }
  let g=null;
  if(P.done){g=GM.onPractice(!!P.final,P.attempts,q.level||(q.items&&q.items[0]&&q.items[0].level)||'TH');if(g&&g.xp)P.msg+=' +'+g.xp+' XP';}
  const el=document.getElementById('q-'+id);
  el.outerHTML=CARD[q.type](q,S.idx[id]);
  updateProgress();
  GM.fx(g,document.getElementById('q-'+id));
}

    <section class="card stack" style="margin-top:18px">
      <div><label class="fl" for="codes">Mã kết quả</label><textarea id="codes" placeholder="${CODE_PREFIX}eyJ2IjoxLC..."></textarea></div>
      <div class="row"><button class="btn" id="analyze">Tổng hợp</button><button class="btn ghost" id="clearc">Xóa</button></div>
      <div id="tout" aria-live="polite"></div>
    </section>`;
}
function decodeCode(line){
  line=line.trim();if(!line.startsWith(CODE_PREFIX))return null;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(line.slice(CODE_PREFIX.length)))));if(o&&o.t&&typeof o.s==='number')return o;}catch(e){}
  return null;
}
function analyzeCodes(){
  const lines=document.getElementById('codes').value.split(/\r?\n/).filter(l=>l.trim());
  const rows=[],bad=[];let other=0;
  lines.forEach((l,i)=>{const o=decodeCode(l);if(o)rows.push(o);else{bad.push(i+1);if(/^[A-Z0-9]{2,4}-/.test(l.trim())&&!l.trim().startsWith(CODE_PREFIX))other++;}});
  const out=document.getElementById('tout');
  if(!rows.length){out.innerHTML=`<div class="warnbar">${lines.length?`Không đọc được mã nào. Hãy kiểm tra mã đã được sao chép đầy đủ, bắt đầu bằng ${CODE_PREFIX}.${other?' Có mã của bài khác (ví dụ Tam giác bằng nhau): hãy dán mã đó ở trang của bài ấy.':''}`:'Hãy dán ít nhất một mã kết quả.'}</div>`;return;}
  const cell=o=>{if(!o||!o[1])return '<td class="cell">–</td>';const p=Math.round(100*o[0]/o[1]);return `<td class="cell ${status(p)[0]}">${p}%</td>`;};
  const avg=TKEYS.map(k=>{let c=0,n=0;rows.forEach(r=>{if(r.t[k]){c+=r.t[k][0];n+=r.t[k][1];}});return [c,n];});
  const mean=rows.reduce((s,r)=>s+r.s,0)/rows.length;
  const timed=rows.filter(r=>typeof r.m==='number'),meanT=timed.length?timed.reduce((s,r)=>s+r.m,0)/timed.length:null;
  const tcell=r=>typeof r.m==='number'?fmtTime(r.m):'–';
  const flag=r=>(typeof r.m==='number'&&r.m<0.25*(r.L||1800)&&r.s<5)?' <span class="chip">Làm nhanh, điểm thấp</span>':'';
  const chips=r=>(r.c?` <span class="chip">Lớp ${esc(r.c)}</span>`:'')+(r.q==='quick'?' <span class="chip">Nhanh 5 phút</span>':r.q==='hard'?' <span class="chip">Thử thách 30 phút</span>':'')+(r.k?` <span class="chip">Mã đề ${esc(r.k)}</span>`:'');
  const weakCount=TKEYS.map(k=>rows.filter(r=>r.t[k]&&r.t[k][1]&&100*r.t[k][0]/r.t[k][1]<50).length);
  const worst=TKEYS.map((k,i)=>({k,p:avg[i][1]?100*avg[i][0]/avg[i][1]:100})).sort((a,b)=>a.p-b.p)[0];
  out.innerHTML=`${bad.length?`<div class="warnbar" style="margin:0 0 12px">Bỏ qua ${bad.length} dòng không đọc được (dòng ${bad.join(', ')}).${other?' Có mã của bài khác, hãy dán ở trang của bài ấy.':''}</div>`:''}
    <p style="margin:0 0 10px"><b>${rows.length}</b> học sinh · điểm trung bình <b>${fmt(mean)}</b>. Nội dung cả lớp còn yếu nhất: <b>${TOPICS[worst.k].name}</b> (${Math.round(worst.p)}%).</p>
    <div class="tablewrap"><table><thead><tr><th>Học sinh</th><th>Điểm</th><th>Thời gian</th>${TKEYS.map(k=>`<th>${TOPICS[k].short}</th>`).join('')}</tr></thead><tbody>
    ${rows.sort((a,b)=>a.s-b.s).map(r=>`<tr><td>${esc(r.n)}${chips(r)}${flag(r)}</td><td><b>${fmt(r.s)}</b></td><td>${tcell(r)}</td>${TKEYS.map(k=>cell(r.t[k])).join('')}</tr>`).join('')}
    <tr><td><b>Cả lớp</b></td><td><b>${fmt(mean)}</b></td><td>${meanT===null?'–':fmtTime(meanT)}</td>${avg.map(cell).join('')}</tr>
    <tr><td class="muted">Số em dưới 50%</td><td></td><td></td>${weakCount.map(n=>`<td class="cell">${n}</td>`).join('')}</tr>
    </tbody></table></div>
    <p class="small muted" style="margin:10px 0 0">Màu: xanh từ 80%, vàng từ 50% đến dưới 80%, đỏ dưới 50%. Các em được xếp từ điểm thấp đến cao để dễ thấy em cần hỗ trợ. Nhãn "Làm nhanh, điểm thấp" hiện khi em nộp bài trong chưa đầy một phần tư thời gian cho phép mà dưới 5 điểm, thường là em chưa làm kỹ nên cần hỏi lại.</p>`;
}

/* ============ Điều hướng và sự kiện ============ */
function render(){
  const gv=location.hash==='#giao-vien';
  document.getElementById('nav-hs').setAttribute('aria-current',gv?'false':'page');
  document.getElementById('nav-gv').setAttribute('aria-current',gv?'page':'false');
  if(gv){stopTimer();$app.innerHTML=teacherHTML();GM.refresh();return;}
  if(state.view==='home'){stopTimer();$app.innerHTML=homeHTML();}
  else if(state.view==='quiz'){$app.innerHTML=quizHTML();updateProgress();startTimer();}
  else{stopTimer();$app.innerHTML=resultHTML();if(SHEET_URL&&S.mode!=='practice'&&state.sentCode!==makeCode(state.result))sendResult();else if(SHEET_URL&&S.mode!=='practice')setSent('Đã gửi kết quả cho giáo viên.');}
  window.scrollTo(0,0);
  GM.refresh();GM.sync();
}
function normCode(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'');}
function withCode(mode,fn){
  if(!state.code){fn();return;}
  RNG=mulberry32(hashStr(mode+'|'+state.code));SEEDED=true;
  try{fn();}finally{RNG=Math.random;SEEDED=false;}
}
function startTest(){if(!GM.gate('test',null,state.code,startTest))return;withCode('test',buildTest);state.view='quiz';render();}
function startQuick(){if(!GM.gate('quick',null,state.code,startQuick))return;withCode('quick',buildQuick);state.view='quiz';render();}
function startHard(){if(!GM.gate('hard',null,state.code,startHard))return;withCode('hard',buildHard);state.view='quiz';render();}
function startPack(spec){if(!GM.gate('practice',spec,'',function(){startPack(spec);}))return;if(spec.kind==='pisa')buildPisa();else buildPractice(spec);state.view='quiz';render();}
// Gói kế tiếp sau khi luyện xong: mức độ kế tiếp hoặc nội dung kế tiếp (gói cuối thì không có)
function nextSpec(){
  if(!S||S.mode!=='practice'||!S.spec)return null;
  const sp=S.spec,list=sp.kind==='level'?Object.keys(LEVELS):sp.kind==='topic'?TKEYS:[],i=list.indexOf(sp.val);
  return i>=0&&i<list.length-1?{kind:sp.kind,val:list[i+1]}:null;
}
const specName=sp=>sp.kind==='level'?LEVELS[sp.val]:TOPICS[sp.val].short;
function parsePack(s){
  if(s==='weak')return {kind:'weak',topics:state.weak.slice()};
  const [kind,val]=s.split(':');return {kind,val};
}
function finish(force){
  const test=S.mode!=='practice';
  const left=test?totalItems()-answered():S.list.length-doneCount();
  if(left>0&&!force){
    const w=document.getElementById('warn');
    w.innerHTML=test
      ?`<div class="warnbar" role="alert">Còn <b>${left}</b> ý chưa trả lời. Những ý này sẽ tính là chưa đúng.<div class="row" style="margin-top:10px"><button class="btn sm" id="force">Vẫn nộp bài</button><button class="btn ghost sm" id="keep">Làm tiếp</button></div></div>`
      :`<div class="warnbar" role="alert">Còn <b>${left}</b> câu chưa kiểm tra xong. Những câu này sẽ tính là chưa đúng ngay lần đầu.<div class="row" style="margin-top:10px"><button class="btn sm" id="force">Vẫn xem kết quả</button><button class="btn ghost sm" id="keep">Làm tiếp</button></div></div>`;
    w.scrollIntoView({block:'center'});return;
  }
  stopTimer();
  state.elapsed=Math.floor((Date.now()-state.t0)/1000);
  if(test)state.elapsed=Math.min(state.elapsed,LIMIT[S.mode]);
  state.result=grade();updateWeak(state.result);state.gm=GM.onFinish(state.result,S.mode);state.view='result';render();
}
loadHS();recheckHS();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hsma'){e.preventDefault();checkHS();}});
document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-pack]');
  if(pk&&!pk.disabled){startPack(parsePack(pk.dataset.pack));return;}
  const ck=e.target.closest('.chk');
  if(ck){practiceCheck(ck.dataset.q);return;}
  const id=e.target.id;
  if(id==='start'||id==='startq'||id==='starth'){if(!needHS()){state.name=document.getElementById('nm').value.trim();state.cls=normCode(document.getElementById('cls').value);}state.code=normCode(document.getElementById('mcode').value);
    if(id==='start')startTest();else if(id==='starth')startHard();else startQuick();}
  else if(id==='hsgo')checkHS();
  else if(id==='hsout'){saveHS(null);state.view='home';render();}
  else if(id==='submit')finish(false);
  else if(id==='force')finish(true);
  else if(id==='keep')document.getElementById('warn').innerHTML='';
  else if(id==='back'){state.view='home';render();}
  else if(id==='again'){if(S.mode==='test')startTest();else if(S.mode==='quick')startQuick();else if(S.mode==='hard')startHard();else startPack(S.spec.kind==='weak'?{kind:'weak',topics:state.weak.length?state.weak.slice():S.spec.topics}:S.spec);}
  else if(id==='weakpack')startPack({kind:'weak',topics:state.weak.slice()});
  else if(id==='nextpack'){const n=nextSpec();if(n)startPack(n);}
  else if(id==='home'){state.view='home';render();}
  else if(id==='copy'){
    const t=document.getElementById('code'),m=document.getElementById('copied');
    t.focus();t.select();
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{m.textContent='Đã sao chép.';}).catch(()=>{m.textContent='Hãy nhấn giữ vùng chọn rồi chọn Sao chép.';});
  }
  else if(id==='resend')sendResult();
  else if(id==='analyze')analyzeCodes();
  else if(id==='clearc'){document.getElementById('codes').value='';document.getElementById('tout').innerHTML='';}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.type!=='radio')return;
  const m=t.name.match(/^(.+)-(\d)$/);
  if(m){const a=state.ans[m[1]]||(state.ans[m[1]]=[]);a[+m[2]]=t.value==='1';}
  else state.ans[t.name]=+t.value;
  updateProgress();
});
document.addEventListener('input',e=>{
  const id=e.target.dataset&&e.target.dataset.sa;
  if(id){state.ans[id]=e.target.value;updateProgress();}
});
window.addEventListener('hashchange',render);
render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});</script>
