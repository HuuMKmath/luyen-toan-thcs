<html lang="vi">
<head>

<style>
/* Worksheet on graph paper. Blue ink for text, red pencil for the marked points. */
:root{
  --paper:#f2f6fc; --card:#ffffff; --ink:#13203a; --muted:#54627f; --line:#cdd7e9;
  --grid:rgba(52,96,170,.08); --accent:#1f4fd8; --accent-ink:#ffffff; --mark:#d9342b; --tri:#eaf0fc;
  --good:#17754a; --good-bg:#e4f4ea; --warn:#9a5b00; --warn-bg:#fff0d4; --bad:#b3261e; --bad-bg:#fde8e6;
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1730; --card:#142245; --ink:#e8eefc; --muted:#9fb0d4; --line:#2b3c6b;
    --grid:rgba(140,170,255,.07); --accent:#8aa9ff; --accent-ink:#0d1730; --mark:#ff7f72; --tri:#1a2b57;
    --good:#58d19a; --good-bg:#12372d; --warn:#f3b955; --warn-bg:#3b2d10; --bad:#ff8a80; --bad-bg:#40191b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1730; --card:#142245; --ink:#e8eefc; --muted:#9fb0d4; --line:#2b3c6b;
  --grid:rgba(140,170,255,.07); --accent:#8aa9ff; --accent-ink:#0d1730; --mark:#ff7f72; --tri:#1a2b57;
  --good:#58d19a; --good-bg:#12372d; --warn:#f3b955; --warn-bg:#3b2d10; --bad:#ff8a80; --bad-bg:#40191b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font:16px/1.65 var(--body); -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 72px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
sup{font-size:.72em;line-height:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.top b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.top nav{display:flex;gap:16px;flex-wrap:wrap}
.top nav a{color:var(--muted);text-decoration:none;border-bottom:1.5px solid transparent;padding-bottom:1px}
.top nav a[aria-current="page"]{color:var(--ink);border-color:var(--mark)}

h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,8vw,3.9rem);font-weight:700;letter-spacing:-.01em}
h1 em{color:var(--accent);font-weight:600}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
.lead{font-size:1.08rem;color:var(--muted);max-width:56ch;margin:14px 0 0}

.hero{padding:12px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 22px;border-radius:10px;cursor:pointer;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.9rem}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
label.fl{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}

.dt{border-collapse:collapse;margin:10px 0 2px;font-size:.95rem}
.dt th,.dt td{border:1px solid var(--line);padding:6px 14px;text-align:left}
.dt th{background:var(--paper)}
.figbox{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;max-width:400px;margin:10px 0}
.figbox.ms{max-width:none}
.figbox p{margin:2px 0}
.ms{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.ms .r{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ms .r b{min-width:54px;font-family:var(--display)}
.ms i{font-style:normal;min-width:30px;text-align:center;padding:2px 4px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums}
.ms i.c{border-color:var(--mark);color:var(--mark);font-weight:700}

.grp{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mark);margin:18px 0 8px}
.grp:first-of-type{margin-top:6px}
.pack{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.pk{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.pk:hover{border-color:var(--accent)}
.pk b{font-family:var(--display);font-size:1.02rem}
.pk span{font-size:.84rem;color:var(--muted);line-height:1.4}
.pk[disabled]{opacity:.55;cursor:not-allowed}
.pk[disabled]:hover{border-color:var(--line)}
.recap{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.recap{grid-template-columns:1fr 1fr}}
.recap .card{display:flex;flex-direction:column;gap:6px}
.recap h3{font-size:1.02rem}
.recap p{margin:0;font-size:.93rem}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--paper);white-space:nowrap}

.bar-sticky{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:10px 16px}
.timer{font-variant-numeric:tabular-nums;font-size:.95rem}
.timer.low{color:var(--bad)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.part{margin:28px 0 12px}
.part .kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mark)}
.part p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.q{margin-bottom:14px}
.qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.qn{font-weight:700;font-family:var(--display);font-size:1.08rem}
.stem{margin:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .ol{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt:has(input:checked){border-color:var(--accent);background:var(--tri)}
.opt:has(input:checked) .ol{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){cursor:default}
.opt:has(input:disabled):hover{border-color:var(--line)}
.opt.is-right,.opt.is-right:hover{border-color:var(--good);background:var(--good-bg)}
.opt.is-right .ol{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.is-wrong,.opt.is-wrong:hover{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .ol{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.tf{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tfr{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px dashed var(--line)}
.tfr .tx{flex:1 1 260px}
.tfr .tx b{font-family:var(--display);margin-right:6px}
.tfr .exp{flex-basis:100%;margin-top:0}
.tfb{display:flex;gap:8px}
.tfb .opt{padding:7px 16px;border-radius:99px;font-weight:600;font-size:.92rem}
.sa{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.sa input{max-width:180px}
.warnbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin-top:16px}
.feed{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.94rem}
.feed.ok{background:var(--good-bg);color:var(--good)}
.feed.bad{background:var(--bad-bg);color:var(--bad)}
.feed.info{background:var(--warn-bg);color:var(--warn)}
.exp{background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.94rem}

.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:clamp(3rem,14vw,4.6rem);line-height:1;letter-spacing:-.02em}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts .chip{font-size:.85rem;padding:5px 12px}
.topic{padding:14px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0;padding-top:0}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.track{height:12px;border-radius:99px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.st{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.st.good{background:var(--good-bg);color:var(--good)}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.fill-good{background:var(--good)} .fill-warn{background:var(--warn)} .fill-bad{background:var(--bad)}
.advice{border-left:4px solid var(--mark);padding:2px 0 2px 14px;margin:10px 0}
.advice p{margin:4px 0}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
details.rv{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
details.rv summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .body{padding:0 14px 14px;border-top:1px dashed var(--line)}
.mark-ok{color:var(--good);font-weight:700} .mark-no{color:var(--bad);font-weight:700}
.ans-line{margin:6px 0;font-size:.94rem}
.codebox{display:flex;flex-direction:column;gap:8px}

table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.cell{font-weight:600;text-align:center}
td.cell.good{color:var(--good)} td.cell.warn{color:var(--warn)} td.cell.bad{color:var(--bad)}
.tablewrap{overflow-x:auto}
[hidden]{display:none!important}
footer{margin-top:40px;color:var(--muted);font-size:.8rem}
.ax{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.ah{fill:var(--ink)}
.tl{fill:var(--ink);font-size:15px;font-family:var(--body);font-variant-numeric:tabular-nums}
.ol0{fill:var(--muted);font:italic 600 15px var(--display)}
.pt{fill:var(--mark)}
.pl{fill:var(--mark);font:italic 700 17px var(--display)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;margin:0 .14em;font-size:.94em;font-variant-numeric:tabular-nums}
.fr>span{padding:0 .24em}
.fr>span:first-child{border-bottom:1.5px solid currentColor}
/* worksheet figures */
.fig{display:block;width:100%;height:auto}
.fig .tri,.fig .seg{fill:var(--tri);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.fig .seg{fill:none}
.fig .thin{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 4}
.fig .mk{stroke:var(--mark);stroke-width:2.2;stroke-linecap:round;fill:none}
.fig .vl{fill:var(--ink);font:600 15px var(--display)}
.fig .draw{stroke-dasharray:700;stroke-dashoffset:0;animation:draw 1.1s ease-out both}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.fig .draw{animation:none}}
.fig .vs{fill:var(--ink);font:600 13px var(--body);font-variant-numeric:tabular-nums}
.fig .vi{fill:var(--muted);font:italic 600 15px var(--display)}
.fig .dot{fill:var(--ink)}
.fig .grid{stroke:var(--line);stroke-width:1}
.hero .fig{margin-top:18px;max-width:340px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <b>Toán 7 · Kết nối tri thức · Chương IV. Tam giác bằng nhau · Bài tập cuối chương IV</b>
    <nav aria-label="Chọn chế độ">
      <a href="../cac-bai/" id="nav-hub">Tất cả các bài</a>
      <a href="#" id="nav-hs" aria-current="page">Học sinh</a>
      <a href="#giao-vien" id="nav-gv">Giáo viên</a>
    </nav>
  </header>

  <main id="app"></main>

  <footer>Bài kiểm tra được chấm và lưu trên máy chủ ngay khi học sinh nộp bài; giáo viên xem điểm ở trang Sổ điểm.</footer>
</div>

<script src="../gamify.js"></script>
<script src="../khoa-bai.js"></script>
<script src="../tu-luan.js"></script>
<script src="tu-luan-de.js"></script>
<script>
"use strict";
if(!window.GM)window.GM={onPractice(){return null;},onFinish(){return null;},barHTML(){return '';},resultHTML(){return '';},fx(){},refresh(){},sync(){},rebar(){},gate(){return true;}}; // gamify.js không tải được thì trang vẫn chạy bình thường
/* ============ Hình vẽ ============ */
const f1=n=>(Math.round(n*10)/10);
function ticks(p,q,n){
  const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;let s='';
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*5,cx=mx+ux*o,cy=my+uy*o;
    s+=`<line class="mk" x1="${f1(cx-nx*5)}" y1="${f1(cy-ny*5)}" x2="${f1(cx+nx*5)}" y2="${f1(cy+ny*5)}"/>`;}
  return s;
}
function arcs(v,p,q,n){
  const a1=Math.atan2(p[1]-v[1],p[0]-v[0]),a2=Math.atan2(q[1]-v[1],q[0]-v[0]);
  let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  const sw=d>0?1:0;let s='';
  for(let i=0;i<n;i++){const r=16+i*5;
    s+=`<path class="mk" d="M${f1(v[0]+r*Math.cos(a1))} ${f1(v[1]+r*Math.sin(a1))} A${r} ${r} 0 0 ${sw} ${f1(v[0]+r*Math.cos(a2))} ${f1(v[1]+r*Math.sin(a2))}"/>`;}
  return s;
}
/* kí hiệu góc vuông tại đỉnh v, giữa hai tia hướng về p và q */
function rmark(v,p,q,s){
  s=s||9;const a=Math.hypot(p[0]-v[0],p[1]-v[1]),b=Math.hypot(q[0]-v[0],q[1]-v[1]);
  const u=[(p[0]-v[0])/a,(p[1]-v[1])/a],w=[(q[0]-v[0])/b,(q[1]-v[1])/b];
  const P1=[v[0]+u[0]*s,v[1]+u[1]*s],P2=[P1[0]+w[0]*s,P1[1]+w[1]*s],P3=[v[0]+w[0]*s,v[1]+w[1]*s];
  return `<path class="mk" d="M${f1(P1[0])} ${f1(P1[1])} L${f1(P2[0])} ${f1(P2[1])} L${f1(P3[0])} ${f1(P3[1])}"/>`;
}
const TX=(x,y,t)=>`<text class="vl" x="${f1(x)}" y="${f1(y)}" text-anchor="middle">${t}</text>`;
const TS=(x,y,t)=>`<text class="vs" x="${f1(x)}" y="${f1(y)}" text-anchor="middle">${t}</text>`;
const SEG=(p,q,c)=>`<line class="${c||'seg'}" x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}"/>`;
const DOT=p=>`<circle class="dot" cx="${f1(p[0])}" cy="${f1(p[1])}" r="3"/>`;
const cen=P=>[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
const along=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
/* tên đỉnh: đặt ra phía ngoài, ngược hướng với điểm c */
function lab(v,c,t,d){const dx=v[0]-c[0],dy=v[1]-c[1],L=Math.hypot(dx,dy)||1;d=d||14;return TX(v[0]+dx/L*d,v[1]+dy/L*d+5,t);}
/* số đo góc: đặt vào trong góc, theo hướng phân giác */
function angT(v,p,q,t,d){const a=Math.atan2(p[1]-v[1],p[0]-v[0]),b=Math.atan2(q[1]-v[1],q[0]-v[0]);let x=Math.cos(a)+Math.cos(b),y=Math.sin(a)+Math.sin(b);const L=Math.hypot(x,y)||1;d=d||36;return TS(v[0]+x/L*d,v[1]+y/L*d+5,t);}
/* độ dài cạnh: đặt cạnh trung điểm, phía ngoài tam giác (ngược hướng điểm c) */
function sideT(p,q,c,t){const m=mid(p,q),dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);let nx=-dy/L,ny=dx/L;if((c[0]-m[0])*nx+(c[1]-m[1])*ny>0){nx=-nx;ny=-ny;}return TS(m[0]+nx*17,m[1]+ny*17+5,t);}
const svg=(w,h,alt,s)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="${alt}">${s}</svg>`;
const fb=s=>`<div class="figbox">${s}</div>`;

/* Tam giác cân: lab=[đỉnh, trái, phải]. Tuỳ chọn: legs (số vạch hai cạnh bên), arcs (cung hai góc đáy), tA/tB/tC (số đo góc),
   sAB/sAC/sBC (độ dài), foot (tên chân đường vuông góc từ đỉnh xuống đáy), eq (tam giác đều) */
function figIso(o){
  o=o||{};const eq=!!o.eq,A=eq?[130,22]:[130,22],B=eq?[60,143]:[45,140],C=eq?[200,143]:[215,140],P=[A,B,C],G=cen(P),lb=o.lab||['A','B','C'];
  let s=`<polygon class="tri" points="${A} ${B} ${C}"/>`;
  if(o.foot){const H=[130,B[1]];s+=SEG(A,H)+rmark(H,A,C);if(o.footTicks)s+=ticks(B,H,2)+ticks(H,C,2);s+=TX(H[0],H[1]+20,o.foot);}
  const lt=o.legs==null?1:o.legs;if(lt)s+=ticks(A,B,lt)+ticks(A,C,lt);
  if(eq)s+=ticks(B,C,1);
  if(o.arcs)s+=arcs(B,A,C,1)+arcs(C,A,B,1);

function fmtTime(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function status(p){return p>=80?['good','Thành thạo']:p>=50?['warn','Cần củng cố']:['bad','Cần học lại'];}
function inst(q){return q.gen?Object.assign({},q,q.gen()):q;}
let seen={};try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||'{}')||{};}catch(e){seen={};}
function markSeen(list){list.forEach(q=>{seen[q.id]=(seen[q.id]||0)+1;});try{localStorage.setItem(SEEN_KEY,JSON.stringify(seen));}catch(e){}}
function ordered(pool){if(SEEDED)return shuffle(pool);const w=q=>(seen[q.id]||0)*(q.gen?0.25:1);return shuffle(pool).sort((a,b)=>w(a)-w(b));}

/* ============ Dựng phiên làm bài ============ */
function pick(pool,used){
  const x=ordered(pool.filter(x=>!used.has(x.id)))[0];used.add(x.id);return x;
}
function makeSession(mode,spec,title,by){
  const list=[];
  // không để hai câu giống hệt nhau trong cùng một phiên: câu tự sinh bị trùng thì sinh lại
  // và cố tránh hai câu cùng một khuôn đề chỉ khác số (nếu bộ sinh có khuôn đề khác)
  {const sig=q=>JSON.stringify([q.stem,q.fig||'',(q.opts||[]).map(o=>JSON.stringify(o)).sort(),(q.items||[]).map(i=>i.t)]);
   const near=q=>q.type+'|'+String(q.stem).replace(/<[^>]+>/g,'').replace(/[0-9]+/g,'#');
   const sg=new Set(),ng=new Set();
   TYPES.forEach(t=>by[t]=by[t].map(q=>{
     let x=inst(q);
     if(q.gen){
       for(let k=0;k<12&&(sg.has(sig(x))||ng.has(near(x)));k++){const y=inst(q);if(!sg.has(sig(y))||sg.has(sig(x)))x=y;}
       for(let k=0;k<20&&sg.has(sig(x));k++)x=inst(q);
     }
     sg.add(sig(x));ng.add(near(x));return x;}));}
  TYPES.forEach(t=>by[t].forEach(q=>list.push(q)));
  const idx={};TYPES.forEach(t=>by[t].forEach((q,i)=>idx[q.id]=i));
  state.ans={};state.pr={};state.result=null;state.perm={};
  state.t0=Date.now();state.elapsed=0;state.timedOut=false;if(!SEEDED)markSeen(list);
  {const keep=RNG;RNG=Math.random;by.mc.forEach(q=>{state.perm[q.id]=shuffle(q.opts.map((_,i)=>i));});RNG=keep;}
  S={mode,spec,title,by,list,idx};
}
function buildTest(){
  const used=new Set();
  const mcSlots=[['tg',['NB','TH']],['bn',['NB','TH']],['bn',['TH','VD']],['tv',['NB','TH','VD']],['cn',['NB','TH','VD']],['tt',['TH','VD']]];
  const mc=mcSlots.map(([t,l])=>pick(MC.filter(q=>q.topic===t&&l.includes(q.level)),used));
  const tf=[sel(['tg','bn']),sel(['tv','cn']),sel(['cn','tt'])].map(t=>pick(TF.filter(q=>q.topic===t&&q.level!=='NB'),used));
  const sa=shuffle(TKEYS).slice(0,4).sort((a,b)=>TKEYS.indexOf(a)-TKEYS.indexOf(b)).map(t=>pick(SA.filter(q=>q.topic===t&&q.level!=='NB'),used));
  makeSession('test',null,'Bài kiểm tra',{mc,tf,sa});
}
function buildQuick(){
  const used=new Set(),t1=sel(['bn','tv']),t2=sel(['cn','tt']);
  const mc=TKEYS.map(t=>pick(MC.filter(q=>q.topic===t&&q.level!=='VD'),used));
  const sa=[pick(SA.filter(q=>q.topic===t1&&q.level!=='VD'),used),pick(SA.filter(q=>q.topic===t2&&q.level!=='VD'),used)];
  makeSession('quick',null,'Kiểm tra nhanh',{mc,tf:[],sa});
}
function buildHard(){
  const vd=q=>q.level==='VD';
  const mc=ordered(MC.filter(vd)).slice(0,6);
  const tf=ordered(HARD.tf).slice(0,1).concat(ordered(TF.filter(vd)).slice(0,2));
  const sa=ordered(HARD.sa).slice(0,4);
  makeSession('hard',null,'Thử thách',{mc,tf,sa});
}
function buildPisa(){
  const units=shuffle(PISA).slice(0,3).map(f=>f());
  const by={mc:[],tf:[],sa:[]};
  units.forEach((u,ui)=>u.qs.forEach((q,k)=>{q.id='p'+ui+'_'+k;q.no=k;q.lb=`Tình huống ${ui+1}, câu ${k+1}`;by[q.type].push(q);}));
  makeSession('practice',{kind:'pisa'},'Gói Toán thực tế',by);
  S.units=units;
}
function buildPractice(spec){
  let f,title;
  if(spec.kind==='level'){f=q=>q.level===spec.val;title='Gói '+LEVELS[spec.val];}
  else if(spec.kind==='topic'){f=q=>q.topic===spec.val;title='Gói '+TOPICS[spec.val].short;}
  else{f=q=>spec.topics.includes(q.topic);title='Gói ôn điểm yếu';}
  const nSA=spec.kind==='topic'?4:3;
  // ưu tiên các dạng câu khác nhau trong một gói; thiếu thì mới lấy thêm câu cùng dạng
  const take=(arr,n)=>{const o=ordered(arr.filter(f)),out=[],g=new Set();o.forEach(q=>{if(out.length<n&&!(q.gen&&g.has(q.gen))){out.push(q);if(q.gen)g.add(q.gen);}});o.forEach(q=>{if(out.length<n&&!out.includes(q))out.push(q);});return out;};
  makeSession('practice',spec,title,{mc:take(MC,6),tf:take(TF,2),sa:take(SA,nSA)});
}

// Giáo viên đã xoá mã thì tự đăng xuất; mất mạng hoặc hệ thống đang bận thì vẫn cho học tiếp.
function recheckHS(){
  if(!needHS()||!state.stu)return;
  const u=state.stu.u;
  fetch(SHEET_URL+'?ma='+encodeURIComponent(u)).then(r=>r.json()).then(o=>{
    if(!o||o.err||!state.stu||state.stu.u!==u)return;
    if(o.ok){const n=o.n||state.stu.n,c=o.c||'';if(n!==state.stu.n||c!==(state.stu.c||'')){saveHS({u,n,c});if(state.view==='home'&&location.hash!=='#giao-vien')render();}return;}
    saveHS(null);state.view='home';state.hsGone=true;if(location.hash!=='#giao-vien')render();
  }).catch(()=>{});
}

const PART_NAME={mc:'Phần I',tf:'Phần II',sa:'Phần III'},PART_QUICK={mc:'Phần I',sa:'Phần II'};
const partName=t=>S.mode==='quick'?PART_QUICK[t]:PART_NAME[t];
const TYPE_NAME={mc:'Nhiều lựa chọn',tf:'Đúng sai',sa:'Trả lời ngắn'};
function lbl(t,i,j){
  const q0=S.by[t][i];if(q0&&q0.lb)return j==null?q0.lb:`${q0.lb}, ý ${'abcd'[j]}`;
  const base=S.mode!=='practice'?`${partName(t)}, câu ${i+1}`:`${TYPE_NAME[t]}, câu ${i+1}`;
  return j==null?base:`${base}, ý ${'abcd'[j]}`;
}
function badge(P){
  if(P.first&&P.first.every(Boolean))return '<span class="st good">Đúng ngay lần đầu</span>';
  if(P.final)return '<span class="st warn">Đúng ở lần thứ hai</span>';
  return '<span class="st bad">Chưa đúng</span>';

/* ============ Chấm điểm ============ */
function parseNum(s){
  s=String(s).trim().replace(/[−–—]/g,'-');
  if(/^[1-9]\d{0,2}([.\s]\d{3})+$/.test(s))s=s.replace(/[.\s]/g,'');
  s=s.replace(/,/g,'.').replace(/[^0-9.\-\/]/g,'');
  if(!s)return NaN;
  if(s.includes('/')){const [a,b]=s.split('/');return parseFloat(a)/parseFloat(b);}
  return parseFloat(s);
}
function evalQ(q,a){
  if(q.type==='mc')return [a===q.ans];
  if(q.type==='tf'){a=a||[];return q.items.map((it,j)=>a[j]===it.v);}
  const v=parseNum(a==null?'':a);
  return [!isNaN(v)&&q.ans.some(x=>Math.abs(x-v)<1e-6)];
}
function grade(){
  const test=S.mode!=='practice',quick=S.mode==='quick';
  const items=[],sc={mc:0,tf:0,sa:0},errs=[],qres=[];
  const ansOf=q=>test?state.ans[q.id]:(state.pr[q.id]&&state.pr[q.id].firstAns);
  const oksOf=q=>{
    if(test)return evalQ(q,ansOf(q));
    const P=state.pr[q.id];return P&&P.first?P.first:Array(q.type==='tf'?q.items.length:1).fill(false);
  };
  S.by.mc.forEach((q,i)=>{
    const a=ansOf(q),ok=oksOf(q)[0];
    if(ok)sc.mc+=quick?1.25:0.5;else if(a!=null&&q.opts[a]&&q.opts[a].err)errs.push({where:lbl('mc',i),topic:q.topic,text:q.opts[a].err});
    items.push({topic:q.topic,level:q.level,ok,label:lbl('mc',i)});
    qres.push({kind:'mc',q,i,a,ok,pts:ok?(quick?1.25:0.5):0,max:quick?1.25:0.5});
  });
  S.by.tf.forEach((q,i)=>{
    const a=ansOf(q)||[],oks=oksOf(q);let k=0;
    q.items.forEach((it,j)=>{
      const ok=oks[j];if(ok)k++;
      items.push({topic:it.topic,level:it.level,ok,label:lbl('tf',i,q.items.length>1?j:null)});
      if(!ok&&typeof a[j]==='boolean')errs.push({where:lbl('tf',i,q.items.length>1?j:null),topic:it.topic,text:it.exp});
    });
    const pts=quick?(k?1.25:0):TF_SCORE[k];sc.tf+=pts;
    qres.push({kind:'tf',q,i,a,oks,k,pts,max:quick?1.25:1});
  });
  S.by.sa.forEach((q,i)=>{
    const raw=ansOf(q)||'',ok=oksOf(q)[0];
    if(ok)sc.sa+=quick?2.5:1;
    items.push({topic:q.topic,level:q.level,ok,label:lbl('sa',i)});
    qres.push({kind:'sa',q,i,raw,ok,pts:ok?(quick?2.5:1):0,max:quick?2.5:1});
  });
  const topics={};TKEYS.forEach(k=>topics[k]={c:0,n:0});
  const levels={NB:{c:0,n:0},TH:{c:0,n:0},VD:{c:0,n:0}};
  items.forEach(it=>{topics[it.topic].n++;levels[it.level].n++;if(it.ok){topics[it.topic].c++;levels[it.level].c++;}});
  const total=Math.round((sc.mc+sc.tf+sc.sa)*100)/100;
  return {items,sc,total,topics,levels,errs,qres};
}
function pct(o){return o.n?Math.round(100*o.c/o.n):0;}
function updateWeak(r){
  TKEYS.forEach(k=>{if(r.topics[k].n)state.topicPct[k]=pct(r.topics[k]);});

}

function practiceCheck(id){
  const q=S.list.find(x=>x.id===id);if(!q)return;
  const P=state.pr[id]||(state.pr[id]={attempts:0,done:false,tried:[]});
  if(P.done)return;
  const a=state.ans[id];
  if(q.type==='mc'&&a==null)return setFeed(id,'Hãy chọn một đáp án trước.','info');
  if(q.type==='tf'){const arr=a||[];if(q.items.some((_,j)=>typeof arr[j]!=='boolean'))return setFeed(id,'Hãy chọn Đúng hoặc Sai cho cả 4 ý trước.','info');}
  if(q.type==='sa'&&String(a||'').trim()==='')return setFeed(id,'Hãy nhập đáp án trước.','info');
  P.attempts++;
  const oks=evalQ(q,a),all=oks.every(Boolean);
  if(P.attempts===1){P.first=oks;P.firstAns=JSON.parse(JSON.stringify(a));}
  if(all){
    P.done=true;P.final=true;P.cls='ok';
    P.msg=P.attempts===1?'Đúng rồi!':'Đúng ở lần thử thứ hai.';
  }else if(P.attempts===1){
    P.cls='bad';
    if(q.type==='mc'){
      const e=q.opts[a].err;P.tried.push(a);delete state.ans[id];
      P.msg='Chưa đúng.'+(e?' '+e:'')+' Hãy chọn lại một đáp án khác.';
    }else if(q.type==='tf'){
      const k=oks.filter(Boolean).length;P.msg=`Mới đúng ${k}/${q.items.length} ý. Hãy xem lại các ý và thử một lần nữa.`;
    }else P.msg='Đáp án chưa đúng. Hãy kiểm tra lại cách tính và thử một lần nữa.';
  }else{
    P.done=true;P.final=false;P.cls='bad';P.msg='Chưa đúng. Đáp án và lời giải ở bên dưới.';
  }
  let g=null;
  if(P.done){g=GM.onPractice(!!P.final,P.attempts,q.level||(q.items&&q.items[0]&&q.items[0].level)||'TH');if(g&&g.xp)P.msg+=' +'+g.xp+' XP';}
  const el=document.getElementById('q-'+id);
  el.outerHTML=CARD[q.type](q,S.idx[id]);
  updateProgress();
  GM.fx(g,document.getElementById('q-'+id));
}

  const correct=r.items.filter(it=>it.ok).length;
  const head=test
    ?`<div class="big">${fmt(r.total)}<small> / 10</small></div><div><div class="muted small" style="margin-bottom:6px">${esc(state.name||'Học sinh')}${state.cls?' · Lớp '+esc(state.cls):''}${quick?' · Kiểm tra nhanh':S.mode==='hard'?' · Thử thách':''}${state.code?' · Mã đề '+esc(state.code):''}</div><div class="parts">${quick?`<span class="chip">Phần I: ${fmt(r.sc.mc)}/5</span><span class="chip">Phần II: ${fmt(r.sc.sa)}/5</span>`:`<span class="chip">Phần I: ${fmt(r.sc.mc)}/3</span><span class="chip">Phần II: ${fmt(r.sc.tf)}/3</span><span class="chip">Phần III: ${fmt(r.sc.sa)}/4</span>`}<span class="chip">Thời gian: ${fmtTime(state.elapsed)}</span></div></div>`
    :`<div class="big">${correct}<small> / ${r.items.length}</small></div><div><div class="muted small" style="margin-bottom:6px">${S.title}</div><div class="parts"><span class="chip">ý đúng ngay lần đầu</span><span class="chip">Thời gian: ${fmtTime(state.elapsed)}</span><span class="chip">Luyện tập không tính điểm</span></div></div>`;
  const code=test?makeCode(r):'';
  return `
  ${test&&state.timedOut?'<div class="warnbar" role="alert" style="margin:0 0 12px">Đã hết '+(LIMIT[S.mode]/60)+' phút nên bài được nộp tự động. Những ý chưa làm tính là chưa đúng.</div>':''}
  <section class="card stack" style="margin-top:8px">
    <div class="score">${head}</div>
    <p style="margin:0">${comment}</p>
  </section>

  ${GM.resultHTML(state.gm)}
  <section class="card" style="margin-top:16px"><h2 style="margin-bottom:14px">Kết quả theo nội dung kiến thức</h2>
    ${TKEYS.filter(k=>r.topics[k].n).map(k=>barRow(TOPICS[k].name,r.topics[k])).join('')}
  </section>

  <section class="card" style="margin-top:16px"><h2 style="margin-bottom:14px">Kết quả theo mức độ</h2>
    ${Object.keys(LEVELS).filter(k=>r.levels[k].n).map(k=>barRow(LEVELS[k],r.levels[k])).join('')}
  </section>

  <section class="card" style="margin-top:16px"><h2 style="margin-bottom:6px">Nên ôn gì tiếp theo</h2>
    ${weak.length?weak.map(t=>`<div class="advice"><h3>${TOPICS[t.k].name}</h3><p><b>Nhớ:</b> ${TOPICS[t.k].rule}</p><p><b>Lưu ý:</b> ${TOPICS[t.k].tip}</p><p class="small muted">Xem lại: ${missed(t.k).join('; ')}.</p></div>`).join(''):'<p class="muted">Không có nội dung nào dưới 80%.</p>'}
    ${r.errs.length?`<h3 style="margin-top:18px">Những lỗi bạn đã mắc</h3><ul class="plain">${r.errs.map(e=>`<li><b>${e.where}</b> <span class="chip">${TOPICS[e.topic].short}</span><br><span class="muted">${e.text}</span></li>`).join('')}</ul>`:''}
  </section>

  ${test?`<section style="margin-top:22px"><h2 style="margin-bottom:12px">Xem lại từng câu</h2>${reviewHTML(r)}</section>

  <section class="card codebox" style="margin-top:16px"><h2>Gửi kết quả cho giáo viên</h2>
    <p class="small" id="sent" role="status" style="margin:0"></p>
    <p class="muted small" style="margin:0">${SHEET_URL?'Kết quả đã được lưu cho giáo viên ngay khi em nộp bài. Mã dưới đây chỉ cần khi thầy cô yêu cầu.':'Sao chép mã dưới đây và gửi cho giáo viên (Zalo, lớp học trực tuyến).'} Mã chỉ chứa tên, điểm và kết quả theo nội dung.</p>
    <textarea id="code" readonly rows="3" aria-label="Mã kết quả">${code}</textarea>
    <div class="row"><button class="btn sm" id="copy">Sao chép mã</button><span class="small muted" id="copied" role="status"></span></div>
  </section>`:''}

  <div class="row" style="margin-top:22px">
    ${state.weak.length?`<button class="btn" id="weakpack">Luyện gói ôn điểm yếu</button>`:''}
    ${nextSpec()?`<button class="btn ${state.weak.length?'ghost':''}" id="nextpack">Luyện tiếp: gói ${specName(nextSpec())}</button>`:''}
    <button class="btn ${state.weak.length||nextSpec()?'ghost':''}" id="again">${test?(state.code?'Làm lại đề này':'Làm đề kiểm tra khác'):'Làm gói này lần nữa'}</button>
    <button class="btn ghost" id="home">Về trang đầu</button>
  </div>`;
}

/* ============ Màn hình: giáo viên ============ */
function teacherHTML(){
  return `<section class="hero"><h1>Bảng <em>tổng hợp</em> lớp</h1>
    <p class="lead">Điểm kiểm tra của học sinh được chấm và lưu trên máy chủ ngay khi các em nộp bài. Thầy cô mở trang <a href="../so-diem/">Sổ điểm</a> (nhập mã giáo viên) để xem điểm từng lớp, từng bài và tải Excel, không cần dán mã.</p>
    <p class="lead"><b>Tổng hợp nhanh bằng mã kết quả:</b> dán mã kết quả (hiện ở trang kết quả của học sinh) bài kiểm tra Bài tập cuối chương IV của học sinh (bắt đầu bằng ${CODE_PREFIX}), mỗi mã một dòng. Bảng cho thấy điểm từng em và nội dung kiến thức cả lớp còn yếu. Mỗi học sinh nhận một đề khác nhau nhưng cùng cấu trúc, nên điểm vẫn so sánh được.</p></section>
    <section class="card stack" style="margin-top:18px">
      <div><label class="fl" for="codes">Mã kết quả</label><textarea id="codes" placeholder="${CODE_PREFIX}eyJ2IjoxLC..."></textarea></div>
      <div class="row"><button class="btn" id="analyze">Tổng hợp</button><button class="btn ghost" id="clearc">Xóa</button></div>
      <div id="tout" aria-live="polite"></div>
    </section>`;
}
function decodeCode(line){
  line=line.trim();if(!line.startsWith(CODE_PREFIX))return null;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(line.slice(CODE_PREFIX.length)))));if(o&&o.t&&typeof o.s==='number')return o;}catch(e){}
  return null;
}
function analyzeCodes(){
  const lines=document.getElementById('codes').value.split(/\r?\n/).filter(l=>l.trim());
  const rows=[],bad=[];let other=0;
  lines.forEach((l,i)=>{const o=decodeCode(l);if(o)rows.push(o);else{bad.push(i+1);if(/^[A-Z0-9]{2,4}-/.test(l.trim())&&!l.trim().startsWith(CODE_PREFIX))other++;}});
  const out=document.getElementById('tout');
  if(!rows.length){out.innerHTML=`<div class="warnbar">${lines.length?`Không đọc được mã nào. Hãy kiểm tra mã đã được sao chép đầy đủ, bắt đầu bằng ${CODE_PREFIX}.${other?' Có mã của bài khác (ví dụ Tam giác bằng nhau): hãy dán mã đó ở trang của bài ấy.':''}`:'Hãy dán ít nhất một mã kết quả.'}</div>`;return;}
  const cell=o=>{if(!o||!o[1])return '<td class="cell">–</td>';const p=Math.round(100*o[0]/o[1]);return `<td class="cell ${status(p)[0]}">${p}%</td>`;};
  const avg=TKEYS.map(k=>{let c=0,n=0;rows.forEach(r=>{if(r.t[k]){c+=r.t[k][0];n+=r.t[k][1];}});return [c,n];});
  const mean=rows.reduce((s,r)=>s+r.s,0)/rows.length;
  const timed=rows.filter(r=>typeof r.m==='number'),meanT=timed.length?timed.reduce((s,r)=>s+r.m,0)/timed.length:null;
  const tcell=r=>typeof r.m==='number'?fmtTime(r.m):'–';
  const flag=r=>(typeof r.m==='number'&&r.m<0.25*(r.L||1800)&&r.s<5)?' <span class="chip">Làm nhanh, điểm thấp</span>':'';
  const chips=r=>(r.c?` <span class="chip">Lớp ${esc(r.c)}</span>`:'')+(r.q==='quick'?' <span class="chip">Nhanh 5 phút</span>':r.q==='hard'?' <span class="chip">Thử thách 30 phút</span>':'')+(r.k?` <span class="chip">Mã đề ${esc(r.k)}</span>`:'');
  const weakCount=TKEYS.map(k=>rows.filter(r=>r.t[k]&&r.t[k][1]&&100*r.t[k][0]/r.t[k][1]<50).length);
  const worst=TKEYS.map((k,i)=>({k,p:avg[i][1]?100*avg[i][0]/avg[i][1]:100})).sort((a,b)=>a.p-b.p)[0];
  out.innerHTML=`${bad.length?`<div class="warnbar" style="margin:0 0 12px">Bỏ qua ${bad.length} dòng không đọc được (dòng ${bad.join(', ')}).${other?' Có mã của bài khác, hãy dán ở trang của bài ấy.':''}</div>`:''}
    <p style="margin:0 0 10px"><b>${rows.length}</b> học sinh · điểm trung bình <b>${fmt(mean)}</b>. Nội dung cả lớp còn yếu nhất: <b>${TOPICS[worst.k].name}</b> (${Math.round(worst.p)}%).</p>
    <div class="tablewrap"><table><thead><tr><th>Học sinh</th><th>Điểm</th><th>Thời gian</th>${TKEYS.map(k=>`<th>${TOPICS[k].short}</th>`).join('')}</tr></thead><tbody>
    ${rows.sort((a,b)=>a.s-b.s).map(r=>`<tr><td>${esc(r.n)}${chips(r)}${flag(r)}</td><td><b>${fmt(r.s)}</b></td><td>${tcell(r)}</td>${TKEYS.map(k=>cell(r.t[k])).join('')}</tr>`).join('')}
    <tr><td><b>Cả lớp</b></td><td><b>${fmt(mean)}</b></td><td>${meanT===null?'–':fmtTime(meanT)}</td>${avg.map(cell).join('')}</tr>
    <tr><td class="muted">Số em dưới 50%</td><td></td><td></td>${weakCount.map(n=>`<td class="cell">${n}</td>`).join('')}</tr>
    </tbody></table></div>
    <p class="small muted" style="margin:10px 0 0">Màu: xanh từ 80%, vàng từ 50% đến dưới 80%, đỏ dưới 50%. Các em được xếp từ điểm thấp đến cao để dễ thấy em cần hỗ trợ. Nhãn "Làm nhanh, điểm thấp" hiện khi em nộp bài trong chưa đầy một phần tư thời gian cho phép mà dưới 5 điểm, thường là em chưa làm kỹ nên cần hỏi lại.</p>`;
}

/* ============ Điều hướng và sự kiện ============ */
function render(){
  const gv=location.hash==='#giao-vien';
  document.getElementById('nav-hs').setAttribute('aria-current',gv?'false':'page');
  document.getElementById('nav-gv').setAttribute('aria-current',gv?'page':'false');
  if(gv){stopTimer();$app.innerHTML=teacherHTML();GM.refresh();return;}
  if(state.view==='home'){stopTimer();$app.innerHTML=homeHTML();}
  else if(state.view==='quiz'){$app.innerHTML=quizHTML();updateProgress();startTimer();}
  else{stopTimer();$app.innerHTML=resultHTML();if(SHEET_URL&&S.mode!=='practice'&&state.sentCode!==makeCode(state.result))sendResult();else if(SHEET_URL&&S.mode!=='practice')setSent('Đã gửi kết quả cho giáo viên.');}
  window.scrollTo(0,0);
  GM.refresh();GM.sync();
}
function normCode(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'');}
function withCode(mode,fn){
  if(!state.code){fn();return;}
  RNG=mulberry32(hashStr(mode+'|'+state.code));SEEDED=true;
  try{fn();}finally{RNG=Math.random;SEEDED=false;}
}
function startTest(){if(!GM.gate('test',null,state.code,startTest))return;withCode('test',buildTest);state.view='quiz';render();}
function startQuick(){if(!GM.gate('quick',null,state.code,startQuick))return;withCode('quick',buildQuick);state.view='quiz';render();}
function startHard(){if(!GM.gate('hard',null,state.code,startHard))return;withCode('hard',buildHard);state.view='quiz';render();}
function startPack(spec){if(!GM.gate('practice',spec,'',function(){startPack(spec);}))return;if(spec.kind==='pisa')buildPisa();else buildPractice(spec);state.view='quiz';render();}
// Gói kế tiếp sau khi luyện xong: mức độ kế tiếp hoặc nội dung kế tiếp (gói cuối thì không có)
function nextSpec(){
  if(!S||S.mode!=='practice'||!S.spec)return null;
  const sp=S.spec,list=sp.kind==='level'?Object.keys(LEVELS):sp.kind==='topic'?TKEYS:[],i=list.indexOf(sp.val);
  return i>=0&&i<list.length-1?{kind:sp.kind,val:list[i+1]}:null;
}
const specName=sp=>sp.kind==='level'?LEVELS[sp.val]:TOPICS[sp.val].short;
function parsePack(s){
  if(s==='weak')return {kind:'weak',topics:state.weak.slice()};
  const [kind,val]=s.split(':');return {kind,val};
}
function finish(force){
  const test=S.mode!=='practice';
  const left=test?totalItems()-answered():S.list.length-doneCount();
  if(left>0&&!force){
    const w=document.getElementById('warn');
    w.innerHTML=test
      ?`<div class="warnbar" role="alert">Còn <b>${left}</b> ý chưa trả lời. Những ý này sẽ tính là chưa đúng.<div class="row" style="margin-top:10px"><button class="btn sm" id="force">Vẫn nộp bài</button><button class="btn ghost sm" id="keep">Làm tiếp</button></div></div>`
      :`<div class="warnbar" role="alert">Còn <b>${left}</b> câu chưa kiểm tra xong. Những câu này sẽ tính là chưa đúng ngay lần đầu.<div class="row" style="margin-top:10px"><button class="btn sm" id="force">Vẫn xem kết quả</button><button class="btn ghost sm" id="keep">Làm tiếp</button></div></div>`;
    w.scrollIntoView({block:'center'});return;
  }
  stopTimer();
  state.elapsed=Math.floor((Date.now()-state.t0)/1000);
  if(test)state.elapsed=Math.min(state.elapsed,LIMIT[S.mode]);
  state.result=grade();updateWeak(state.result);state.gm=GM.onFinish(state.result,S.mode);state.view='result';render();
}
loadHS();recheckHS();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hsma'){e.preventDefault();checkHS();}});
document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-pack]');
  if(pk&&!pk.disabled){startPack(parsePack(pk.dataset.pack));return;}
  const ck=e.target.closest('.chk');
  if(ck){practiceCheck(ck.dataset.q);return;}
  const id=e.target.id;
  if(id==='start'||id==='startq'||id==='starth'){if(!needHS()){state.name=document.getElementById('nm').value.trim();state.cls=normCode(document.getElementById('cls').value);}state.code=normCode(document.getElementById('mcode').value);
    if(id==='start')startTest();else if(id==='starth')startHard();else startQuick();}
  else if(id==='hsgo')checkHS();
  else if(id==='hsout'){saveHS(null);state.view='home';render();}
  else if(id==='submit')finish(false);
  else if(id==='force')finish(true);
  else if(id==='keep')document.getElementById('warn').innerHTML='';
  else if(id==='back'){state.view='home';render();}
  else if(id==='again'){if(S.mode==='test')startTest();else if(S.mode==='quick')startQuick();else if(S.mode==='hard')startHard();else startPack(S.spec.kind==='weak'?{kind:'weak',topics:state.weak.length?state.weak.slice():S.spec.topics}:S.spec);}
  else if(id==='weakpack')startPack({kind:'weak',topics:state.weak.slice()});
  else if(id==='nextpack'){const n=nextSpec();if(n)startPack(n);}
  else if(id==='home'){state.view='home';render();}
  else if(id==='copy'){
    const t=document.getElementById('code'),m=document.getElementById('copied');
    t.focus();t.select();
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{m.textContent='Đã sao chép.';}).catch(()=>{m.textContent='Hãy nhấn giữ vùng chọn rồi chọn Sao chép.';});
  }
  else if(id==='resend')sendResult();
  else if(id==='analyze')analyzeCodes();
  else if(id==='clearc'){document.getElementById('codes').value='';document.getElementById('tout').innerHTML='';}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.type!=='radio')return;
  const m=t.name.match(/^(.+)-(\d)$/);
  if(m){const a=state.ans[m[1]]||(state.ans[m[1]]=[]);a[+m[2]]=t.value==='1';}
  else state.ans[t.name]=+t.value;
  updateProgress();
});
document.addEventListener('input',e=>{
  const id=e.target.dataset&&e.target.dataset.sa;
  if(id){state.ans[id]=e.target.value;updateProgress();}
});
window.addEventListener('hashchange',render);
render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});</script>
</body>
</html>
