<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tập cuối chương III – Toán 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,600&display=swap" rel="stylesheet">
<style>
/* Worksheet on graph paper. Blue ink for text, red pencil for the marked points. */
:root{
  --paper:#f2f6fc; --card:#ffffff; --ink:#13203a; --muted:#54627f; --line:#cdd7e9;
  --grid:rgba(52,96,170,.08); --accent:#1f4fd8; --accent-ink:#ffffff; --mark:#d9342b; --tri:#eaf0fc;
  --good:#17754a; --good-bg:#e4f4ea; --warn:#9a5b00; --warn-bg:#fff0d4; --bad:#b3261e; --bad-bg:#fde8e6;
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1730; --card:#142245; --ink:#e8eefc; --muted:#9fb0d4; --line:#2b3c6b;
    --grid:rgba(140,170,255,.07); --accent:#8aa9ff; --accent-ink:#0d1730; --mark:#ff7f72; --tri:#1a2b57;
    --good:#58d19a; --good-bg:#12372d; --warn:#f3b955; --warn-bg:#3b2d10; --bad:#ff8a80; --bad-bg:#40191b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1730; --card:#142245; --ink:#e8eefc; --muted:#9fb0d4; --line:#2b3c6b;
  --grid:rgba(140,170,255,.07); --accent:#8aa9ff; --accent-ink:#0d1730; --mark:#ff7f72; --tri:#1a2b57;
  --good:#58d19a; --good-bg:#12372d; --warn:#f3b955; --warn-bg:#3b2d10; --bad:#ff8a80; --bad-bg:#40191b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font:16px/1.65 var(--body); -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 72px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
sup{font-size:.72em;line-height:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.top b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.top nav{display:flex;gap:16px;flex-wrap:wrap}
.top nav a{color:var(--muted);text-decoration:none;border-bottom:1.5px solid transparent;padding-bottom:1px}
.top nav a[aria-current="page"]{color:var(--ink);border-color:var(--mark)}

h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,8vw,3.9rem);font-weight:700;letter-spacing:-.01em}
h1 em{color:var(--accent);font-weight:600}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
.lead{font-size:1.08rem;color:var(--muted);max-width:56ch;margin:14px 0 0}

.hero{padding:12px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 22px;border-radius:10px;cursor:pointer;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.9rem}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
label.fl{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}

.dt{border-collapse:collapse;margin:10px 0 2px;font-size:.95rem}
.dt th,.dt td{border:1px solid var(--line);padding:6px 14px;text-align:left}
.dt th{background:var(--paper)}
.figbox{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;max-width:400px;margin:10px 0}
.figbox.ms{max-width:none}
.figbox p{margin:2px 0}
.ms{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.ms .r{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ms .r b{min-width:54px;font-family:var(--display)}
.ms i{font-style:normal;min-width:30px;text-align:center;padding:2px 4px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums}
.ms i.c{border-color:var(--mark);color:var(--mark);font-weight:700}

.grp{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mark);margin:18px 0 8px}
.grp:first-of-type{margin-top:6px}
.pack{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.pk{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.pk:hover{border-color:var(--accent)}
.pk b{font-family:var(--display);font-size:1.02rem}
.pk span{font-size:.84rem;color:var(--muted);line-height:1.4}
.pk[disabled]{opacity:.55;cursor:not-allowed}
.pk[disabled]:hover{border-color:var(--line)}
.recap{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.recap{grid-template-columns:1fr 1fr}}
.recap .card{display:flex;flex-direction:column;gap:6px}
.recap h3{font-size:1.02rem}
.recap p{margin:0;font-size:.93rem}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--paper);white-space:nowrap}

.bar-sticky{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:10px 16px}
.timer{font-variant-numeric:tabular-nums;font-size:.95rem}
.timer.low{color:var(--bad)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.part{margin:28px 0 12px}
.part .kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mark)}
.part p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.q{margin-bottom:14px}
.qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.qn{font-weight:700;font-family:var(--display);font-size:1.08rem}
.stem{margin:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .ol{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt:has(input:checked){border-color:var(--accent);background:var(--tri)}
.opt:has(input:checked) .ol{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){cursor:default}
.opt:has(input:disabled):hover{border-color:var(--line)}
.opt.is-right,.opt.is-right:hover{border-color:var(--good);background:var(--good-bg)}
.opt.is-right .ol{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.is-wrong,.opt.is-wrong:hover{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .ol{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.tf{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tfr{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px dashed var(--line)}
.tfr .tx{flex:1 1 260px}
.tfr .tx b{font-family:var(--display);margin-right:6px}
.tfr .exp{flex-basis:100%;margin-top:0}
.tfb{display:flex;gap:8px}
.tfb .opt{padding:7px 16px;border-radius:99px;font-weight:600;font-size:.92rem}
.sa{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.sa input{max-width:180px}
.warnbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin-top:16px}
.feed{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.94rem}
.feed.ok{background:var(--good-bg);color:var(--good)}
.feed.bad{background:var(--bad-bg);color:var(--bad)}
.feed.info{background:var(--warn-bg);color:var(--warn)}
.exp{background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.94rem}

.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:clamp(3rem,14vw,4.6rem);line-height:1;letter-spacing:-.02em}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts .chip{font-size:.85rem;padding:5px 12px}
.topic{padding:14px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0;padding-top:0}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.track{height:12px;border-radius:99px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.st{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.st.good{background:var(--good-bg);color:var(--good)}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.fill-good{background:var(--good)} .fill-warn{background:var(--warn)} .fill-bad{background:var(--bad)}
.advice{border-left:4px solid var(--mark);padding:2px 0 2px 14px;margin:10px 0}
.advice p{margin:4px 0}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
details.rv{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
details.rv summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .body{padding:0 14px 14px;border-top:1px dashed var(--line)}
.mark-ok{color:var(--good);font-weight:700} .mark-no{color:var(--bad);font-weight:700}
.ans-line{margin:6px 0;font-size:.94rem}
.codebox{display:flex;flex-direction:column;gap:8px}

table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.cell{font-weight:600;text-align:center}
td.cell.good{color:var(--good)} td.cell.warn{color:var(--warn)} td.cell.bad{color:var(--bad)}
.tablewrap{overflow-x:auto}
[hidden]{display:none!important}
footer{margin-top:40px;color:var(--muted);font-size:.8rem}
.ax{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.ah{fill:var(--ink)}
.tl{fill:var(--ink);font-size:15px;font-family:var(--body);font-variant-numeric:tabular-nums}
.ol0{fill:var(--muted);font:italic 600 15px var(--display)}
.pt{fill:var(--mark)}
.pl{fill:var(--mark);font:italic 700 17px var(--display)}
</style>
</head>

  </header>

  <main id="app"></main>

  <footer>Bài luyện chấm tự động ngay trên trình duyệt. Kết quả không được lưu trên máy chủ; học sinh gửi mã kết quả của bài kiểm tra cho giáo viên để tổng hợp.</footer>

<script src="../gamify.js"></script>
<script>
"use strict";
if(!window.GM)window.GM={onPractice(){return null;},onFinish(){return null;},barHTML(){return '';},resultHTML(){return '';},fx(){},refresh(){},sync(){},rebar(){},gate(){return true;}}; // gamify.js không tải được thì trang vẫn chạy bình thường

/* ============ Số nguyên: cách viết ============ */
const N=x=>x<0?'−'+(-x):''+x;          // viết số nguyên, số âm dùng dấu trừ "−"
const L=a=>a.map(N).join('; ');
const P=x=>x<0?'('+N(x)+')':N(x);       // số âm đặt trong ngoặc khi đứng sau dấu phép tính
const nb=s=>s.replace(/ /g,' ');   // khoảng trắng không ngắt dòng, để phép tính không bị tách đôi
const ADD=(a,b)=>nb(N(a)+' + '+P(b));
const SUB=(a,b)=>nb(N(a)+' − '+P(b));
const SUMX=v=>nb(v.map((x,i)=>i===0?N(x):'+ '+P(x)).join(' '));   // 3 + (−5) + 7
function EX(v0,ops){let s=N(v0),val=v0;for(const [g,v] of ops){s+=(g>0?' + ':' − ')+P(v);val+=g*v;}return {txt:nb(s),val};}
const sum=v=>v.reduce((s,x)=>s+x,0);
const sgn=()=>RNG()<.5?-1:1;

/* ============ Ngẫu nhiên có hạt giống ============ */
let RNG=Math.random,SEEDED=false;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;}
const ri=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const sel=a=>a[ri(0,a.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(n,lo,hi){const all=[];for(let v=lo;v<=hi;v++)all.push(v);return shuffle(all).slice(0,n);}
const asc=a=>a.slice().sort((x,y)=>x-y);

function pickOpts(goodT,cands){
  const seen=new Set([goodT]),out=[];
  for(const c of cands){if(!seen.has(c.t)){seen.add(c.t);out.push({t:c.t,err:c.err});}if(out.length===3)break;}
  return out;
}
const C=(t,err)=>({t,err});
const mk=(stem,good,cands,exp)=>({stem,opts:[{t:good}].concat(pickOpts(good,cands)),ans:0,exp});
function tryGen(f){
  for(let n=0;n<100;n++){const r=f();if(r&&r.opts.length===4&&new Set(r.opts.map(o=>o.t)).size===4)return r;}
  return FB_MC();
}


const mcq=(stem,right,wrongs,exp,topic,level)=>({type:'mc',topic,level,stem,ans:0,opts:[{t:right}].concat(wrongs.map(w=>({t:w[0],err:w[1]}))),exp});
const saq=(stem,ans,unit,exp,topic,level)=>({type:'sa',topic,level,unit,stem,ans:[ans],exp});
const tbl=(head,rows)=>`<div style="overflow-x:auto"><table class="dt"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const tfOK=its=>{const k=its.filter(i=>i.v).length;return k>=1&&k<=3&&new Set(its.map(i=>i.t)).size===its.length;};

/* ============ Dùng chung ============ */
const O=(t,err)=>err?{t,err}:{t};
const IT=(t,v,topic,level,exp)=>({t,v,topic,level,exp});
const FB_MC=()=>({stem:'Số đối của −7 là:',opts:[{t:'7'},{t:'−7',err:'Số đối của −7 là số nằm bên kia điểm 0, cách 0 bảy đơn vị.'},{t:'0',err:'Chỉ số đối của 0 mới là 0.'},{t:'−70',err:'Số đối giữ nguyên độ lớn.'}],ans:0,exp:'Số đối của −7 là 7.'});
const FB_TF=()=>({stem:'Xét các phát biểu sau:',items:[
  IT('Mọi số nguyên âm đều nhỏ hơn 0.',true,'sn','NB','Số nguyên âm nằm bên trái điểm 0 trên trục số.'),
  IT('Số 0 là một số nguyên dương.',false,'sn','NB','0 không là số nguyên dương cũng không là số nguyên âm.'),
  IT('Số đối của 5 là −5.',true,'sn','NB','Hai số đối nhau nằm hai phía của 0 và cách đều 0.'),
  IT('−9 lớn hơn −2.',false,'sn','NB','Trong hai số âm, số có phần số tự nhiên lớn hơn thì nhỏ hơn: −9 < −2.')]});
function pick4(Ts,Fs){const nT=ri(1,3);return shuffle(shuffle(Ts).slice(0,nT).concat(shuffle(Fs).slice(0,4-nT)));}
function mixed(make){for(let n=0;n<80;n++){const items=make();if(items.some(i=>!i))continue;const k=items.filter(i=>i.v).length;if(k>=1&&k<=3&&new Set(items.map(i=>i.t)).size===4)return items;}return null;}
const four=f=>()=>{const items=mixed(()=>[f(),f(),f(),f()]);return items?{stem:'Xét các phát biểu sau:',items}:FB_TF();};
const ab=Math.abs;
const nz=(lo,hi)=>ri(lo,hi)*sgn();
const NN=x=>(x<0?'−':'')+String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const B14=(()=>{
/* ============ Bộ sinh câu nhiều lựa chọn ============ */
/* --- Cộng hai số nguyên --- */
function genAddNeg(){return tryGen(()=>{
  const [a,b]=sample(2,2,60);
  return mk(`Kết quả của phép tính ${ADD(-a,-b)} là bao nhiêu?`,N(-(a+b)),[
    C(N(a+b),'Tổng của hai số nguyên âm là số nguyên âm, không thể là số dương.'),
    C(N(-Math.abs(a-b)),'Bạn đã lấy hiệu hai số. Hai số cùng dấu thì ta cộng phần số tự nhiên của chúng.'),
    C(N(Math.abs(a-b)),'Bạn đã trừ hai số thay vì cộng, và sai cả dấu.')],
    `Hai số cùng dấu âm: cộng hai số tự nhiên ${a} + ${b} = ${a+b}, rồi đặt dấu "−" trước kết quả: ${N(-(a+b))}.`);
});}
function genAddDiff(){return tryGen(()=>{
  const [x,y]=sample(2,2,60),neg1=RNG()<.5;
  const a=neg1?-x:x,b=neg1?y:-y,s=a+b,big=Math.max(x,y),small=Math.min(x,y);
  return mk(`Tính ${ADD(a,b)}.`,N(s),[
    C(N(-s),'Dấu của kết quả phải là dấu của số có giá trị tuyệt đối lớn hơn.'),
    C(N(x+y),'Hai số khác dấu thì ta lấy hiệu hai giá trị tuyệt đối chứ không cộng chúng.'),
    C(N(-(x+y)),'Hai số khác dấu thì ta lấy hiệu hai giá trị tuyệt đối chứ không cộng chúng.')],
    `Hai số khác dấu: lấy ${big} − ${small} = ${big-small}. Số có giá trị tuyệt đối lớn hơn là ${N(big===x?a:b)} nên kết quả mang dấu ${s<0?'"−"':'"+"'}: ${N(s)}.`);
});}
function genSum4(){return tryGen(()=>{

/* ============ Bộ sinh đúng sai ============ */
const IT=(t,v,topic,level,exp)=>({t,v,topic,level,exp});
function pick4(Ts,Fs){
  const nT=ri(1,3);
  return shuffle(shuffle(Ts).slice(0,nT).concat(shuffle(Fs).slice(0,4-nT)));
}
function mixed(make){ // tạo 4 ý, bảo đảm có cả ý đúng và ý sai, không trùng nhau
  for(let n=0;n<60;n++){const items=make();const k=items.filter(i=>i.v).length;if(k>=1&&k<=3&&new Set(items.map(i=>i.t)).size===items.length)return items;}
  return null;
}
const FB_TF=()=>({stem:'Xét các phát biểu sau:',items:[
  IT(nb('(−6) + (−4) = −10'),true,'cg','TH','Cộng hai số nguyên âm: 6 + 4 = 10, kết quả mang dấu "−".'),
  IT('Tổng của hai số nguyên đối nhau bằng chính số đó.',false,'cg','TH','Tổng của hai số đối nhau bằng 0.'),
  IT(nb('5 − 8 = −3'),true,'tr','TH','5 − 8 = 5 + (−8) = −3.'),
  IT(nb('7 − (−2) = 5'),false,'tr','TH','7 − (−2) = 7 + 2 = 9.')]});
const wrongOf=(s,list)=>{const l=list.filter(x=>x!==s);return l.length?sel(l):s+1;};
/* một ý: phép cộng hai số nguyên */
function addItem(){
  const [x,y]=sample(2,2,50),kind=ri(0,2);
  let a,b;if(kind===0){a=-x;b=-y;}else{a=sgn()*x;b=a<0?y:-y;}
  const s=a+b,v=RNG()<.5,shown=v?s:wrongOf(s,kind===0?[x+y,-Math.abs(x-y)]:[-s,x+y,-(x+y)]);
  return IT(`${ADD(a,b)} = ${N(shown)}`,v,'cg','TH',v?`${ADD(a,b)} = ${N(s)}.${kind===0?' Hai số âm: cộng phần số tự nhiên rồi đặt dấu "−".':' Hai số khác dấu: lấy hiệu hai giá trị tuyệt đối, đặt dấu của số có giá trị tuyệt đối lớn hơn.'}`:`Kết quả đúng của ${ADD(a,b)} là ${N(s)}, không phải ${N(shown)}.`);
}
/* một ý: tổng nhiều số hạng (vận dụng) */
function sum3Item(){
  const v=[sgn()*ri(2,30),sgn()*ri(2,30),sgn()*ri(2,30)],s=sum(v),t=RNG()<.5,shown=t?s:wrongOf(s,[-s,s-2*v[2],s-2*v[0]]);
  return IT(`${SUMX(v)} = ${N(shown)}`,t,'cg','VD',t?`${N(v[0])} + ${P(v[1])} = ${N(v[0]+v[1])}; ${N(v[0]+v[1])} + ${P(v[2])} = ${N(s)}.`:`Cộng lần lượt được ${N(s)}, không phải ${N(shown)}.`);
}
function tfCalc(level){return ()=>{const f=level==='VD'?sum3Item:addItem;const items=mixed(()=>[f(),f(),f(),f()]);return items?{stem:'Xét các phát biểu sau:',items}:FB_TF();};}
/* một ý: phép trừ hai số nguyên */
function subItem(){
  const a=sgn()*ri(1,30),b=sgn()*ri(1,30),s=a-b,v=RNG()<.5,shown=v?s:wrongOf(s,[a+b,b-a,-s]);
  return IT(`${SUB(a,b)} = ${N(shown)}`,v,'tr','TH',v?`${SUB(a,b)} = ${N(a)} + ${P(-b)} = ${N(s)}.`:`${SUB(a,b)} = ${N(a)} + ${P(-b)} = ${N(s)}, không phải ${N(shown)}.`);

function saAddDiff(){const [x,y]=sample(2,2,60),neg=RNG()<.5,a=neg?-x:x,b=neg?y:-y;return{stem:`Tính ${ADD(a,b)}.`,ans:[a+b],exp:`Hai số khác dấu: lấy hiệu hai giá trị tuyệt đối ${Math.max(x,y)} − ${Math.min(x,y)} = ${Math.abs(x-y)}, đặt dấu của số có giá trị tuyệt đối lớn hơn: ${N(a+b)}.`};}
function saSum4(){let v,s;do{v=[sgn()*ri(2,30),sgn()*ri(2,30),sgn()*ri(2,30),sgn()*ri(2,30)];s=sum(v);}while(v.every(x=>x>0)||v.every(x=>x<0));return{stem:`Tính ${SUMX(v)}.`,ans:[s],exp:`Cộng lần lượt: ${N(v[0])} + ${P(v[1])} = ${N(v[0]+v[1])}; rồi ${N(v[0]+v[1])} + ${P(v[2])} = ${N(v[0]+v[1]+v[2])}; rồi ${N(v[0]+v[1]+v[2])} + ${P(v[3])} = ${N(s)}.`};}
function saRange(){let a,b;do{[a,b]=sample(2,2,12);}while(a===b);const s=rangeSum(a,b);return{stem:`Tính tổng tất cả các số nguyên x thỏa mãn ${nb(N(-a)+' ≤ x ≤ '+b)}.`,ans:[s],exp:`Các cặp số đối nhau có tổng bằng 0. ${b>a?`Còn lại các số từ ${a+1} đến ${b}`:`Còn lại các số từ ${N(-a)} đến ${N(-(b+1))}`}, tổng bằng ${N(s)}.`};}
function saZero(){const x=sgn()*ri(2,60);return{stem:`Tìm số nguyên a thỏa mãn ${nb('a + '+P(x)+' = 0')}.`,ans:[-x],exp:`Hai số có tổng bằng 0 là hai số đối nhau, nên a là số đối của ${N(x)}: a = ${N(-x)}.`};}
function saAssoc3(){const [x0,y0]=sample(2,2,60),x=sgn()*x0,y=sgn()*y0;return{stem:`Tính hợp lý: ${SUMX(shuffle([x,y,-x]))}.`,ans:[y],exp:`${N(x)} + ${P(-x)} = 0 nên tổng bằng ${N(y)}.`};}
function saAssoc6(){const [x0,y0,z0,w0]=sample(4,2,50),x=sgn()*x0,y=sgn()*y0,z=sgn()*z0,w=sgn()*w0;return{stem:`Tính hợp lý: ${SUMX(shuffle([x,y,z,w,-x,-y]))}.`,ans:[z+w],exp:`Nhóm các cặp số đối nhau: ${N(x)} + ${P(-x)} = 0 và ${N(y)} + ${P(-y)} = 0. Còn lại ${N(z)} + ${P(w)} = ${N(z+w)}.`};}
function saSubNB(){const [x,y]=sample(2,1,60);return{stem:`Tính ${nb(x+' − '+y)}.`,ans:[x-y],exp:`${nb(x+' − '+y)} = ${ADD(x,-y)} = ${N(x-y)}.`};}
function saSubTH(){const a=sgn()*ri(1,40),b=sgn()*ri(1,40);return{stem:`Tính ${SUB(a,b)}.`,ans:[a-b],exp:`${SUB(a,b)} = ${N(a)} + ${P(-b)} = ${N(a-b)}.`};}
function saSub3(){const g=[sgn(),sgn()],v0=sgn()*ri(2,30),b=sgn()*ri(2,30),c=sgn()*ri(2,30),e=EX(v0,[[g[0],b],[g[1],c]]);return{stem:`Tính ${e.txt}.`,ans:[e.val],exp:`Đổi phép trừ thành cộng với số đối: ${SUMX([v0,g[0]*b,g[1]*c])} = ${N(e.val)}.`};}
function saUnknown(){const a=ri(2,40),b=sgn()*ri(2,40);return RNG()<.5?{stem:`Tìm số nguyên x biết ${nb('x + '+P(-a)+' = '+N(b))}.`,ans:[b+a],exp:`Số hạng chưa biết bằng tổng trừ số hạng đã biết: x = ${N(b)} − ${P(-a)} = ${N(b)} + ${a} = ${N(b+a)}.`}:{stem:`Tìm số nguyên x biết ${nb(N(a)+' − x = '+N(b))}.`,ans:[a-b],exp:`Số trừ bằng số bị trừ trừ hiệu: x = ${N(a)} − ${P(b)} = ${N(a-b)}.`};}
function saDiffTemp(){const lo=ri(3,25),hi=ri(2,25);return{stem:`Nhiệt độ lúc sáng sớm là ${N(-lo)}°C, đến trưa là ${hi}°C. Nhiệt độ đã tăng bao nhiêu độ?`,ans:[hi+lo],exp:`Số độ tăng = ${hi} − (${N(-lo)}) = ${hi} + ${lo} = ${hi+lo}°C.`};}
function saMove(){const a=ri(3,25),b=ri(a+1,a+25),right=RNG()<.5,val=-a+(right?b:-b);return{stem:`Trên trục số, điểm A biểu diễn số ${N(-a)}. Điểm B nằm bên ${right?'phải':'trái'} điểm A và cách A ${b} đơn vị. Điểm B biểu diễn số nào?`,ans:[val],exp:`Sang ${right?'phải':'trái'} là ${right?'cộng':'trừ'}: ${nb(EX(-a,[[right?1:-1,b]]).txt)} = ${N(val)}.`};}
function saGap(){const a=ri(10,80),b=ri(5,60);return{stem:`Điểm A ở độ cao ${a} m, điểm B ở độ cao ${N(-b)} m so với mực nước biển. Điểm A cao hơn điểm B bao nhiêu mét?`,ans:[a+b],exp:`Chênh lệch độ cao: ${nb(`${a} − ${P(-b)} = ${a} + ${b} = ${a+b}`)} (m).`};}
function saAfterTemp(){const t=sgn()*ri(1,20),d=ri(3,25),up=RNG()<.5,val=t+(up?d:-d);return{stem:`Lúc đầu nhiệt độ là ${N(t)}°C. Sau đó nhiệt độ ${up?'tăng':'giảm'} ${d}°C. Nhiệt độ lúc sau là bao nhiêu độ C?`,ans:[val],exp:`${up?'Tăng':'Giảm'} là ${up?'cộng':'trừ'}: ${EX(t,[[up?1:-1,d]]).txt} = ${N(val)}°C.`};}
function saAlt(){const a=ri(10,60),b=ri(5,a-1),c=ri(3,30),val=-a+b-c;return{stem:`Một tàu ngầm đang ở độ cao ${N(-a)} m so với mực nước biển. Tàu nổi lên ${b} m, sau đó lặn xuống ${c} m. Độ cao của tàu lúc sau là bao nhiêu mét?`,ans:[val],exp:`${EX(-a,[[1,b],[-1,c]]).txt} = ${N(val)} m.`};}
function saProfit(){let m,s;do{m=[ri(5,40),ri(5,40),ri(5,40)].map(v=>sgn()*v);s=sum(m);}while(s===0||m.every(x=>x>0)||m.every(x=>x<0));const nm=['tháng 1','tháng 2','tháng 3'];return{stem:`Một cửa hàng trong ba tháng liên tiếp: ${m.map((v,i)=>`${nm[i]} ${v>0?'lãi':'lỗ'} ${Math.abs(v)} triệu đồng`).join(', ')}. Tổng lợi nhuận ba tháng là bao nhiêu triệu đồng? (Số âm là lỗ.)`,ans:[s],exp:`Lãi là số dương, lỗ là số âm: ${SUMX(m)} = ${N(s)} triệu đồng.`};}

/* mode: ok | none (bỏ ngoặc, giữ nguyên mọi dấu) | first (chỉ đổi dấu số hạng đầu) | all (đổi dấu mọi số hạng trong mọi ngoặc) */
function EXP(parts,mode){
  let s='';const flat=[];
  parts.forEach((p,i)=>{
    if(p&&p.v){
      s+=(i===0?(p.g<0?'−':''):(p.g<0?' − ':' + '))+'('+TS(p.v)+')';

/* dãy tính có số âm đặt trong ngoặc: (−23) − 15 − (−23) + 5 + (−10)
   w: lỗi khi viết gọn. 1: "− (−x)" thành "− x"; 2: "+ (−x)" thành "+ x"; 3: cả hai */
function CH(v0,ops,w){
  let s=P(v0);const flat=[v0],bad=[v0];
  for(const [g,v] of ops){s+=(g>0?' + ':' − ')+P(v);flat.push(g*v);let k=g*v;if(v<0&&g<0&&(w&1))k=v;if(v<0&&g>0&&(w&2))k=-v;bad.push(k);}

function brMC(pre,g,grp,stemFn){

  const make=m=>{const fl=pre.map(tm).concat(T.map(([sg,t],j)=>[(m>>j&1?-1:1)*g*sg,t]));return {t:nb(TS(fl)),val:fval(fl)};};
  const order=g<0?[full-1,full]:[full];
  shuffle([...Array(full).keys()].map(i=>i+1)).forEach(m=>{if(!order.includes(m))order.push(m);});
  const cands=[];
  order.forEach(m=>{const w=make(m);if(numeric&&w.val===e.val)return;
    const err=g<0?(m===full?E_NONE:m===full-1&&n>1?E_FIRST:'Dấu "−" đứng trước ngoặc: mọi số hạng trong ngoặc đều phải đổi dấu, bạn đổi dấu chưa đúng.'):(m===full?E_ALL:'Dấu "+" đứng trước ngoặc: mọi số hạng trong ngoặc đều giữ nguyên dấu.');
    cands.push(C(w.t,err));});
  return mk(stemFn(e.txt),e.open,cands,`${g<0?R_MINUS:R_PLUS} ${e.txt} = ${e.open}.`);
}

  const b=ri(11,45),c=ri(11,45),a=10*ri(Math.ceil((b+c)/10)+2,20);if(b===c)return null;
  const st=RNG()<.5?`Bạn ${sel(NAMES)} có ${a} nghìn đồng, mua vở hết ${b} nghìn đồng và mua bút hết ${c} nghìn đồng. Số tiền còn lại (tính bằng nghìn đồng) được tính bằng biểu thức nào?`
    :`Một cửa hàng có ${a} kg gạo. Buổi sáng cửa hàng bán ${b} kg, buổi chiều bán ${c} kg. Số gạo còn lại (tính bằng kg) được tính bằng biểu thức nào?`;
  return mk(st,nb(`${a} − (${b} + ${c})`),[
    C(nb(`${a} − (${b} − ${c})`),`Biểu thức này bằng ${nb(`${a} − ${b} + ${c}`)}, tức là ${c} lại được cộng thêm vào thay vì trừ đi.`),
    C(nb(`${a} + (${b} + ${c})`),'Tiêu đi hoặc bán đi thì phải trừ, không cộng vào.'),
    C(nb(`(${b} + ${c}) − ${a}`),'Phải lấy số ban đầu trừ đi tổng hai lần đã dùng, không làm ngược lại.')],
    `Còn lại: ${nb(`${a} − ${b} − ${c} = ${a} − (${b} + ${c}) = ${a-b-c}`)}.`);
});}

const IT=(t,v,topic,level,exp)=>({t,v,topic,level,exp});
function pick4(Ts,Fs){
  const nT=ri(1,3);
  return shuffle(shuffle(Ts).slice(0,nT).concat(shuffle(Fs).slice(0,4-nT)));
}
function mixed(make){ // tạo 4 ý khác nhau, bảo đảm có cả ý đúng và ý sai
  for(let n=0;n<80;n++){const items=make();if(items.some(i=>!i))continue;const k=items.filter(i=>i.v).length;if(k>=1&&k<=3&&new Set(items.map(i=>i.t)).size===4)return items;}
  return null;
}
const FB_TF=()=>({stem:'Xét các phát biểu sau:',items:[
  IT(nb('8 − (5 − 3) = 8 − 5 + 3'),true,'bn','TH',R_MINUS),
  IT(nb('8 − (5 + 3) = 8 − 5 + 3'),false,'bn','TH','Bỏ ngoặc đúng là 8 − 5 − 3: phải đổi dấu cả hai số hạng.'),
  IT(nb('7 + (−2) = 7 − 2'),true,'vg','TH','Cộng với một số âm thì thành trừ.'),
  IT(nb('9 − 4 − 1 = 9 − (4 − 1)'),false,'dn','TH','Đặt vào ngoặc có dấu "−" đằng trước phải đổi dấu: 9 − 4 − 1 = 9 − (4 + 1).')]});
const four=f=>()=>{const items=mixed(()=>[f(),f(),f(),f()]);return items?{stem:'Xét các phát biểu sau:',items}:FB_TF();};

function vgItem(){
  const [v,x,y]=sample(3,2,30),ops=[[sgn(),-x],[sgn(),-y]],v0=sgn()*v,e=CH(v0,ops,0),t=RNG()<.5;
  const ws=[1,2,3].filter(w=>CH(v0,ops,w).bad!==e.open),w=sel(ws),shown=t?e.open:CH(v0,ops,w).bad;
  return IT(`${e.txt} = ${shown}`,t,'vg','TH',t?'Cộng với một số âm thì thành trừ, trừ đi một số âm thì thành cộng.':`Viết gọn đúng là ${e.open}. ${[E_W1,E_W2,E_W3][w-1]}`);
}
function vgVal(){
  const [v,x,y,z]=sample(4,2,25),ops=shuffle([[-1,-x],[1,-y],[sgn(),z]]),v0=sgn()*v,e=CH(v0,ops,0),t=RNG()<.5;
  const shown=t?e.val:CH(v0,ops,sel([1,2,3])).badVal;
  return IT(`${e.txt} = ${N(shown)}`,t,'vg','VD',`${e.txt} = ${e.open} = ${N(e.val)}${t?'.':`, không phải ${N(shown)}.`}`);
}
function bnItem(){
  const [a,b,c,d]=sample(4,2,40),three=RNG()<.4,g=RNG()<.7?-1:1,t=RNG()<.5;
  const grp=three?[b,sgn()*c,sgn()*d]:[sel([b,-b]),sgn()*c],parts=[a,G(g,grp)],e=EXP(parts);
  const ws=['first','none','all'].map(m=>EXP(parts,m)).filter(w=>w.val!==e.val);if(!ws.length)return null;
  const shown=t?e.open:sel(ws).open;
  return IT(`${e.txt} = ${shown}`,t,'bn','TH',t?(g<0?R_MINUS:R_PLUS):`Bỏ ngoặc đúng là ${e.open}. ${g<0?'Dấu "−" đứng trước ngoặc thì đổi dấu tất cả các số hạng trong ngoặc.':'Dấu "+" đứng trước ngoặc thì giữ nguyên dấu các số hạng trong ngoặc.'}`);
}
function bnVal(){
  const {parts,e}=bnTwo(),t=RNG()<.5;
  const ws=['first','none','all'].map(m=>EXP(parts,m).val).filter(w=>w!==e.val);if(!ws.length)return null;
  const shown=t?e.val:sel(ws);
  return IT(`${e.txt} = ${N(shown)}`,t,'bn','VD',`${e.txt} = ${e.open} = ${N(e.val)}${t?'.':`, không phải ${N(shown)}.`}`);
}
function dnItem(){
  const [a,b,c]=sample(3,2,60),s2=sgn(),s3=s2>0?-1:sgn(),g=s2,t=RNG()<.5;       // dấu trước ngoặc là dấu của số hạng thứ hai
  const Lh=nb(TS([a,s2*b,s3*c])),ins=[b,g*s3*c],bad=sel([[b,-g*s3*c]].concat(g<0?[]:[[-b,g*s3*c]]));
  const R=v=>nb(`${a} ${g<0?'−':'+'} (${TS(v)})`);
  return IT(`${Lh} = ${R(t?ins:bad)}`,t,'dn','TH',t?(g<0?'Đặt các số hạng vào ngoặc có dấu "−" đằng trước thì đổi dấu tất cả các số hạng đó.':'Đặt các số hạng vào ngoặc có dấu "+" đằng trước thì giữ nguyên dấu.'):`Viết đúng là ${Lh} = ${R(ins)}.`);
}
function dnItem4(){
  const {ps,ns,txt,good}=grp4(),t=RNG()<.5;
  const bad=sel([nb(`(${ps[0]} + ${ps[1]}) − (${ns[0]} − ${ns[1]})`),nb(`(${ps[0]} − ${ps[1]}) − (${ns[0]} + ${ns[1]})`),nb(`(${ps[0]} + ${ps[1]}) + (${ns[0]} + ${ns[1]})`)]);
  return IT(`${txt} = ${t?good:bad}`,t,'dn','VD',t?'Nhóm các số hạng mang dấu "+" với nhau; các số hạng mang dấu "−" đặt vào ngoặc có dấu "−" đằng trước thì đổi dấu.':`Viết đúng là ${txt} = ${good}.`);
}
function hlItem(){
  const {p,q,e,exp}=hlCancel(),t=RNG()<.5,shown=t?e.val:sel([-e.val,p-q,p+q].filter(x=>x!==e.val));
  return IT(`${e.txt} = ${N(shown)}`,t,'hl','TH',exp);
}
function hlItem2(){
  const {q,r,e,exp}=hlTwo(),t=RNG()<.5,shown=t?e.val:sel([-e.val,q+r,-(q+r)].filter(x=>x!==e.val));
  return IT(`${e.txt} = ${N(shown)}`,t,'hl','VD',exp);
}

const wrongOf=(s,list)=>{const l=list.filter(x=>x!==s);return l.length?sel(l):s+1;};
/* tình huống: một biểu thức, các bước bỏ ngoặc và tính */
function ctxExpr(){
  const [p,q]=sample(2,120,480),r=ri(11,60),v=[0,1,2,3].map(()=>RNG()<.5);
  const parts=[p,G(-1,[q,-r]),G(1,[q,-p])],e=EXP(parts),bad=EXP(parts,'first');
  const s3=v[2]?r:wrongOf(r,[-r,r+2*q,2*p-r]);
  return {stem:`Cho biểu thức ${nb('A = ')}${e.txt}.`,items:[
    IT(`Bỏ dấu ngoặc ta được ${nb('A = ')}${v[0]?e.open:bad.open}.`,v[0],'bn','TH',`${R_MINUS} ${R_PLUS} Vậy ${nb('A = ')}${e.open}.`),
    IT(v[1]?`Sau khi bỏ dấu ngoặc, trong A có hai cặp số đối nhau.`:`Sau khi bỏ dấu ngoặc, trong A chỉ có một cặp số đối nhau.`,v[1],'hl','TH',`Có hai cặp số đối nhau: ${p} và ${N(-p)}; ${q} và ${N(-q)}.`),
    IT(`Giá trị của A bằng ${N(s3)}.`,v[2],'hl','VD',`${nb(`A = (${p} − ${p}) + (${q} − ${q}) + ${r} = ${r}`)}${v[2]?'.':`, không phải ${N(s3)}.`}`),
    IT(`Giá trị của A ${v[3]?'không thay đổi':'thay đổi'} nếu ta đổi số ${p} thành một số nguyên khác (ở cả hai chỗ).`,v[3],'hl','VD',`Số ${p} xuất hiện một lần với dấu "+" và một lần với dấu "−" nên triệt tiêu nhau. Giá trị của A luôn bằng ${r}.`)]};
}

function ctxMoney(){
  const b=10*ri(5,20),c=10*ri(5,20),d=10*ri(3,25),S0=10*ri(Math.ceil((b+c)/10)+5,60),v=[0,1,2,3].map(()=>RNG()<.5);
  if(b===c||d===b+c)return ctxMoney();
  const fin=S0-b-c+d,s3=v[2]?fin:wrongOf(fin,[S0-b+c+d,S0-b-c-d]),up=d>b+c;
  return {stem:`Thẻ của chị Mai có ${S0} nghìn đồng. Chị thanh toán hai hóa đơn ${b} nghìn đồng và ${c} nghìn đồng, sau đó được hoàn lại ${d} nghìn đồng.`,items:[
    IT(`Số tiền còn lại sau khi thanh toán hai hóa đơn (nghìn đồng) là ${nb(v[0]?`${S0} − (${b} + ${c})`:`${S0} − (${b} − ${c})`)}.`,v[0],'dn','TH',`Trừ lần lượt hai hóa đơn: ${nb(`${S0} − ${b} − ${c} = ${S0} − (${b} + ${c})`)}.`),
    IT(`Số tiền cuối cùng trong thẻ (nghìn đồng) là ${nb(v[1]?`${S0} − (${b} + ${c} − ${d})`:`${S0} − (${b} + ${c} + ${d})`)}.`,v[1],'bn','VD',`Số tiền cuối cùng là ${nb(`${S0} − ${b} − ${c} + ${d} = ${S0} − (${b} + ${c} − ${d})`)}: đặt vào ngoặc có dấu "−" đằng trước thì +${d} đổi thành −${d}.`),
    IT(`Cuối cùng trong thẻ có ${fmtN(s3)} nghìn đồng.`,v[2],'hl','VD',`${nb(`${S0} − ${b} − ${c} + ${d} = ${fin}`)} (nghìn đồng)${v[2]?'.':`, không phải ${fmtN(s3)} nghìn đồng.`}`),
    IT(`Cuối cùng số tiền trong thẻ ${v[3]===up?'nhiều':'ít'} hơn lúc đầu.`,v[3],'hl','VD',up?`Số tiền hoàn lại ${d} lớn hơn tổng hai hóa đơn ${b+c} nên thẻ nhiều hơn lúc đầu ${d-b-c} nghìn đồng.`:`Tổng hai hóa đơn ${b+c} lớn hơn số tiền hoàn lại ${d} nên thẻ ít hơn lúc đầu ${b+c-d} nghìn đồng.`)]};
}

function saVg3(){const [v,x,y,z]=sample(4,2,30),e=CH(sgn()*v,shuffle([[-1,-x],[1,-y],[sgn(),z]]),0);return{stem:`Tính ${e.txt}.`,ans:[e.val],exp:`${e.txt} = ${e.open} = ${N(e.val)}.`};}
function saVg5(){const o=vg5();return{stem:`Tính ${o.e.txt}.`,ans:[o.e.val],exp:o.exp};}
function saBn0(){const [a,b,c]=sample(3,2,40),e=EXP(RNG()<.5?[a,G(-1,[b,c])]:[a,G(1,[b,-c])]);return{stem:`Bỏ dấu ngoặc rồi tính: ${e.txt}.`,ans:[e.val],exp:`${e.txt} = ${e.open} = ${N(e.val)}.`};}
function saBn1(){const [a,b,c,d]=sample(4,2,40),e=EXP([sgn()*a,G(-1,RNG()<.5?[b,-c,sgn()*d]:[-b,sgn()*c])]);return{stem:`Tính ${e.txt}.`,ans:[e.val],exp:`${R_MINUS} ${e.txt} = ${e.open} = ${N(e.val)}.`};}
function saBn2(){const {e}=bnTwo();return{stem:`Bỏ dấu ngoặc rồi tính: ${e.txt}.`,ans:[e.val],exp:`${e.txt} = ${e.open} = ${N(e.val)}.`};}
function saDnFill(){const [a,b,c]=sample(3,2,60),f=ri(0,1);return f===0
  ?{stem:`Tìm số thích hợp thay cho dấu ? trong đẳng thức ${nb(`${a} − ${b} − ${c} = ${a} − (${b} + ?)`)}.`,ans:[c],exp:`Đặt −${b} và −${c} vào ngoặc có dấu "−" đằng trước thì đổi dấu cả hai: ${nb(`${a} − ${b} − ${c} = ${a} − (${b} + ${c})`)}. Số cần tìm là ${c}.`}
  :{stem:`Tìm số thích hợp thay cho dấu ? trong đẳng thức ${nb(`${a} − ${b} + ${c} = ${a} − (${b} − ?)`)}.`,ans:[c],exp:`Đặt −${b} và +${c} vào ngoặc có dấu "−" đằng trước thì đổi dấu cả hai: ${nb(`${a} − ${b} + ${c} = ${a} − (${b} − ${c})`)}. Số cần tìm là ${c}.`};}
function saDn3(){const R=100*ri(1,2),b=ri(11,R-11),c=R-b,a=ri(R+20,R+400);return{stem:`Tính một cách hợp lí: ${nb(`${a} − ${b} − ${c}`)}.`,ans:[a-R],exp:`${nb(`${a} − ${b} − ${c} = ${a} − (${b} + ${c}) = ${a} − ${R} = ${a-R}`)}.`};}
function saDn4(){let a,c,b,d,R1,R2;do{R1=100*ri(1,3);R2=100*ri(1,3);a=ri(11,R1-11);c=R1-a;b=ri(11,R2-11);d=R2-b;}while(new Set([a,b,c,d]).size<4||a%10===0||b%10===0);
  const t=sel([[a,-b,c,-d],[a,-b,-d,c],[-b,a,-d,c]]);
  return{stem:`Tính một cách hợp lí: ${nb(TS(t))}.`,ans:[R1-R2],exp:`${nb(`${TS(t)} = (${a} + ${c}) − (${b} + ${d}) = ${R1} − ${R2} = ${N(R1-R2)}`)}.`};}
function saHl0(){const {e,exp}=hlCancel();return{stem:`Tính một cách hợp lí: ${e.txt}.`,ans:[e.val],exp};}
function saHl2(){const {e,exp}=hlTwo();return{stem:`Tính một cách hợp lí: ${e.txt}.`,ans:[e.val],exp};}
function saHlSub(){const {k,e,val,exp}=hlSub();return{stem:`Tính giá trị của biểu thức ${e.txt} khi ${nb('x = '+k)}.`,ans:[val],exp};}
function saHlReal(){const R=100*ri(1,2),b=ri(21,R-21),c=R-b,d=10*ri(3,15),S0=R+10*ri(5,40)+ri(1,9);return{stem:`Một kho có ${S0} kg gạo. Buổi sáng kho xuất ${b} kg, buổi chiều xuất tiếp ${c} kg, sau đó nhập về ${d} kg. Hỏi cuối ngày kho có bao nhiêu kg gạo?`,ans:[S0-R+d],exp:`${nb(`${S0} − ${b} − ${c} + ${d} = ${S0} − (${b} + ${c}) + ${d} = ${S0} − ${R} + ${d} = ${S0-R+d}`)} (kg).`};}

  const a=ri(11,90),b=ri(21,150),c=ri(200,400),d=ri(21,190),o1=sgn(),o2=sgn(),t1=-o1*b,k=o2*d,val=a+t1-c+k;
  const txt=nb(`${a} ${o1>0?'+':'−'} (−${b}) − [${c} ${o2>0?'+':'−'} (−${d})]`),opn=nb(`${a} ${o1>0?'−':'+'} ${b} − [${c} ${o2>0?'−':'+'} ${d}]`);
  return {txt,opn,val,mid:c-k,left:a+t1,wr:[
    {v:a-t1-c+k,err:o1>0?E_W2:E_W1},{v:a+t1-c-k,err:o2>0?E_W2:E_W1},{v:a+t1+c-k,err:E_BR}],
    exp:`${txt} = ${opn} = ${N(a+t1)} − ${c-k} = ${N(val)}.`};
}
function genBnBr(){return tryGen(()=>{const o=brOne();return mk(`Tính ${o.txt}.`,N(o.val),o.wr.map(w=>C(N(w.v),w.err)),o.exp);});}
function genBnOne(){return tryGen(()=>{
  const [v,x,y]=sample(3,2,40),ops=shuffle([[-1,-x],[1,-y]]),v0=sgn()*v,e=CH(v0,ops,0);
  return mk(`Viết ${e.txt} dưới dạng không có dấu ngoặc, ta được:`,e.open,[C(CH(v0,ops,1).bad,E_W1),C(CH(v0,ops,2).bad,E_W2),C(CH(v0,ops,3).bad,E_W3)],
    `Cộng với một số âm thì thành trừ, trừ đi một số âm thì thành cộng: ${e.txt} = ${e.open}.`);
});}
function xData(){const a=ri(100,500),b=ri(20,99),x=RNG()<.5?ri(10,90):-ri(100,400),val=-a-b-x;
  return {a,b,x,val,txt:nb(`(−${a}) − (${b} + x)`),wr:[{v:-a-b+x,err:'Bỏ ngoặc có dấu "−" đằng trước: −(b + x) = −b − x. Bạn đã giữ nguyên dấu của x.'},{v:-a+b-x,err:'Phải đổi dấu cả hai số hạng trong ngoặc, kể cả số '+b+'.'},{v:a-b-x,err:`Số hạng đầu ${N(-a)} giữ nguyên dấu, không đổi.`}],
    exp:`Bỏ ngoặc: ${nb(`(−${a}) − (${b} + x) = −${a} − ${b} − x`)}. Thay ${nb('x = '+N(x))}: ${nb(`−${a} − ${b} − ${P(x)} = ${N(val)}`)}.`};}
function genBnX(){return tryGen(()=>{const o=xData();return mk(`Tính giá trị của biểu thức ${o.txt} khi ${nb('x = '+N(o.x))}.`,N(o.val),o.wr.map(w=>C(N(w.v),w.err)),o.exp);});}
function nestData(){const a=ri(50,200),b=ri(30,120),c=ri(100,300),d=ri(10,90),e=ri(10,100),val=a-b+c-d+e;
  const f=(s2,s3,s4)=>nb(`${a} ${s2<0?'−':'+'} ${b} ${s3<0?'−':'+'} ${c} ${s4<0?'−':'+'} ${d} + ${e}`);
  return {a,b,c,d,e,val,txt:nb(`${a} − [${b} − (${c} − ${d})] + ${e}`),wr:[
    {v:a-b-c+d+e,err:'Dấu "−" đứng trước ngoặc vuông: −[b − (c − d)] = −b + (c − d). Bạn chưa đổi dấu số hạng (c − d).'},
    {v:a-b+c+d+e,err:'Bỏ ngoặc tròn (c − d) có dấu "+" đằng trước thì giữ nguyên dấu c và −d, không đổi dấu d.'},
    {v:a+b-c+d+e,err:'Bạn đã đổi dấu sai: số hạng b mang dấu "−" sau khi bỏ ngoặc vuông.'}],
    exp:`Bỏ ngoặc từ trong ra ngoài: ${nb(`−[${b} − (${c} − ${d})] = −${b} + (${c} − ${d}) = −${b} + ${c} − ${d}`)}. Vậy ${nb(`A = ${a} − ${b} + ${c} − ${d} + ${e} = ${val}`)}.`};}
function genBnNest(){return tryGen(()=>{const o=nestData();return mk(`Tính ${o.txt}.`,N(o.val),o.wr.map(w=>C(N(w.v),w.err)),o.exp);});}

/* --- Tính hợp lí (Ví dụ 2, 3.29) --- */
function sameData(){const k1=ri(1,5),k2=RNG()<.25?k1:ri(1,5),u=ri(11,99),v=(()=>{let w;do{w=ri(11,99);}while(w===u);return w;})(),c=u,a=100*k1+u,d=v,b=100*k2+v;
  return {a,b,c,d,val:100*(k1-k2),txt:nb(`${a} − ${b} − ${c} + ${d}`),g:nb(`(${a} − ${c}) − (${b} − ${d})`),
    bads:[nb(`(${a} − ${c}) − (${b} + ${d})`),nb(`(${a} − ${c}) + (${b} − ${d})`),nb(`(${a} + ${c}) − (${b} + ${d})`)],
    wv:[100*k1-(b+d),100*(k1+k2),a+c-b-d],exp:`${nb(`${a} − ${b} − ${c} + ${d}`)} = ${nb(`(${a} − ${c}) − (${b} − ${d})`)} = ${100*k1} − ${100*k2} = ${N(100*(k1-k2))}.`};}
function genHlGrp(){return tryGen(()=>{const o=sameData();
  return mk(`Để tính nhanh ${o.txt}, cách nhóm nào đúng?`,o.g,[C(o.bads[0],'Đặt −'+o.b+' và +'+o.d+' vào ngoặc có dấu "−" đằng trước thì phải đổi dấu cả hai: −('+o.b+' − '+o.d+').'),C(o.bads[1],`Số hạng −${o.b} mang dấu "−", nếu đặt vào ngoặc có dấu "+" thì vẫn là −${o.b}.`),C(o.bads[2],`Số hạng −${o.c} mang dấu "−", không thể cộng ${o.c} vào nhóm đầu.`)],o.exp);
});}
function genHlSame(){return tryGen(()=>{const o=sameData();
  return mk(`Tính nhanh ${o.txt}.`,N(o.val),o.wv.map(v=>C(N(v),'Bạn nhóm sai dấu. Cần nhóm các cặp có hiệu tròn trăm: −'+o.b+' + '+o.d+' = −('+o.b+' − '+o.d+').')),o.exp);
});}
function closeData(){const u=ri(1,5),t=ri(5,15),p=ri(1000,3000),q=ri(100,400);if(u===t)return closeData();
  const r=p-u,s=q-t;return {p,q,r,s,u,t,val:u+t,txt:nb(`${p} + ${q} − ${r} − ${s}`),wv:[u-t,u+q+s,t-u],
    exp:`${nb(`${p} + ${q} − ${r} − ${s} = (${p} − ${r}) + (${q} − ${s}) = ${u} + ${t} = ${u+t}`)}.`};}
function genHlClose(){return tryGen(()=>{const o=closeData();
  return mk(`Tính một cách hợp lí: ${o.txt}.`,N(o.val),[C(N(o.wv[0]),'Số hạng '+o.q+' mang dấu "+" nên không đổi dấu khi nhóm với '+o.p+'.'),C(N(o.wv[1]),`Đặt −${o.r} và −${o.s} vào ngoặc có dấu "−" thì phải đổi dấu cả hai số hạng.`),C(N(o.wv[2]),`${o.p} − ${o.r} = ${o.u} (không phải ${-o.u}).`)],o.exp);
});}
function triData(){const k=sel([10,20,30,100]),y=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,3).sort((x,z)=>x-z),x=y.map(v=>v+k);
  return {k,y,x,val:3*k,txt:nb(`(${x.join(' + ')}) − (${y.join(' + ')})`),exp:`${nb(`(${x.join(' + ')}) − (${y.join(' + ')}) = ${x.join(' + ')} − ${y.join(' − ')} = ${x.map((v,i)=>`(${v} − ${y[i]})`).join(' + ')} = ${[k,k,k].join(' + ')} = ${3*k}`)}.`};}
const HC=[
  (p,q,r)=>[[G(1,[p,-q]),G(-1,[p,r]),q],'p'],       // (p−q) − (p+r) + q = −r
  (p,q,r)=>[[p,G(-1,[q,-r]),G(1,[q,-p])]],         // p − (q−r) + (q−p) = r
  (p,q,r)=>[[G(1,[-p,q]),G(-1,[q,-r]),p]],         // (−p+q) − (q−r) + p = r
  (p,q,r)=>[[G(-1,[p,-q]),G(1,[p,r]),-q]]];        // −(p−q) + (p+r) − q = r
function canData(){const [p,q]=sample(2,100,480),r=ri(11,60),i=ri(0,3),parts=HC[i](p,q,r)[0],e=EXP(parts);
  return {e,r,wv:['first','none','all'].map(m=>EXP(parts,m).val),exp:`Bỏ ngoặc: ${e.txt} = ${e.open}. Các số đối nhau triệt tiêu, còn lại ${N(e.val)}.`};}
function genHlCan(){return tryGen(()=>{const o=canData();
  return mk(`Tính một cách hợp lí: ${o.e.txt}.`,N(o.e.val),o.wv.concat([-o.e.val]).map(v=>C(N(v),'Bạn bỏ ngoặc sai dấu hoặc nhóm sai các số đối nhau.')),o.exp);
});}

/* --- Vận dụng thực tế (3.24, 3.30) --- */
function tempData(){for(;;){
  const T0=ri(-8,4),ops=[0,0,0].map(()=>sgn()*ri(2,12));if(ops.every(o=>o>0)||ops.every(o=>o<0))continue;
  const fin=T0+sum(ops);if(fin===T0)continue;const hs=[9,15,21],st=ops.map((o,i)=>`lúc ${hs[i]} giờ ${o>0?'tăng':'giảm'} ${Math.abs(o)} °C`);
  const ex=ops.map(o=>o>0?'+ '+o:'− '+(-o)).join(' ');
  return {T0,ops,fin,hs,stem:`Lúc 5 giờ sáng, nhiệt độ ở Sa Pa là ${N(T0)} °C. So với lần đo trước, ${st.join(', ')}. Nhiệt độ lúc 21 giờ là bao nhiêu °C?`,ex,exp:`${nb(`${N(T0)} ${ex} = ${N(fin)}`)} (°C).`};}}
function genVdTemp(){return tryGen(()=>{const o=tempData();
  return mk(o.stem,N(o.fin),o.ops.map((op,i)=>C(N(o.fin-2*op),`Lúc ${o.hs[i]} giờ nhiệt độ ${op>0?'tăng nên phải cộng':'giảm nên phải trừ'} ${Math.abs(op)}, bạn đã ${op>0?'trừ':'cộng'}.`)),o.exp);
});}
function liftData(){for(;;){const a=ri(5,20),b=ri(3,15),F=-ri(5,30),x=F+a-b;if(a===b||x>-1||x<-60)continue;
  return {a,b,F,x,stem:`Một thợ lặn lặn xuống thêm ${a} m, rồi nổi lên ${b} m thì đang ở độ cao ${N(F)} m so với mực nước biển. Hỏi lúc đầu thợ lặn ở độ cao nào (tính bằng mét)?`,
    exp:`Gọi x là độ cao lúc đầu. Lặn xuống ${a} m là trừ ${a}, nổi lên ${b} m là cộng ${b}: ${nb(`x − ${a} + ${b} = ${N(F)}`)}. Suy ra ${nb(`x = ${N(F)} + ${a} − ${b} = ${N(x)}`)} (m).`};}}
function genVdLift(){return tryGen(()=>{const o=liftData();
  return mk(o.stem,N(o.x),[C(N(o.F-o.a+o.b),'Bạn tính xuôi từ độ cao cuối, nhưng cần đi ngược lại các bước.'),C(N(o.F+o.a+o.b),`Nổi lên ${o.b} m thì lúc đầu phải thấp hơn ${o.b} m, nên phải trừ ${o.b}.`),C(N(o.F-o.a-o.b),`Lặn xuống ${o.a} m thì lúc đầu phải cao hơn ${o.a} m, nên phải cộng ${o.a}.`)],o.exp);
});}
function boxData(){for(let n=0;n<2000;n++){
  const m=ri(3,12),d=ri(1,6),R=()=>ri(-9,9),tri=s=>{const a=R(),b=R(),c=s-a-b;return Math.abs(c)<=9?[a,b,c]:null;};
  const b1=tri(m-d),b2=tri(m),x=R(),y=m-x;
  if(!b1||!b2||Math.abs(y)>9||x===y||x===d||y===d||b1.includes(-d))continue;
  return {m,d,x,y,b1:shuffle(b1),b2:shuffle(b2),b3:shuffle([d,x,y]),s1:m-d,s3:m+d};}
  return {m:4,d:2,x:-5,y:9,b1:[6,-1,-3],b2:[5,-4,3],b3:[-5,9,2],s1:2,s3:6};}
const boxTxt=o=>`Hộp 1: ${o.b1.map(N).join('; ')}. Hộp 2: ${o.b2.map(N).join('; ')}. Hộp 3: ${o.b3.map(N).join('; ')}.`;
const boxExp=o=>`Tổng ba hộp là ${SUMX([o.s1,o.m,o.s3])} = ${3*o.m}, nên mỗi hộp phải có tổng ${N(o.m)}. Hộp 1 cần tăng ${o.d}, Hộp 3 cần giảm ${o.d}, nên chuyển miếng bìa ghi số ${o.d} từ Hộp 3 sang Hộp 1.`;
function genVdBox(){return tryGen(()=>{const o=boxData();
  return mk(`Có ba hộp, mỗi hộp đựng ba miếng bìa ghi số. ${boxTxt(o)} Chuyển đúng một miếng bìa từ Hộp 3 sang Hộp 1 để tổng các số ghi trên các miếng bìa ở mỗi hộp bằng nhau. Miếng bìa cần chuyển ghi số nào?`,N(o.d),[
    C(N(o.x),`Chuyển số ${N(o.x)} thì Hộp 1 có tổng ${N(o.s1+o.x)}, Hộp 3 có tổng ${N(o.s3-o.x)}, chưa bằng ${N(o.m)}.`),
    C(N(o.y),`Chuyển số ${N(o.y)} thì Hộp 1 có tổng ${N(o.s1+o.y)}, Hộp 3 có tổng ${N(o.s3-o.y)}, chưa bằng ${N(o.m)}.`),
    C(N(o.s3),'Đây là tổng các số trong Hộp 3, không phải số ghi trên một miếng bìa.')],boxExp(o));
});}

function qtMulItem(){const a=ri(3,30),b=ri(3,30),x=sgn()*a,y=sgn()*b,p=x*y,t=RNG()<.5,shown=t?p:sel([-p,x+y,p+sgn()*a].filter(v=>v!==p));
  return IT(`${PRD([x,y])} = ${N(shown)}`,t,'qt','TH',`${p<0?'Hai số khác dấu nên tích âm':'Hai số cùng dấu nên tích dương'}: ${nb(`${a} · ${b} = ${a*b}`)}. Vậy ${PRD([x,y])} = ${N(p)}${t?'.':`, không phải ${N(shown)}.`}`);}
function qtSignItem(){const o=signQ(ri(3,5),false),p=prod(o.f),t=RNG()<.5,claim=(p<0)===t?'âm':'dương';
  return IT(`Tích ${PRD(o.f)} là một số nguyên ${claim}.`,t,'qt','TH',`Có ${o.k} thừa số âm, ${o.k%2?'số lẻ nên tích là số nguyên âm':'số chẵn nên tích là số nguyên dương'}${t?'.':`, không phải số nguyên ${claim}.`}`);}
function qtFromItem(){const [n,m]=sel([[3,12],[4,9],[6,6],[2,18],[4,12],[5,10]]),P0=n*m,k=sel(['n · (−m)','(−n) · m','(−n) · (−m)']),v=k==='(−n) · (−m)'?P0:-P0,t=RNG()<.5,shown=t?v:-v;
  return IT(`Nếu ${nb('n · m = '+P0)} thì ${nb(k+' = '+N(shown))}.`,t,'qt','TH',`${k==='(−n) · (−m)'?'(−n) · (−m) = n · m':k+' = −(n · m)'} = ${N(v)}${t?'.':`, không phải ${N(shown)}.`}`);}

function tcItem(){const [a,b,c]=[nz(2,9),nz(10,60),nz(2,9)],t=RNG()<.5,k=ri(0,2);
  if(k===0){const e=`${P(a)} · (${N(b)} + ${P(c)}) = ${P(a)} · ${P(b)} + `,r=t?`${P(a)} · ${P(c)}`:P(c);return IT(nb(e+r),t,'tc','TH',`Tính chất phân phối: a · (b + c) = a · b + a · c${t?'.':`. Vế phải phải là ${nb(`${P(a)} · ${P(b)} + ${P(a)} · ${P(c)}`)}.`}`);}
  if(k===1){const e=`${P(a)} · (${N(b)} − ${P(c)}) = ${P(a)} · ${P(b)} `,r=t?`− ${P(a)} · ${P(c)}`:`+ ${P(a)} · ${P(c)}`;return IT(nb(e+r),t,'tc','TH',`Tính chất phân phối đối với phép trừ: a · (b − c) = a · b − a · c${t?'.':'. Phải giữ dấu "−" trước a · c.'}`);}
  const l=`(${P(a)} · ${P(b)}) · ${P(c)} = ${P(a)} · `,r=t?`(${P(b)} · ${P(c)})`:`(${P(b)} + ${P(c)})`;
  if(!t&&a*b*c===a*(b+c))return null;
  return IT(nb(l+r),t,'tc','TH',`Tính chất kết hợp: (a · b) · c = a · (b · c)${t?'.':'. Không thể thay phép nhân bằng phép cộng.'}`);}
function tcValItem(){const k=ri(0,3),t=RNG()<.5;let e,v,x;
  if(k===0){x=combData();e=PRD(x.f);v=x.p;}
  else if(k===1){x=facData();e=x.txt;v=x.val;}
  else if(k===2){x=sameData();e=x.txt;v=x.val;}
  else{x=hardData();e=x.txt;v=x.val;}
  const shown=t?v:(k===0?-v:x.wv[ri(0,x.wv.length-1)]);if(!t&&shown===v)return null;
  return IT(`${e} = ${NN(shown)}`,t,'tc','VD',`${x.exp.replace(/\.$/,'')}${t?'.':`, không phải ${NN(shown)}.`}`);}
const RW={'>':'lớn hơn','<':'nhỏ hơn','=':'bằng'};
function btCmpItem(){const o=cmpData(),t=RNG()<.5,rel=t?o.rel:sel(['>','<','='].filter(r=>r!==o.rel));
  return IT(`${o.l} ${RW[rel]} ${o.r}.`,t,'bt','TH',`${o.why}${t?'':` Vậy ${o.l} ${RW[o.rel]} ${o.r}.`}`);}
function btEvalItem(){const o=evalData(),t=RNG()<.5,shown=t?o.val:sel(o.wv.filter(v=>v!==o.val));
  return IT(`Khi ${nb('x = '+N(o.x))} và ${nb('y = '+N(o.y))}, biểu thức ${nb('A = '+o.expr)} có giá trị ${N(shown)}.`,t,'bt','VD',`${o.exp.replace(/\.$/,'')}${t?'.':`, không phải ${N(shown)}.`}`);}

function pick(pool,used){
  const x=ordered(pool.filter(x=>!used.has(x.id)))[0];used.add(x.id);return x;
}
function makeSession(mode,spec,title,by){
  const list=[];
  // không để hai câu giống hệt nhau trong cùng một phiên: câu tự sinh bị trùng thì sinh lại
  // và cố tránh hai câu cùng một khuôn đề chỉ khác số (nếu bộ sinh có khuôn đề khác)
  {const sig=q=>JSON.stringify([q.stem,q.fig||'',(q.opts||[]).map(o=>JSON.stringify(o)).sort(),(q.items||[]).map(i=>i.t)]);
   const near=q=>q.type+'|'+String(q.stem).replace(/<[^>]+>/g,'').replace(/[0-9]+/g,'#');
   const sg=new Set(),ng=new Set();
   TYPES.forEach(t=>by[t]=by[t].map(q=>{
     let x=inst(q);
     if(q.gen){
       for(let k=0;k<12&&(sg.has(sig(x))||ng.has(near(x)));k++){const y=inst(q);if(!sg.has(sig(y))||sg.has(sig(x)))x=y;}
       for(let k=0;k<20&&sg.has(sig(x));k++)x=inst(q);
     }
     sg.add(sig(x));ng.add(near(x));return x;}));}
  TYPES.forEach(t=>by[t].forEach(q=>list.push(q)));
  const idx={};TYPES.forEach(t=>by[t].forEach((q,i)=>idx[q.id]=i));
  state.ans={};state.pr={};state.result=null;state.perm={};
  state.t0=Date.now();state.elapsed=0;state.timedOut=false;if(!SEEDED)markSeen(list);
  {const keep=RNG;RNG=Math.random;by.mc.forEach(q=>{state.perm[q.id]=shuffle(q.opts.map((_,i)=>i));});RNG=keep;}
  S={mode,spec,title,by,list,idx};
}
function buildTest(){
  const used=new Set();
  const mcSlots=[['sn',['NB','TH']],['cc',['NB','TH']],['nc',['NB','TH']],['cc',['TH','VD']],['nc',['TH','VD']],['vd',['TH','VD']]];
  const mc=mcSlots.map(([t,l])=>pick(MC.filter(q=>(!t||q.topic===t)&&l.includes(q.level)),used));
  const tf=['sn','cc','nc'].map(t=>pick(TF.filter(q=>q.topic===t&&q.level!=='NB'),used));
  const sa=TKEYS.map(t=>pick(SA.filter(q=>q.topic===t&&q.level!=='NB'),used));
  makeSession('test',null,'Bài kiểm tra',{mc,tf,sa});
}
function buildQuick(){
  const used=new Set();
  const mc=['sn','cc','nc','vd'].map(t=>pick(MC.filter(q=>q.topic===t&&q.level!=='VD'),used));
  const sa=[pick(SA.filter(q=>q.topic==='cc'&&q.level!=='VD'),used),pick(SA.filter(q=>q.topic==='nc'&&q.level!=='VD'),used)];
  makeSession('quick',null,'Kiểm tra nhanh',{mc,tf:[],sa});
}
function buildHard(){
  const vd=q=>q.level==='VD';
  const mc=ordered(MC.filter(vd)).slice(0,6);
  const tf=ordered(HARD.tf).slice(0,1).concat(ordered(TF.filter(vd)).slice(0,2));
  const sa=ordered(HARD.sa).slice(0,4);
  makeSession('hard',null,'Thử thách',{mc,tf,sa});
}
function buildPisa(){
  const units=shuffle(PISA).slice(0,2).map(f=>f());
  const by={mc:[],tf:[],sa:[]};
  units.forEach((u,ui)=>u.qs.forEach((q,k)=>{q.id='p'+ui+'_'+k;q.no=k;q.lb=`Tình huống ${ui+1}, câu ${k+1}`;by[q.type].push(q);}));
  makeSession('practice',{kind:'pisa'},'Gói Toán thực tế',by);
  S.units=units;
}
function buildPractice(spec){
  let f,title;
  if(spec.kind==='level'){f=q=>q.level===spec.val;title='Gói '+LEVELS[spec.val];}
  else if(spec.kind==='topic'){f=q=>q.topic===spec.val;title='Gói '+TOPICS[spec.val].short;}
  else{f=q=>spec.topics.includes(q.topic);title='Gói ôn điểm yếu';}
  const nSA=spec.kind==='topic'?4:3;
  // ưu tiên các dạng câu khác nhau trong một gói; thiếu thì mới lấy thêm câu cùng dạng
  const take=(arr,n)=>{const o=ordered(arr.filter(f)),out=[],g=new Set();o.forEach(q=>{if(out.length<n&&!(q.gen&&g.has(q.gen))){out.push(q);if(q.gen)g.add(q.gen);}});o.forEach(q=>{if(out.length<n&&!out.includes(q))out.push(q);});return out;};
  makeSession('practice',spec,title,{mc:take(MC,6),tf:take(TF,2),sa:take(SA,nSA)});
}

const PART_NAME={mc:'Phần I',tf:'Phần II',sa:'Phần III'},PART_QUICK={mc:'Phần I',sa:'Phần II'};
const partName=t=>S.mode==='quick'?PART_QUICK[t]:PART_NAME[t];
const TYPE_NAME={mc:'Nhiều lựa chọn',tf:'Đúng sai',sa:'Trả lời ngắn'};
function lbl(t,i,j){
  const q0=S.by[t][i];if(q0&&q0.lb)return j==null?q0.lb:`${q0.lb}, ý ${'abcd'[j]}`;
  const base=S.mode!=='practice'?`${partName(t)}, câu ${i+1}`:`${TYPE_NAME[t]}, câu ${i+1}`;
  return j==null?base:`${base}, ý ${'abcd'[j]}`;
}
function badge(P){
  if(P.first&&P.first.every(Boolean))return '<span class="st good">Đúng ngay lần đầu</span>';
  if(P.final)return '<span class="st warn">Đúng ở lần thứ hai</span>';
  return '<span class="st bad">Chưa đúng</span>';
}
function tail(q,P){
  let h=`<div class="feedbox">${P.msg?`<div class="feed ${P.cls}" role="status">${P.msg}</div>`:''}</div>`;
  if(P.done){
    if(q.type==='mc')h+=`<p class="ans-line">Đáp án đúng: <b>${q.opts[q.ans].t}</b></p><div class="exp">${q.exp}</div>`;
    else if(q.type==='sa')h+=`<p class="ans-line">Đáp án đúng: <b>${N(q.ans[0])} ${q.unit}</b></p><div class="exp">${q.exp}</div>`;
  }else h+=`<div class="row" style="margin-top:12px"><button class="btn sm chk" data-q="${q.id}">Kiểm tra</button></div>`;
  return h;
}
function mcHTML(q,i){
  if(q.no!=null)i=q.no;
  const pr=S.mode==='practice',P=pr?(state.pr[q.id]||{}):{},done=!!P.done,tried=P.tried||[],cur=state.ans[q.id];
  const opts=state.perm[q.id].map((oi,j)=>{
    let cls='opt',dis='';
    if(pr){
      if(done){dis='disabled';if(oi===q.ans)cls+=' is-right';else if(cur===oi)cls+=' is-wrong';}
      else if(tried.includes(oi)){dis='disabled';cls+=' is-wrong';}
    }
    return `<label class="${cls}"><input type="radio" name="${q.id}" value="${oi}" ${cur===oi?'checked':''} ${dis}><span class="ol">${'ABCD'[j]}</span><span>${q.opts[oi].t}</span></label>`;
  }).join('');
  return `<article class="card q" id="q-${q.id}"><div class="qh"><span class="qn">Câu ${i+1}</span>${pr&&done?badge(P):''}</div>
    <p class="stem">${q.stem}</p>${q.fig||''}
    <div class="opts" role="radiogroup" aria-label="Câu ${i+1}">${opts}</div>${pr?tail(q,P):''}</article>`;
}
function tfHTML(q,i){
  if(q.no!=null)i=q.no;
  const pr=S.mode==='practice',P=pr?(state.pr[q.id]||{}):{},done=!!P.done,a=state.ans[q.id]||[];
  const rows=q.items.map((it,j)=>{
    const cls=v=>{let c='opt';if(done){if(it.v===v)c+=' is-right';else if(a[j]===v)c+=' is-wrong';}return c;};
    const dis=done?'disabled':'';
    return `<div class="tfr"><div class="tx">${q.items.length>1?`<b>${'abcd'[j]})</b>`:''}${it.t}</div>
      <div class="tfb" role="radiogroup" aria-label="Câu ${i+1}, ý ${'abcd'[j]}">
        <label class="${cls(true)}"><input type="radio" name="${q.id}-${j}" value="1" ${a[j]===true?'checked':''} ${dis}><span>Đúng</span></label>
        <label class="${cls(false)}"><input type="radio" name="${q.id}-${j}" value="0" ${a[j]===false?'checked':''} ${dis}><span>Sai</span></label>
      </div>${done?`<div class="exp"><b>Đáp án: ${it.v?'Đúng':'Sai'}.</b> ${it.exp}</div>`:''}</div>`;
  }).join('');
  return `<article class="card q" id="q-${q.id}"><div class="qh"><span class="qn">Câu ${i+1}</span>${pr&&done?badge(P):''}</div>
    <p class="stem">${q.stem}</p>${q.fig||''}<div class="tf">${rows}</div>${pr?tail(q,P):''}</article>`;
}
function saHTML(q,i){
  if(q.no!=null)i=q.no;
  const pr=S.mode==='practice',P=pr?(state.pr[q.id]||{}):{},done=!!P.done;

    <span class="muted">${q.unit}</span></div>${pr?tail(q,P):''}</article>`;
}

  const test=S.mode!=='practice',quick=S.mode==='quick';
  const desc={
    mc:test?(quick?'Mỗi câu chỉ có một đáp án đúng. 1,25 điểm mỗi câu.':'Mỗi câu chỉ có một đáp án đúng. 0,5 điểm mỗi câu.'):'Chọn một đáp án rồi bấm Kiểm tra.',
    tf:test?'Mỗi câu có 4 ý, chọn Đúng hoặc Sai cho từng ý. Đúng 1 ý được 0,1 điểm, 2 ý được 0,25, 3 ý được 0,5, cả 4 ý được 1 điểm.':'Chọn Đúng hoặc Sai cho cả 4 ý rồi bấm Kiểm tra.',
    sa:test?(quick?'Nhập kết quả là một số. Có thể dùng dấu phẩy hoặc dấu chấm. 2,5 điểm mỗi câu.':'Nhập kết quả là một số. Có thể dùng dấu phẩy hoặc dấu chấm. 1 điểm mỗi câu.'):'Nhập kết quả là một số rồi bấm Kiểm tra.'
  };

/* ============ Chấm điểm ============ */
function parseNum(s){
  s=String(s).trim().replace(/[−–—]/g,'-');
  if(/^\d{1,3}([.\s]\d{3})+$/.test(s))s=s.replace(/[.\s]/g,'');
  s=s.replace(/,/g,'.').replace(/[^0-9.\-\/]/g,'');
  if(!s)return NaN;
  if(s.includes('/')){const [a,b]=s.split('/');return parseFloat(a)/parseFloat(b);}
  return parseFloat(s);
}
function evalQ(q,a){
  if(q.type==='mc')return [a===q.ans];
  if(q.type==='tf'){a=a||[];return q.items.map((it,j)=>a[j]===it.v);}
  const v=parseNum(a==null?'':a);
  return [!isNaN(v)&&q.ans.some(x=>Math.abs(x-v)<1e-6)];
}
function grade(){
  const test=S.mode!=='practice',quick=S.mode==='quick';
  const items=[],sc={mc:0,tf:0,sa:0},errs=[],qres=[];
  const ansOf=q=>test?state.ans[q.id]:(state.pr[q.id]&&state.pr[q.id].firstAns);
  const oksOf=q=>{
    if(test)return evalQ(q,ansOf(q));
    const P=state.pr[q.id];return P&&P.first?P.first:Array(q.type==='tf'?q.items.length:1).fill(false);
  };
  S.by.mc.forEach((q,i)=>{
    const a=ansOf(q),ok=oksOf(q)[0];
    if(ok)sc.mc+=quick?1.25:0.5;else if(a!=null&&q.opts[a]&&q.opts[a].err)errs.push({where:lbl('mc',i),topic:q.topic,text:q.opts[a].err});
    items.push({topic:q.topic,level:q.level,ok,label:lbl('mc',i)});
    qres.push({kind:'mc',q,i,a,ok,pts:ok?(quick?1.25:0.5):0,max:quick?1.25:0.5});
  });
  S.by.tf.forEach((q,i)=>{
    const a=ansOf(q)||[],oks=oksOf(q);let k=0;
    q.items.forEach((it,j)=>{
      const ok=oks[j];if(ok)k++;
      items.push({topic:it.topic,level:it.level,ok,label:lbl('tf',i,q.items.length>1?j:null)});
      if(!ok&&typeof a[j]==='boolean')errs.push({where:lbl('tf',i,q.items.length>1?j:null),topic:it.topic,text:it.exp});
    });
    const pts=quick?(k?1.25:0):TF_SCORE[k];sc.tf+=pts;
    qres.push({kind:'tf',q,i,a,oks,k,pts,max:quick?1.25:1});
  });
  S.by.sa.forEach((q,i)=>{
    const raw=ansOf(q)||'',ok=oksOf(q)[0];
    if(ok)sc.sa+=quick?2.5:1;
    items.push({topic:q.topic,level:q.level,ok,label:lbl('sa',i)});
    qres.push({kind:'sa',q,i,raw,ok,pts:ok?(quick?2.5:1):0,max:quick?2.5:1});
  });
  const topics={};TKEYS.forEach(k=>topics[k]={c:0,n:0});
  const levels={NB:{c:0,n:0},TH:{c:0,n:0},VD:{c:0,n:0}};
  items.forEach(it=>{topics[it.topic].n++;levels[it.level].n++;if(it.ok){topics[it.topic].c++;levels[it.level].c++;}});
  const total=Math.round((sc.mc+sc.tf+sc.sa)*100)/100;
  return {items,sc,total,topics,levels,errs,qres};
}
function pct(o){return o.n?Math.round(100*o.c/o.n):0;}
function updateWeak(r){
  TKEYS.forEach(k=>{if(r.topics[k].n)state.topicPct[k]=pct(r.topics[k]);});
  state.weak=TKEYS.filter(k=>state.topicPct[k]!==undefined&&state.topicPct[k]<80).sort((a,b)=>state.topicPct[a]-state.topicPct[b]);
}

function setFeed(id,msg,cls){
  const box=document.querySelector(`#q-${id} .feedbox`);
  if(box)box.innerHTML=`<div class="feed ${cls}" role="status">${msg}</div>`;
}
function practiceCheck(id){
  const q=S.list.find(x=>x.id===id);if(!q)return;
  const P=state.pr[id]||(state.pr[id]={attempts:0,done:false,tried:[]});
  if(P.done)return;
  const a=state.ans[id];
  if(q.type==='mc'&&a==null)return setFeed(id,'Hãy chọn một đáp án trước.','info');
  if(q.type==='tf'){const arr=a||[];if(q.items.some((_,j)=>typeof arr[j]!=='boolean'))return setFeed(id,'Hãy chọn Đúng hoặc Sai cho cả 4 ý trước.','info');}
  if(q.type==='sa'&&String(a||'').trim()==='')return setFeed(id,'Hãy nhập đáp án trước.','info');
  P.attempts++;
  const oks=evalQ(q,a),all=oks.every(Boolean);
  if(P.attempts===1){P.first=oks;P.firstAns=JSON.parse(JSON.stringify(a));}
  if(all){
    P.done=true;P.final=true;P.cls='ok';
    P.msg=P.attempts===1?'Đúng rồi!':'Đúng ở lần thử thứ hai.';
  }else if(P.attempts===1){
    P.cls='bad';
    if(q.type==='mc'){
      const e=q.opts[a].err;P.tried.push(a);delete state.ans[id];
      P.msg='Chưa đúng.'+(e?' '+e:'')+' Hãy chọn lại một đáp án khác.';
    }else if(q.type==='tf'){
      const k=oks.filter(Boolean).length;P.msg=`Mới đúng ${k}/${q.items.length} ý. Hãy xem lại các ý và thử một lần nữa.`;
    }else P.msg='Đáp án chưa đúng. Hãy kiểm tra lại cách tính và thử một lần nữa.';
  }else{
    P.done=true;P.final=false;P.cls='bad';P.msg='Chưa đúng. Đáp án và lời giải ở bên dưới.';
  }
  let g=null;
  if(P.done){g=GM.onPractice(!!P.final,P.attempts,q.level||(q.items&&q.items[0]&&q.items[0].level)||'TH');if(g&&g.xp)P.msg+=' +'+g.xp+' XP';}
  const el=document.getElementById('q-'+id);
  el.outerHTML=CARD[q.type](q,S.idx[id]);
  updateProgress();
  GM.fx(g,document.getElementById('q-'+id));
}

    <section class="card stack" style="margin-top:18px">
      <div><label class="fl" for="codes">Mã kết quả</label><textarea id="codes" placeholder="${CODE_PREFIX}eyJ2IjoxLC..."></textarea></div>
      <div class="row"><button class="btn" id="analyze">Tổng hợp</button><button class="btn ghost" id="clearc">Xóa</button></div>
      <div id="tout" aria-live="polite"></div>
    </section>`;
}
function decodeCode(line){
  line=line.trim();if(!line.startsWith(CODE_PREFIX))return null;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(line.slice(CODE_PREFIX.length)))));if(o&&o.t&&typeof o.s==='number')return o;}catch(e){}
  return null;
}
function analyzeCodes(){
  const lines=document.getElementById('codes').value.split(/\r?\n/).filter(l=>l.trim());
  const rows=[],bad=[];let other=0;
  lines.forEach((l,i)=>{const o=decodeCode(l);if(o)rows.push(o);else{bad.push(i+1);if(/^[A-Z0-9]{2,4}-/.test(l.trim())&&!l.trim().startsWith(CODE_PREFIX))other++;}});
  const out=document.getElementById('tout');
  if(!rows.length){out.innerHTML=`<div class="warnbar">${lines.length?`Không đọc được mã nào. Hãy kiểm tra mã đã được sao chép đầy đủ, bắt đầu bằng ${CODE_PREFIX}.${other?' Có mã của bài khác (ví dụ Tam giác bằng nhau): hãy dán mã đó ở trang của bài ấy.':''}`:'Hãy dán ít nhất một mã kết quả.'}</div>`;return;}
  const cell=o=>{if(!o||!o[1])return '<td class="cell">–</td>';const p=Math.round(100*o[0]/o[1]);return `<td class="cell ${status(p)[0]}">${p}%</td>`;};
  const avg=TKEYS.map(k=>{let c=0,n=0;rows.forEach(r=>{if(r.t[k]){c+=r.t[k][0];n+=r.t[k][1];}});return [c,n];});
  const mean=rows.reduce((s,r)=>s+r.s,0)/rows.length;
  const timed=rows.filter(r=>typeof r.m==='number'),meanT=timed.length?timed.reduce((s,r)=>s+r.m,0)/timed.length:null;
  const tcell=r=>typeof r.m==='number'?fmtTime(r.m):'–';
  const flag=r=>(typeof r.m==='number'&&r.m<0.25*(r.L||1800)&&r.s<5)?' <span class="chip">Làm nhanh, điểm thấp</span>':'';
  const chips=r=>(r.c?` <span class="chip">Lớp ${esc(r.c)}</span>`:'')+(r.q==='quick'?' <span class="chip">Nhanh 5 phút</span>':r.q==='hard'?' <span class="chip">Thử thách 30 phút</span>':'')+(r.k?` <span class="chip">Mã đề ${esc(r.k)}</span>`:'');
  const weakCount=TKEYS.map(k=>rows.filter(r=>r.t[k]&&r.t[k][1]&&100*r.t[k][0]/r.t[k][1]<50).length);
  const worst=TKEYS.map((k,i)=>({k,p:avg[i][1]?100*avg[i][0]/avg[i][1]:100})).sort((a,b)=>a.p-b.p)[0];
  out.innerHTML=`${bad.length?`<div class="warnbar" style="margin:0 0 12px">Bỏ qua ${bad.length} dòng không đọc được (dòng ${bad.join(', ')}).${other?' Có mã của bài khác, hãy dán ở trang của bài ấy.':''}</div>`:''}
    <p style="margin:0 0 10px"><b>${rows.length}</b> học sinh · điểm trung bình <b>${fmt(mean)}</b>. Nội dung cả lớp còn yếu nhất: <b>${TOPICS[worst.k].name}</b> (${Math.round(worst.p)}%).</p>
    <div class="tablewrap"><table><thead><tr><th>Học sinh</th><th>Điểm</th><th>Thời gian</th>${TKEYS.map(k=>`<th>${TOPICS[k].short}</th>`).join('')}</tr></thead><tbody>
    ${rows.sort((a,b)=>a.s-b.s).map(r=>`<tr><td>${esc(r.n)}${chips(r)}${flag(r)}</td><td><b>${fmt(r.s)}</b></td><td>${tcell(r)}</td>${TKEYS.map(k=>cell(r.t[k])).join('')}</tr>`).join('')}
    <tr><td><b>Cả lớp</b></td><td><b>${fmt(mean)}</b></td><td>${meanT===null?'–':fmtTime(meanT)}</td>${avg.map(cell).join('')}</tr>
    <tr><td class="muted">Số em dưới 50%</td><td></td><td></td>${weakCount.map(n=>`<td class="cell">${n}</td>`).join('')}</tr>
    </tbody></table></div>
    <p class="small muted" style="margin:10px 0 0">Màu: xanh từ 80%, vàng từ 50% đến dưới 80%, đỏ dưới 50%. Các em được xếp từ điểm thấp đến cao để dễ thấy em cần hỗ trợ. Nhãn "Làm nhanh, điểm thấp" hiện khi em nộp bài trong chưa đầy một phần tư thời gian cho phép mà dưới 5 điểm, thường là em chưa làm kỹ nên cần hỏi lại.</p>`;
}

/* ============ Điều hướng và sự kiện ============ */
function render(){
  const gv=location.hash==='#giao-vien';
  document.getElementById('nav-hs').setAttribute('aria-current',gv?'false':'page');
  document.getElementById('nav-gv').setAttribute('aria-current',gv?'page':'false');
  if(gv){stopTimer();$app.innerHTML=teacherHTML();GM.refresh();return;}
  if(state.view==='home'){stopTimer();$app.innerHTML=homeHTML();}
  else if(state.view==='quiz'){$app.innerHTML=quizHTML();updateProgress();startTimer();}
  else{stopTimer();$app.innerHTML=resultHTML();if(SHEET_URL&&S.mode!=='practice'&&state.sentCode!==makeCode(state.result))sendResult();else if(SHEET_URL&&S.mode!=='practice')setSent('Đã gửi kết quả cho giáo viên.');}
  window.scrollTo(0,0);
  GM.refresh();GM.sync();
}
function normCode(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'');}
function withCode(mode,fn){
  if(!state.code){fn();return;}
  RNG=mulberry32(hashStr(mode+'|'+state.code));SEEDED=true;
  try{fn();}finally{RNG=Math.random;SEEDED=false;}
}
function startTest(){if(!GM.gate('test',null,state.code,startTest))return;withCode('test',buildTest);state.view='quiz';render();}
function startQuick(){if(!GM.gate('quick',null,state.code,startQuick))return;withCode('quick',buildQuick);state.view='quiz';render();}
function startHard(){if(!GM.gate('hard',null,state.code,startHard))return;withCode('hard',buildHard);state.view='quiz';render();}
function startPack(spec){if(!GM.gate('practice',spec,'',function(){startPack(spec);}))return;if(spec.kind==='pisa')buildPisa();else buildPractice(spec);state.view='quiz';render();}
// Gói kế tiếp sau khi luyện xong: mức độ kế tiếp hoặc nội dung kế tiếp (gói cuối thì không có)
function nextSpec(){
  if(!S||S.mode!=='practice'||!S.spec)return null;
  const sp=S.spec,list=sp.kind==='level'?Object.keys(LEVELS):sp.kind==='topic'?TKEYS:[],i=list.indexOf(sp.val);
  return i>=0&&i<list.length-1?{kind:sp.kind,val:list[i+1]}:null;
}
const specName=sp=>sp.kind==='level'?LEVELS[sp.val]:TOPICS[sp.val].short;
function parsePack(s){
  if(s==='weak')return {kind:'weak',topics:state.weak.slice()};
  const [kind,val]=s.split(':');return {kind,val};
}
function finish(force){
  const test=S.mode!=='practice';
  const left=test?totalItems()-answered():S.list.length-doneCount();
  if(left>0&&!force){
    const w=document.getElementById('warn');
    w.innerHTML=test
      ?`<div class="warnbar" role="alert">Còn <b>${left}</b> ý chưa trả lời. Những ý này sẽ tính là chưa đúng.<div class="row" style="margin-top:10px"><button class="btn sm" id="force">Vẫn nộp bài</button><button class="btn ghost sm" id="keep">Làm tiếp</button></div></div>`
      :`<div class="warnbar" role="alert">Còn <b>${left}</b> câu chưa kiểm tra xong. Những câu này sẽ tính là chưa đúng ngay lần đầu.<div class="row" style="margin-top:10px"><button class="btn sm" id="force">Vẫn xem kết quả</button><button class="btn ghost sm" id="keep">Làm tiếp</button></div></div>`;
    w.scrollIntoView({block:'center'});return;
  }
  stopTimer();
  state.elapsed=Math.floor((Date.now()-state.t0)/1000);
  if(test)state.elapsed=Math.min(state.elapsed,LIMIT[S.mode]);
  state.result=grade();updateWeak(state.result);state.gm=GM.onFinish(state.result,S.mode);state.view='result';render();
}
loadHS();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hsma'){e.preventDefault();checkHS();}});
document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-pack]');
  if(pk&&!pk.disabled){startPack(parsePack(pk.dataset.pack));return;}
  const ck=e.target.closest('.chk');
  if(ck){practiceCheck(ck.dataset.q);return;}
  const id=e.target.id;
  if(id==='start'||id==='startq'||id==='starth'){if(!needHS()){state.name=document.getElementById('nm').value.trim();state.cls=normCode(document.getElementById('cls').value);}state.code=normCode(document.getElementById('mcode').value);
    if(id==='start')startTest();else if(id==='starth')startHard();else startQuick();}
  else if(id==='hsgo')checkHS();
  else if(id==='hsout'){saveHS(null);state.view='home';render();}
  else if(id==='submit')finish(false);
  else if(id==='force')finish(true);
  else if(id==='keep')document.getElementById('warn').innerHTML='';
  else if(id==='back'){state.view='home';render();}
  else if(id==='again'){if(S.mode==='test')startTest();else if(S.mode==='quick')startQuick();else if(S.mode==='hard')startHard();else startPack(S.spec.kind==='weak'?{kind:'weak',topics:state.weak.length?state.weak.slice():S.spec.topics}:S.spec);}
  else if(id==='weakpack')startPack({kind:'weak',topics:state.weak.slice()});
  else if(id==='nextpack'){const n=nextSpec();if(n)startPack(n);}
  else if(id==='home'){state.view='home';render();}
  else if(id==='copy'){
    const t=document.getElementById('code'),m=document.getElementById('copied');
    t.focus();t.select();
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{m.textContent='Đã sao chép.';}).catch(()=>{m.textContent='Hãy nhấn giữ vùng chọn rồi chọn Sao chép.';});
  }
  else if(id==='resend')sendResult();
  else if(id==='analyze')analyzeCodes();
  else if(id==='clearc'){document.getElementById('codes').value='';document.getElementById('tout').innerHTML='';}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.type!=='radio')return;
  const m=t.name.match(/^(.+)-(\d)$/);
  if(m){const a=state.ans[m[1]]||(state.ans[m[1]]=[]);a[+m[2]]=t.value==='1';}
  else state.ans[t.name]=+t.value;
  updateProgress();
});
document.addEventListener('input',e=>{
  const id=e.target.dataset&&e.target.dataset.sa;
  if(id){state.ans[id]=e.target.value;updateProgress();}
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
